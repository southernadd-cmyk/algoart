name: Rebuild press pack
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_press_pack.py'
      - '.github/workflows/build-press-pack.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install reportlab pillow
      - run: python scripts/build_press_pack.py
      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add press/PROPORTION_PIECE_Press_Kit.pdf press/PROPORTION_PIECE_Media_Pack.zip
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate press PDF and illustrated media ZIP"
            git push
          fi
