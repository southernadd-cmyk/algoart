name: ALGO ART one-off V3 social test burst

on:
  push:
    paths:
      - '.github/workflows/social-v3-test-burst.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: algoart-social-v3-test-burst
  cancel-in-progress: false

jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_SITE_URL: https://southernadd-cmyk.github.io/algoart/
      ALGOART_LOCAL_URL: http://127.0.0.1:4173/
      SOCIAL_DATE: '2026-10-05'
      SOCIAL_COUNT: '3'
      SOCIAL_SEED_SALT: 'v3-live-test-c'
      BURST_ID: 'v3-live-2026-10-05-c'
      RELEASE_TAG: algoart-social-live
      GH_TOKEN: ${{ github.token }}
      LIVE_PUBLISHING: 'true'
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Start local ALGO ART
        run: |
          python3 -m http.server 4173 >/tmp/algoart-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/algoart-http.log
          exit 1

      - name: Generate three V3 artworks
        run: npm run social:generate

      - name: Verify exact V3 batch before publishing
        shell: bash
        run: |
          set -euo pipefail
          test -s "social-output/$SOCIAL_DATE/queue.json"
          COUNT="$(jq '.entries | length' "social-output/$SOCIAL_DATE/queue.json")"
          test "$COUNT" = "3"
          jq -e 'all(.entries[]; .rendererVersion == 3)' "social-output/$SOCIAL_DATE/queue.json" >/dev/null
          jq -e 'all(.entries[]; (.shareUrl | contains("?v=3&")))' "social-output/$SOCIAL_DATE/queue.json" >/dev/null
          echo "Verified 3 renderer-v3 artworks with explicit v=3 share URLs."
          jq -r '.entries[] | [.id,.seed,.mode,.shareUrl] | @tsv' "social-output/$SOCIAL_DATE/queue.json"

      - name: Ensure public media release
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "ALGO/ART social publishing media" \
              --notes "Rolling public media host for automated @artalgorithm posts."
          fi

      - name: Publish three V3 posts to Instagram and Threads
        shell: bash
        run: |
          set -euo pipefail

          for INDEX in 0 1 2; do
            NUM=$(printf '%02d' $((INDEX + 1)))
            export INDEX
            ITEM="$(node automation/backfill-item.mjs)"

            IMAGE_PATH="$(printf '%s' "$ITEM" | jq -r '.imagePath')"
            SHARE_URL="$(printf '%s' "$ITEM" | jq -r '.shareUrl')"
            IG_B64="$(printf '%s' "$ITEM" | jq -r '.instagramCaptionB64')"
            TH_B64="$(printf '%s' "$ITEM" | jq -r '.threadsCaptionB64')"
            ALT_B64="$(printf '%s' "$ITEM" | jq -r '.altTextB64')"

            printf '%s' "$SHARE_URL" | grep -Fq '?v=3&'

            ASSET="${BURST_ID}-${NUM}.jpg"
            IG_MARKER="${BURST_ID}-${NUM}-instagram.txt"
            TH_MARKER="${BURST_ID}-${NUM}-threads.txt"

            cp "$IMAGE_PATH" "/tmp/$ASSET"
            gh release upload "$RELEASE_TAG" "/tmp/$ASSET" --clobber

            export MEDIA_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$ASSET"
            curl -fL --retry 4 --retry-delay 2 -o "/tmp/check-${NUM}.jpg" "$MEDIA_URL"
            test -s "/tmp/check-${NUM}.jpg"

            ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"

            if ! printf '%s\n' "$ASSETS" | grep -Fxq "$IG_MARKER"; then
              export CAPTION="$(printf '%s' "$IG_B64" | base64 --decode)"
              export ALT_TEXT="$(printf '%s' "$ALT_B64" | base64 --decode)"
              node automation/publish-instagram.mjs
              printf 'published v3 test item %s to Instagram\n' "$NUM" > "/tmp/$IG_MARKER"
              gh release upload "$RELEASE_TAG" "/tmp/$IG_MARKER" --clobber
            else
              echo "Instagram item $NUM already published; skipping."
            fi

            ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"

            if ! printf '%s\n' "$ASSETS" | grep -Fxq "$TH_MARKER"; then
              export CAPTION="$(printf '%s' "$TH_B64" | base64 --decode)"
              export ALT_TEXT="$(printf '%s' "$ALT_B64" | base64 --decode)"
              node automation/publish-threads.mjs
              printf 'published v3 test item %s to Threads\n' "$NUM" > "/tmp/$TH_MARKER"
              gh release upload "$RELEASE_TAG" "/tmp/$TH_MARKER" --clobber
            else
              echo "Threads item $NUM already published; skipping."
            fi

            echo "Completed V3 artwork $NUM / 03."
            if [ "$INDEX" -lt 2 ]; then sleep 8; fi
          done

      - name: Append V3 artworks to Daily Gallery
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const day = process.env.SOCIAL_DATE;
          const socialDir = path.resolve('social-output', day);
          const galleryDir = path.resolve('gallery', day);
          const queuePath = path.join(socialDir, 'queue.json');
          const metaPath = path.join(galleryDir, 'meta.json');

          const queue = JSON.parse(await fs.readFile(queuePath, 'utf8'));
          const meta = JSON.parse(await fs.readFile(metaPath, 'utf8'));

          const existing = meta.entries.map((entry) => ({
            id: entry.id,
            seed: entry.seed,
            mode: entry.mode,
            series: entry.series,
            imageFile: entry.imageFile,
            shareUrl: entry.shareUrl,
            rendererVersion: entry.rendererVersion || 3,
            settings: entry.settings,
            copy: { altText: entry.altText }
          }));

          for (const entry of existing) {
            await fs.copyFile(
              path.join(galleryDir, entry.imageFile),
              path.join(socialDir, entry.imageFile)
            );
          }

          const existingSeeds = new Set(existing.map((entry) => entry.seed));
          const fresh = [];

          for (const item of queue.entries) {
            if (existingSeeds.has(item.seed)) continue;

            const number = existing.length + fresh.length + 1;
            const suffix = item.imageFile.replace(/^\\d{4}-\\d{2}-\\d{2}-\\d{2}-/, '');
            const imageFile = `${day}-${String(number).padStart(2, '0')}-${suffix}`;
            await fs.rename(
              path.join(socialDir, item.imageFile),
              path.join(socialDir, imageFile)
            );

            fresh.push({
              ...item,
              id: `${day}-${String(number).padStart(2, '0')}`,
              imageFile
            });
          }

          queue.entries = [...existing, ...fresh];
          await fs.writeFile(queuePath, JSON.stringify(queue, null, 2) + '\\n');
          console.log(`Combined gallery queue now contains ${queue.entries.length} artworks.`);
          NODE

          npm run gallery:build

          test "$(jq '.count' "gallery/$SOCIAL_DATE/meta.json")" = "12"
          test "$(find "gallery/$SOCIAL_DATE" -maxdepth 1 -name '*.jpg' | wc -l | tr -d ' ')" = "12"
          grep -q "Twelve studies" "gallery/$SOCIAL_DATE/index.html"
          grep -q "LATEST: 12 STUDIES" "gallery/index.html"

      - name: Persist twelve-artwork Daily Gallery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules social-output package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Daily Gallery already contains all 12 artworks."
          else
            git commit -m "Expand October 5 Daily Gallery to twelve artworks"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### ALGO/ART V3 social test burst" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: 3 newly generated renderer-v3 artworks" >> "$GITHUB_STEP_SUMMARY"
          echo "- Instagram: same 3 artworks" >> "$GITHUB_STEP_SUMMARY"
          echo "- Threads: same 3 artworks" >> "$GITHUB_STEP_SUMMARY"
          echo "- Share links: explicit v=3" >> "$GITHUB_STEP_SUMMARY"
          echo "- Daily automation: unchanged" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gallery: expanded from 9 to 12 studies using the exact V3 social artworks" >> "$GITHUB_STEP_SUMMARY"
