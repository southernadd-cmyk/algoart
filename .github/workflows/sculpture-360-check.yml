name: Sculpture Lab deterministic 360° rules validation
on:
  pull_request:
    paths:
      - 'gallery/sculpture-lab/**'
      - 'tests/sculpture-rules.test.mjs'
      - 'tests/sculpture-csg.test.mjs'
      - 'tests/sculpture-material-surface.test.mjs'
      - 'tests/sculpture-hybrid-supports.test.mjs'
      - 'tests/sculpture-recorded-gestures.test.mjs'
      - 'tests/sculpture-360-lab.browser.mjs'
      - 'tests/sculpture-v2.test.mjs'
      - '.github/workflows/sculpture-360-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts @jscad/modeling@2.13.0
          npx playwright install --with-deps chromium
      - name: Verify deterministic rules engine
        run: |
          node --check gallery/sculpture-lab/sculpture-rules.mjs
          node --check gallery/sculpture-lab/sculpture-csg.mjs
          node --check gallery/sculpture-lab/material-surface.mjs
          node --check gallery/sculpture-lab/hybrid-supports.mjs
          node --check gallery/sculpture-lab/source-echo.mjs
          node --check gallery/sculpture-lab/recorded-gestures.mjs
          node --check gallery/sculpture-lab/source-bridge.mjs
          node --check gallery/sculpture-lab/lab-360.mjs
          node --check gallery/sculpture-lab/lab-v2.mjs
          node --check gallery/sculpture-lab/sculpture-v2-features.mjs
          node --check gallery/sculpture-lab/sculpture-v2-graph.mjs
          node --check gallery/sculpture-lab/sculpture-v2-engines.mjs
          node --test tests/sculpture-rules.test.mjs
          node --test tests/sculpture-csg.test.mjs
          node --test tests/sculpture-material-surface.test.mjs
          node --test tests/sculpture-hybrid-supports.test.mjs
          node --test tests/sculpture-recorded-gestures.test.mjs
          node --test tests/sculpture-v2.test.mjs
          if grep -E -i -n '(meshy|fal\.ai|image.to.3d|aiFiles|resetAI|MESHY_API_KEY)' \
            gallery/sculpture-lab/index.html gallery/sculpture-lab/lab-v2.mjs; then
            echo "Public sculpture lab must remain rules-only" >&2
            exit 1
          fi
      - name: Start local gallery HTTP server
        run: |
          python3 -m http.server 4173 >/tmp/sculpture-rule-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/gallery/sculpture-lab/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/sculpture-rule-http.log
          exit 1
      - name: Verify browser room and 360° camera controls on desktop/mobile
        run: node tests/sculpture-360-lab.browser.mjs
      - name: Upload test images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sculpture-rules-browser-shots
          if-no-files-found: ignore
          path: /tmp/sculpture-lab-*.png
