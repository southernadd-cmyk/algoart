name: Validate phi music suite on feature branch
on:
  push:
    branches: [feature/phi-music-triptych-20261107]
    paths:
      - 'gallery/visit/phi-music-compositions.mjs'
      - 'gallery/visit/phi-gramophone-music.mjs'
      - 'gallery/visit/index.html'
      - 'tests/phi-music-compositions.test.mjs'
      - '.github/workflows/phi-music-feature-test.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify phi notes and audio lifecycle
        run: |
          node --test tests/phi-music-compositions.test.mjs tests/gramophone-record.test.mjs
          node --check gallery/visit/phi-music-compositions.mjs
          node --check gallery/visit/phi-gramophone-music.mjs
          grep -q 'phi-music-triptych-20261107' gallery/visit/index.html
      - name: Build exact gallery production bundle
        run: |
          npm run gallery:bundle:phi
          node --check gallery/visit/gallery-phi-bundle.js
          test -s gallery/visit/gallery-phi-bundle.js
      - name: Commit reproducible built bundle to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery/visit/gallery-phi-bundle.js
          if git diff --cached --quiet; then
            echo 'Bundle matches sources.'
          else
            git commit -m 'Build preview phi music gallery bundle'
            git push origin HEAD:feature/phi-music-triptych-20261107
          fi
