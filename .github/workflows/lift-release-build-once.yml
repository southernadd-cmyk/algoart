name: Temporary isolated lift release bundle compiler
on:
  push:
    branches: [release/phi-lift-light-stability-20261106]
    paths:
      - '.github/workflows/lift-release-build-once.yml'
      - 'gallery/visit/gallery-phi.js'
      - 'gallery/visit/phi-stable-point-lights.mjs'
      - 'gallery/visit/phi-lift-destination-warmup.mjs'
permissions:
  contents: write
jobs:
  compile-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify camera-aware point-light regressions
        run: node --test tests/phi-lift-camera-light-release.test.mjs tests/phi-stable-point-lights-live.test.mjs tests/phi-lift-motion.test.mjs tests/gallery-entry-preparation.test.mjs
      - name: Generate exact production r187/N8AO bundle
        run: |
          npm run gallery:bundle:phi
          node --check gallery/visit/gallery-phi-bundle.js
          node --test tests/gallery-public-launch.test.mjs
          test -s gallery/visit/gallery-phi-bundle.js
      - name: Commit generated bundle to release branch (not main)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gallery/visit/gallery-phi-bundle.js
          if git diff --cached --quiet; then
            echo 'Production bundle already matches this release source'
          else
            git commit -m 'Compile lift-stable production gallery bundle from reviewed source'
            git push origin HEAD:release/phi-lift-light-stability-20261106
          fi
