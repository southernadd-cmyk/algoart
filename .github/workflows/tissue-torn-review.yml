name: Tissue torn-edge-only visual review
on:
  push:
    branches: [experiment/tissue-torn-edges-only]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tissue-torn-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Serve local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tissue-torn.log 2>&1 &
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Four matched V4 versus torn-edge-only comparisons
        run: node tests/tissue-torn-preview.mjs
      - name: Preserve historic V1-V4 reproducibility
        run: npm run test:tissue-colour
      - name: Commit review images to experiment branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/torn-edge-review/*.png
          if ! git diff --cached --quiet; then
            git commit -m 'Store torn-edge-only comparison images [skip ci]'
            git push origin HEAD:experiment/tissue-torn-edges-only
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: torn-v4-v5-comparisons
          path: tests/torn-edge-review/*.png
          retention-days: 14
