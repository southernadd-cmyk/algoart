name: Build and publish approved live caption optimisation
on:
  push:
    branches: [main]
    paths:
      - 'gallery/visit/gallery-phi.js'
      - 'gallery/visit/phi-caption-batch.mjs'
      - '.github/workflows/live-caption-bundle.yml'
permissions:
  contents: write
concurrency:
  group: live-caption-bundle-20261101
  cancel-in-progress: false
jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test live caption batching without changing artwork
        run: |
          node --test tests/phi-caption-batch.test.mjs
          node --check gallery/visit/gallery-phi.js
          node --check gallery/visit/phi-caption-batch.mjs
      - name: Build and verify live JavaScript
        run: |
          npm run gallery:bundle:phi
          node --check gallery/visit/gallery-phi-bundle.js
          node -e "const fs=require('node:fs'); const s=fs.readFileSync('gallery/visit/gallery-phi-bundle.js','utf8'); if(!s.includes('phi-batched-painting-captions')) process.exit(1);"
      - name: Cache bust and write verified build manifest
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const path='gallery/visit/index.html';
          const original=fs.readFileSync(path,'utf8');
          const matcher=/gallery-phi-bundle\.js\?v=[a-zA-Z0-9_-]+/g;
          const matches=original.match(matcher)||[];
          if(matches.length!==2)throw Error('Unexpected live module preload/import count: '+matches.length);
          const target='gallery-phi-bundle.js?v=live-caption-batch-20261101';
          fs.writeFileSync(path,original.replace(matcher,target));
          const bundle=fs.readFileSync('gallery/visit/gallery-phi-bundle.js');
          const sha256=createHash('sha256').update(bundle).digest('hex');
          const sourceRevision=execFileSync('git',['rev-parse','HEAD:gallery/visit/gallery-phi.js'],{encoding:'utf8'}).trim();
          const helperRevision=execFileSync('git',['rev-parse','HEAD:gallery/visit/phi-caption-batch.mjs'],{encoding:'utf8'}).trim();
          fs.writeFileSync('gallery/visit/caption-batch-build.json',JSON.stringify({
           feature:'caption-batching',enabledByDefault:true,
           bundleSha256:sha256,sourceRevision,helperRevision,
           buildCheck:'passed',testCheck:'passed',version:'live-caption-batch-20261101'
          },null,2)+'\n');
          JS
      - name: Publish live bundle and version atomically without overwriting changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          original_source=$(git rev-parse HEAD:gallery/visit/gallery-phi.js)
          original_helper=$(git rev-parse HEAD:gallery/visit/phi-caption-batch.mjs)
          git add gallery/visit/gallery-phi-bundle.js gallery/visit/index.html gallery/visit/caption-batch-build.json
          git commit -m "Release verified caption batching to live gallery"
          git pull --rebase origin main
          [[ "$(git rev-parse HEAD:gallery/visit/gallery-phi.js)" == "$original_source" ]] || { echo "Newer live source detected; release blocked"; exit 1; }
          [[ "$(git rev-parse HEAD:gallery/visit/phi-caption-batch.mjs)" == "$original_helper" ]] || { echo "Newer caption helper detected; release blocked"; exit 1; }
          git push origin HEAD:main
