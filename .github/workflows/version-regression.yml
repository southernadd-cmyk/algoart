name: ALGO ART renderer version regression

on:
  push:
    paths:
      - '.github/workflows/version-regression.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Verify legacy and v2 URL rendering
        run: |
          python3 -m http.server 4173 >/tmp/algoart-version-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          cat > /tmp/version-check.mjs <<'JS'
          import { chromium } from 'playwright';
          import crypto from 'node:crypto';

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:1200}});

          async function render(url){
            await page.goto(url,{waitUntil:'networkidle'});
            const result=await page.evaluate(()=>({
              data:document.getElementById('art').toDataURL('image/png'),
              rendererVersion:window.AlgoArt.rendererVersion,
              href:location.href
            }));
            result.hash=crypto.createHash('sha256').update(result.data).digest('hex');
            return result;
          }

          const base='http://127.0.0.1:4173/';
          const legacyParams='seed=LEGACY-FIELD-CHECK&mode=field&el=52&den=62&cx=58&neg=24&phi=94&rec=5&spi=65&ga=100&nest=38&pen=felt&th=9&wob=32&od=5&op=76&pr=44&dry=15&curve=55&shape=65&overlap=48&rot=80&ln=1&ci=1&re=1&po=1&ar=1&pal=marker&cols=5&sat=84&bri=52&paper=%23f5f0e6&grain=18';
          const oldImplicit=await render(base+'?'+legacyParams);
          const oldExplicit=await render(base+'?v=1&'+legacyParams);
          const oldAsV2=await render(base+'?v=2&'+legacyParams);

          if(oldImplicit.rendererVersion!==1) throw new Error('Unversioned legacy Field did not resolve to v1');
          if(!oldImplicit.href.includes('v=1')) throw new Error('Legacy URL was not canonicalised to v1');
          if(oldImplicit.hash!==oldExplicit.hash) throw new Error('Implicit legacy Field does not pixel-match explicit v1');
          if(oldExplicit.hash===oldAsV2.hash) throw new Error('v1 and v2 Field unexpectedly render identically');

          const burstParams='seed=AA-20261005-04-72522&mode=field&el=43&den=46&cx=63&neg=30&phi=97&rec=6&spi=54&ga=86&nest=26&pen=broad&th=9&wob=22&od=5&op=87&pr=42&dry=18&curve=47&shape=54&overlap=43&rot=81&ln=1&ci=1&re=1&po=1&ar=1&pal=marker&cols=4&sat=76&bri=49&paper=%23f7f1e7&grain=20';
          const burstImplicit=await render(base+'?'+burstParams);
          const burstExplicit=await render(base+'?v=2&'+burstParams);

          if(burstImplicit.rendererVersion!==2) throw new Error('Known improved unversioned Field did not resolve to v2');
          if(!burstImplicit.href.includes('v=2')) throw new Error('Known improved URL was not canonicalised to v2');
          if(burstImplicit.hash!==burstExplicit.hash) throw new Error('Known improved Field does not pixel-match explicit v2');

          const fresh=await render(base);
          if(fresh.rendererVersion!==2||!fresh.href.includes('v=2')) throw new Error('Fresh generator did not default to v2');

          console.log(JSON.stringify({
            legacyHash:oldImplicit.hash,
            v2Hash:oldAsV2.hash,
            burstHash:burstImplicit.hash,
            freshVersion:fresh.rendererVersion
          },null,2));
          await browser.close();
          JS
          node /tmp/version-check.mjs
