name: Release A R2 isolated one-shot smoke test

# This intentionally has no schedule and does not run on main.
# It runs ONLY for the uniquely named launch commit on the isolated branch.
on:
  push:
    branches:
      - plan/archive-storage-foundation-20261109
    paths:
      - .github/workflows/r2-isolated-smoke.yml

permissions:
  contents: read

concurrency:
  group: proportion-piece-r2-release-a-one-shot
  cancel-in-progress: false

jobs:
  round-trip:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Run isolated R2 smoke test 2026-11-09' && github.ref == 'refs/heads/plan/archive-storage-foundation-20261109' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: archive-r2-test
    steps:
      - name: Get only the isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check syntax and local cleanup without cloud access
        run: |
          python -m py_compile automation/r2-isolated-smoke.py
          python automation/r2-isolated-smoke.py --self-test

      - name: Install isolated S3-compatible client
        run: python -m pip install --disable-pip-version-check 'boto3>=1.34,<2'

      - name: Upload, download, SHA-256-check and remove ONE temporary object
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python automation/r2-isolated-smoke.py

      - name: Summarise result
        if: always()
        run: |
          echo '### Release A — R2 isolated test' >> "$GITHUB_STEP_SUMMARY"
          echo 'Single scratch test object only; gallery/media and production workflows were not modified.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Success requires upload, HEAD, downloaded SHA-256 verification, deletion and post-deletion 404.' >> "$GITHUB_STEP_SUMMARY"
