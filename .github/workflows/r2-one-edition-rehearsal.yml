name: Release A — one 16-work R2 edition migration rehearsal

# Run ONE time on isolated branch; no live publishing, uploads or deletions.
# R2 media-only bucket and dedicated archive-media-test credentials are reused.
# Permanent objects and private archive bucket never touched.
# Corrected offline rehearsal role guard; retry after no uploads on first run.
on:
  push:
    branches:
      - plan/archive-storage-foundation-20261109
    paths:
      - .github/workflows/r2-one-edition-rehearsal.yml

permissions:
  contents: read

concurrency:
  group: pp-r2-one-edition-rehearsal
  cancel-in-progress: false

jobs:
  verify-entire-edition:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/plan/archive-storage-foundation-20261109' && github.event.head_commit.message == 'Run isolated historical R2 edition rehearsal 2026-11-09' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    environment:
      name: archive-media-test
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      R2_MEDIA_ACCESS_KEY_ID: ${{ secrets.R2_MEDIA_ACCESS_KEY_ID }}
      R2_MEDIA_SECRET_ACCESS_KEY: ${{ secrets.R2_MEDIA_SECRET_ACCESS_KEY }}
      R2_MEDIA_BUCKET: proportion-piece-media-test
      R2_MEDIA_PUBLIC_URL: ${{ vars.R2_MEDIA_PUBLIC_URL }}
      R2_EDITION_REHEARSAL_MANIFEST: /tmp/pp-edition-rehearsal/manifest.json
      R2_EDITION_REHEARSAL_REPORT: /tmp/pp-edition-rehearsal/report.json
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Checkout ISOLATED test source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout published edition READ-ONLY
        uses: actions/checkout@v4
        with:
          ref: main
          path: live-snapshot
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated R2 and 3-browser dependencies
        run: |
          python -m pip install --disable-pip-version-check 'boto3>=1.34,<2' 'requests>=2.31,<3' 'playwright==1.64.0'
          python -m playwright install --with-deps chromium firefox webkit
      - name: Validate immutable gallery edition and safety guard OFFLINE
        run: |
          python -m py_compile automation/r2-one-edition-rehearsal.py
          python automation/r2-one-edition-rehearsal.py self-test
          python - <<'PY'
          from pathlib import Path
          s=Path('automation/r2-one-edition-rehearsal.py').read_text()
          assert 'BUCKET = "proportion-piece-media-test"' in s
          assert 'PRIVATE_BUCKET = "proportion-piece-archive-test"' in s
          assert 'Bucket=PRIVATE_BUCKET' not in s
          assert 'delete_object(Bucket=BUCKET, Key=key)' in s
          print('Guard passed: separate media-only credentials, exact-run owned-key cleanup')
          PY
      - name: Stage ONE edition (16 JPEG, 32 WebP, 1 preview, 1 sculpture data)
        run: python automation/r2-one-edition-rehearsal.py stage
      - name: Test all 50 public objects, live gallery DOM and three-browser tower WebGL textures
        run: python automation/r2-one-edition-rehearsal.py verify
      - name: Remove ONLY this run's 50 disposable R2 objects
        if: always()
        run: python automation/r2-one-edition-rehearsal.py cleanup
      - name: Upload evidence; no secrets or binary images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-a-one-edition-rehearsal-${{ github.run_id }}
          path: |
            /tmp/pp-edition-rehearsal/report.json
            /tmp/pp-edition-rehearsal/manifest.json
          if-no-files-found: warn
          retention-days: 45
      - name: Explain remaining production release gates
        if: always()
        run: |
          {
            echo '### R2 migration rehearsal (test bucket only)'
            echo '- Entire 9 Nov published 16-artwork edition tested in existing public media test bucket.'
            echo '- Every test object written to a unique run prefix and cleaned by exact manifested key.'
            echo '- Actual GitHub Pages gallery DOM used, R2 pictures swapped ONLY in browser memory.'
            echo '- Media checksum, strict CORS, exact public links, WebGL texture uploads tested.'
            echo '- LIVE gallery, scheduled publishing, private backups and historical JPEGs unchanged.'
            echo '- Not production-ready: r2.dev is development-only; custom-domain CDN, cache and actual Quest 3 gallery need their own gates.'
          } >> "$GITHUB_STEP_SUMMARY"