name: Deploy ALGO ART to Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'test/**'
      - 'css/**'
      - 'fonts/**'
      - 'js/**'
      - 'gallery/**'
      - 'press/**'
      - 'about/**'
      - 'reels/**'
      - 'favicon.svg'
      - 'social-card.svg'
      - 'social-card.png'
      - 'robots.txt'
      - 'google*.html'
      - 'B732C1640DA947DB8E65C914FA8703EE.txt'
      - '.github/workflows/indexnow-notify.yml'
      - '.github/workflows/deploy-pages.yml'
      - 'sitemap.xml'
      - '.nojekyll'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Refresh generated bundles in deployment workspace
        run: |
          npm run gallery:bundle
          npm run gallery:bundle:phi
      - name: Validate public gallery before uploading the site
        run: |
          node automation/validate-phi-archive.mjs
          node --test tests/phi-shell-cache.test.mjs tests/phi-sculpture-stage.test.mjs tests/phi-reception-vault.test.mjs
          node --test tests/gallery-public-launch.test.mjs tests/phi-full-engine-adapter.test.mjs tests/phi-presentation.test.mjs
          node --check gallery/visit/gallery-bundle.js
          node --check gallery/visit/gallery-phi-bundle.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
