name: Export sharing — exact social links and Instagram files
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/app.js'
      - 'js/social-share.js'
      - 'css/style.css'
      - 'tests/export-social-sharing.test.mjs'
      - '.github/workflows/export-social-sharing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sharing-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify unchanged renderer and editor
        run: |
          node --check js/social-share.js
          node --check js/app.js
          node --check tests/export-social-sharing.test.mjs
          npm run test:renderer-lock
          npm run test:control-ranges
          node tests/materials-ui.test.mjs
      - name: Start static editor
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/social-share-http.log 2>&1 &
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/social-share-http.log; exit 1
      - name: Test links, compact settings and desktop/mobile social actions
        run: node tests/export-social-sharing.test.mjs
