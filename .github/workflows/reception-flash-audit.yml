name: Reception video frame-by-frame flash audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reception-flash-audit.yml'
      - 'automation/gallery-flash-audit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flash-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical screening dependency
        run: python -m pip install numpy==2.2.6
      - name: Confirm published media match manifests
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          for parent in [Path('gallery/visit/touchdesigner'),Path('gallery/visit/touchdesigner/bank-two')]:
              manifest=json.loads((parent/'six-screen.json').read_text())['atlas']
              path=parent/manifest['file']
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest==manifest['sha256'],str(path)
              print(f'Verified {path} ({len(path.read_bytes())} bytes)')
          PY
      - name: Decode every video frame and screen for flash candidates
        run: python automation/gallery-flash-audit.py
      - name: Upload frame audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reception-frame-by-frame-flash-audit
          path: flash-audit-results/
          if-no-files-found: warn
