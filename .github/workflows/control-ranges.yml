name: Control range consistency
on:
  push:
    branches: [main]
    paths:
      - 'js/generator.js'
      - 'js/control-help.js'
      - 'index.html'
      - 'tests/control-ranges.test.mjs'
      - 'tests/organic-version.test.mjs'
      - 'tests/growth-v8.test.mjs'
      - 'tests/renderer-lock.test.mjs'
      - 'tests/fixtures/**'
      - 'js/app.js'
      - 'js/random.js'
      - 'js/phi.js'
      - 'js/palettes.js'
      - 'js/marker.js'
      - 'js/oil-render.js'
      - 'tests/oil-render.test.mjs'
      - 'js/export.js'
      - 'css/style.css'
      - 'package.json'
      - '.github/workflows/control-ranges.yml'
  pull_request:
    branches: [main]
    paths:
      - 'js/generator.js'
      - 'js/control-help.js'
      - 'index.html'
      - 'tests/control-ranges.test.mjs'
      - 'tests/organic-version.test.mjs'
      - 'tests/growth-v8.test.mjs'
      - 'tests/renderer-lock.test.mjs'
      - 'tests/fixtures/**'
      - 'js/app.js'
      - 'js/random.js'
      - 'js/phi.js'
      - 'js/palettes.js'
      - 'js/marker.js'
      - 'js/oil-render.js'
      - 'tests/oil-render.test.mjs'
      - 'js/export.js'
      - 'css/style.css'
      - 'package.json'
      - '.github/workflows/control-ranges.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control-ranges:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check effective ranges and artwork setting preservation
        run: npm run test:control-ranges

      - name: Check renderer compatibility and Organic canvas growth
        run: npm run test:organic-version

      - name: Check V8 growth and V1–V7 recording fixtures
        run: npm run test:growth-v8

      - name: Prove published V8 renderer remains unchanged
        run: npm run test:renderer-lock

      - name: Prove oil painting is procedural and does not mutate V8 marks
        run: npm run test:oil-render
