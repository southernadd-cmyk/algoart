name: Encode all tower JPEGs as KTX2 (TEST ONLY)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/ktx2-all.trigger'
permissions:
  contents: read
concurrency:
  group: full-gallery-ktx2-archive-generation
  cancel-in-progress: true
jobs:
  fidelity-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce pixel-exact artwork requirement
        run: |
          echo "Lossy Basis ETC1S and UASTC cannot reproduce JPEG decoded pixels exactly."
          echo "Full artwork conversion disabled; archive JPEGs must remain byte-for-byte untouched."
          echo "KTX2 conversions will not be published until a lossless, verified pipeline exists."
