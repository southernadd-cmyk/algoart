name: Gallery entry performance profile
on:
  push:
    branches: ['codex/gallery-entry-performance-20261027']
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Profile live and test entry
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/gallery-http.log 2>&1 &
          node --test tests/gallery-atlas-startup.test.mjs tests/phi-static-architecture.test.mjs
          node tests/gallery-entry-profile.mjs candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-entry-profile
          path: entry-profile/
