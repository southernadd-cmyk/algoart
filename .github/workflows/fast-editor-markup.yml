name: Fast editor markup check
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/fast-editor-markup.test.mjs'
      - '.github/workflows/fast-editor-markup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  markup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/fast-editor-markup.test.mjs
