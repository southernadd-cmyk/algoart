name: Validate optimised gallery visitors

on:
  push:
    branches: [main]
    paths:
      - 'automation/validate-gallery-visitors.py'
      - '.github/workflows/gallery-visitors-optimize.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimise-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect original visitor composition
        run: python automation/validate-gallery-visitors.py inspect
      - name: Install glTF Transform CLI
        run: npm install --no-save --no-package-lock @gltf-transform/cli@4.5.1
      - name: Compress geometry and animations with Meshopt
        run: npx gltf-transform meshopt test/virtual-gallery/models/human-male-female-rigged.glb test/virtual-gallery/models/human-male-female-rigged-optimized.glb --level medium
      - name: Validate character rigs and compressed file
        run: python automation/validate-gallery-visitors.py verify
      - name: Prepare isolated rig-pose test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('test/virtual-gallery/visitors.mjs')
          s=p.read_text()
          s="import {MeshoptDecoder} from 'https://cdn.jsdelivr.net/npm/meshoptimizer@0.25.0/meshopt_decoder.module.js';\n"+s
          s=s.replace("new GLTFLoader().load('./models/human-male-female-rigged.glb'", "new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load('./models/human-male-female-rigged-optimized.glb'")
          p.write_text(s)
          PY
      - name: Install browser test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture validated male and female poses
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/gallery-test-server.log 2>&1 &
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import {mkdirSync} from 'node:fs';
          mkdirSync('visitor-pose-validation',{recursive:true});
          const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl']});
          try{
            const page=await browser.newPage({viewport:{width:1280,height:800}});
            await page.goto('http://127.0.0.1:4173/test/virtual-gallery/rig-debug.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>/^(PASS|FAIL|Failed to load)/.test(document.querySelector('#status')?.textContent||''),null,{timeout:60000});
            for(const [name,button] of [['standing','relaxed'],['rest','original'],['raised-arm','raise']]){
              if(button!=='relaxed')await page.locator('#'+button).click();
              await page.screenshot({path:'visitor-pose-validation/'+name+'.png',fullPage:true});
              const status=await page.locator('#status').textContent();
              if(!status.startsWith('PASS'))throw Error(name+': '+status+' '+await page.locator('#error').textContent());
            }
          }finally{await browser.close();}
          JS
      - name: Upload isolated pose screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gallery-visitors-meshopt-pose-validation
          path: visitor-pose-validation/*.png
          if-no-files-found: error
      - name: Upload candidate for isolated visual checks
        uses: actions/upload-artifact@v4
        with:
          name: gallery-visitors-meshopt-candidate
          path: test/virtual-gallery/models/human-male-female-rigged-optimized.glb
          if-no-files-found: error
