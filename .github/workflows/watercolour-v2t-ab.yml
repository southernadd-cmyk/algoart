name: Watercolour V2T controlled A/B benchmark
on:
  pull_request:
    paths:
      - 'js/watercolour-v2s.js'
      - 'js/cpu-material-versions.js'
      - 'tests/watercolour-v2t-ab.mjs'
      - '.github/workflows/watercolour-v2t-ab.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [default, swiftshader]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/algoart-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Controlled same-session V2T performance and parity
        env:
          BROWSER_PROFILE: ${{ matrix.profile }}
        run: node tests/watercolour-v2t-ab.mjs
