name: TEST static portal draw-call A/B screen
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phi-portal-batch-screen.yml'
      - 'tests/phi-portal-batch-parity.test.mjs'
      - 'tests/phi-portal-batch-screen.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check original portal geometry, normals, UVs and materials
        run: node --test tests/phi-portal-batch-parity.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Compile current TEST source for both A/B cases
        run: |
          ./node_modules/.bin/esbuild test/virtual-gallery/gallery-phi.js --bundle --minify --format=esm --platform=browser --target=es2022 --outfile=test/virtual-gallery/gallery-phi-bundle.js
          node --check test/virtual-gallery/gallery-phi-bundle.js
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/phi-portal-batch-http.log 2>&1 &
      - name: Compare identical architectural lift floors with portal batching off and on
        run: node tests/phi-portal-batch-screen.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phi-portal-batch-screen
          path: phi-portal-batch-screen/results.json
          if-no-files-found: ignore
