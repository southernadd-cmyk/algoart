name: Renderer V10 palette fidelity

on:
  pull_request:
    paths:
      - 'js/**'
      - 'tests/palette-coverage-v10.test.mjs'
      - 'tests/publishing-v10-flow.test.mjs'
      - 'tests/daily-gallery-random-12.test.mjs'
      - 'automation/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/palette-fidelity.yml'
  workflow_dispatch:

jobs:
  palette-fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test V10 palette coverage
        run: node tests/palette-coverage-v10.test.mjs
      - name: Check control and URL versions
        run: node tests/control-ranges.test.mjs
      - name: Tissue V8 release contracts
        run: node tests/tissue-v8-release.test.mjs
      - name: Preserve published V8
        run: node tests/renderer-lock.test.mjs

  material-palette-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Serve isolated editor
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/palette-server.log 2>&1 &
          for i in {1..15}; do curl -fsS http://127.0.0.1:4173/ > /dev/null && break || sleep 1; done
      - name: Render V9 vs V10 across five materials
        run: node tests/palette-v10-material-previews.mjs
      - name: Tissue V8 live browser and PNG verification
        run: node tests/tissue-v8-release-browser.mjs
      - name: Verify V10 daily/social generation and archived JPEG parity
        run: node tests/publishing-v10-flow.test.mjs
      - name: Verify twelve random daily artworks and independent social archive
        run: node tests/daily-gallery-random-12.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v10-material-palette-comparisons
          path: preview/palette-v10/
          if-no-files-found: warn
          retention-days: 14
