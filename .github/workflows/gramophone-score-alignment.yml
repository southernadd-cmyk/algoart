name: Research gramophone score-to-recording alignment
on:
  push:
    branches: [main]
    paths:
      - 'automation/align-gramophone-scores.py'
      - '.github/workflows/gramophone-score-alignment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install score alignment dependencies
        run: |
          python -m pip install --disable-pip-version-check 'librosa==0.11.0' 'soundfile>=0.13' 'scipy>=1.13'
      - name: Match digitized scores against exact gallery OGGs
        run: |
          python automation/align-gramophone-scores.py --track both --out gramophone-alignment-candidates.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gramophone-score-to-audio-candidates
          path: gramophone-alignment-candidates.json
          if-no-files-found: ignore
