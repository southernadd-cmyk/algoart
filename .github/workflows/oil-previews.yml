name: Procedural oil preview samples (diagnostic branch only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'js/oil-render.js'
      - 'js/oil-surface.js'
      - 'js/oil-material.js'
      - 'js/control-help.js'
      - 'js/generator.js'
      - 'js/marker.js'
      - 'tests/oil-preview.mjs'
      - 'tests/tissue-colour-browser.mjs'
      - 'tests/materials-profile-browser.mjs'
      - 'tests/tissue-v6.test.mjs'
      - 'tests/fixtures/tissue-v6-settings.json'
      - 'tests/mobile-export-paper.test.mjs'
      - 'js/export.js'
      - '.github/workflows/oil-previews.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local renderer
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/oil-preview-server.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Capture rejected Golden Trajectories candidates for 20 October
        env:
          SOCIAL_DATE: '2026-10-20'
          SOCIAL_MATERIAL: oil
          SOCIAL_ORIENTATION: landscape
          OIL_REJECTION_DIAGNOSTIC: '1'
          ALGOART_LOCAL_URL: 'http://127.0.0.1:4173/'
        run: node automation/generate-social.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-trajectories-rejected-2026-10-20
          path: oil-check-results/rejected-2026-10-20/
          retention-days: 30
