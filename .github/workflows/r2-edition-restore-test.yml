name: Release A — 16-artwork R2 edition and restore rehearsal

# One-shot integration test. This workflow is NOT a publisher or backup system.
# It only triggers on a specific isolated-branch workflow-file commit.
on:
  push:
    branches:
      - plan/archive-storage-foundation-20261109
    paths:
      - .github/workflows/r2-edition-restore-test.yml

permissions:
  contents: read

concurrency:
  group: proportion-piece-release-a-edition-r2-rehearsal
  cancel-in-progress: false

jobs:
  edition-roundtrip:
    if: ${{ github.ref == 'refs/heads/plan/archive-storage-foundation-20261109' && github.event_name == 'push' && github.event.head_commit.message == 'Run isolated 16-artwork R2 restore test 2026-11-09' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: archive-r2-test
    steps:
      - name: Checkout test code from isolated planning branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout the published 9 November exhibition as a separate read-only snapshot
        uses: actions/checkout@v4
        with:
          ref: main
          path: live-snapshot
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate test syntax and install media verifier
        run: |
          python -m py_compile automation/r2-edition-restore-test.py
          python -m pip install --disable-pip-version-check 'boto3>=1.34,<2' 'Pillow>=10,<13'

      - name: R2 upload, SHA-256 restore, artwork integrity and scratch cleanup
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET || 'proportion-piece-archive-test' }}
          R2_EDITION_REPORT_DIR: ${{ runner.temp }}/release-a-edition-r2-report
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python automation/r2-edition-restore-test.py

      - name: Save test report; no original artwork in artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-a-16-artwork-r2-restore-${{ github.run_id }}
          path: ${{ runner.temp }}/release-a-edition-r2-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Report outcome and verification boundary
        if: always()
        run: |
          echo '### Release A: full 16-artwork R2 round-trip' >> "$GITHUB_STEP_SUMMARY"
          echo 'Checks source 12 solo + 4 Confluence, 32 WebP variants, portrait sculptures, HTML, metadata, and every tracked dated file.' >> "$GITHUB_STEP_SUMMARY"
          echo 'All R2 test files are under a unique ephemeral key prefix and must be deleted with a confirmed 404.' >> "$GITHUB_STEP_SUMMARY"
          echo '**Not an independent durable offsite backup, public CDN/CORS test, production cutover, or live-site deployment.**' >> "$GITHUB_STEP_SUMMARY"
