name: PROPORTION PIECE live social publishing

on:
  push:
    paths:
      - '.github/social-trigger'
  workflow_dispatch:
    inputs:
      slot:
        description: Live slot to publish now
        required: true
        type: choice
        default: '1'
        options:
          - '0'
          - '1'
          - '2'
          - '3'
permissions:
  contents: write
  actions: write

concurrency:
  group: algoart-social-live
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_SITE_URL: https://southernadd-cmyk.github.io/algoart/
      ALGOART_LOCAL_URL: http://127.0.0.1:4173/
      RELEASE_TAG: algoart-social-live
      GH_TOKEN: ${{ github.token }}
      BLUESKY_HANDLE: artalgorithm.bsky.social
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Choose London publishing slot
        id: gate
        shell: bash
        run: |
          FORCE_SLOT=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            FORCE_SLOT="${{ inputs.slot }}"
          fi
          FORCE_SLOT="$FORCE_SLOT" node automation/social-slot.mjs gate

      - name: Ensure media release and check duplicate markers
        if: steps.gate.outputs.should_post == 'true'
        id: state
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG"               --title "PROPORTION PIECE social publishing media"               --notes "Rolling public media host for automated @artalgorithm posts."
          fi

          DATE="${{ steps.gate.outputs.date }}"
          SLOT="${{ steps.gate.outputs.slot }}"
          IG_MARKER="done-${DATE}-slot${SLOT}-instagram.txt"
          TH_MARKER="done-${DATE}-slot${SLOT}-threads.txt"
          PI_MARKER="done-${DATE}-slot${SLOT}-pinterest.txt"
          BS_MARKER="done-${DATE}-slot${SLOT}-bluesky.txt"
          ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"

          if printf '%s\n' "$ASSETS" | grep -Fxq "$IG_MARKER"; then
            echo "instagram_done=true" >> "$GITHUB_OUTPUT"
          else
            echo "instagram_done=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$ASSETS" | grep -Fxq "$TH_MARKER"; then
            echo "threads_done=true" >> "$GITHUB_OUTPUT"
          else
            echo "threads_done=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$ASSETS" | grep -Fxq "$PI_MARKER"; then
            echo "pinterest_done=true" >> "$GITHUB_OUTPUT"
          else
            echo "pinterest_done=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$ASSETS" | grep -Fxq "$BS_MARKER"; then
            echo "bluesky_done=true" >> "$GITHUB_OUTPUT"
          else
            echo "bluesky_done=false" >> "$GITHUB_OUTPUT"
          fi

          echo "instagram_marker=$IG_MARKER" >> "$GITHUB_OUTPUT"
          echo "threads_marker=$TH_MARKER" >> "$GITHUB_OUTPUT"
          echo "pinterest_marker=$PI_MARKER" >> "$GITHUB_OUTPUT"
          echo "bluesky_marker=$BS_MARKER" >> "$GITHUB_OUTPUT"

      - name: Install Playwright
        if: steps.gate.outputs.should_post == 'true' && (steps.state.outputs.instagram_done != 'true' || steps.state.outputs.threads_done != 'true' || (vars.PINTEREST_ENABLED == 'true' && steps.state.outputs.pinterest_done != 'true') || (env.BLUESKY_APP_PASSWORD != '' && steps.state.outputs.bluesky_done != 'true'))
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Start local PROPORTION PIECE
        if: steps.gate.outputs.should_post == 'true' && (steps.state.outputs.instagram_done != 'true' || steps.state.outputs.threads_done != 'true' || (vars.PINTEREST_ENABLED == 'true' && steps.state.outputs.pinterest_done != 'true') || (env.BLUESKY_APP_PASSWORD != '' && steps.state.outputs.bluesky_done != 'true'))
        run: |
          python3 -m http.server 4173 >/tmp/algoart-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/algoart-http.log
          exit 1

      - name: Generate today's artwork batch
        if: steps.gate.outputs.should_post == 'true' && (steps.state.outputs.instagram_done != 'true' || steps.state.outputs.threads_done != 'true' || (vars.PINTEREST_ENABLED == 'true' && steps.state.outputs.pinterest_done != 'true') || (env.BLUESKY_APP_PASSWORD != '' && steps.state.outputs.bluesky_done != 'true'))
        env:
          SOCIAL_DATE: ${{ steps.gate.outputs.date }}
        run: npm run social:generate

      - name: Verify exact artwork links and pixels before publishing
        if: steps.gate.outputs.should_post == 'true' && (steps.state.outputs.instagram_done != 'true' || steps.state.outputs.threads_done != 'true' || (vars.PINTEREST_ENABLED == 'true' && steps.state.outputs.pinterest_done != 'true') || (env.BLUESKY_APP_PASSWORD != '' && steps.state.outputs.bluesky_done != 'true'))
        env:
          SOCIAL_DATE: ${{ steps.gate.outputs.date }}
        run: npm run test:archive -- --queue "social-output/$SOCIAL_DATE/queue.json"

      - name: Upload publishing verification failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: landscape-prepublish-${{ github.run_id }}
          path: archive-check-results/

      - name: Install gallery preview dependency
        if: steps.gate.outputs.should_post == 'true'
        run: python3 -m pip install --break-system-packages 'Pillow>=10,<13'

      - name: Build daily gallery and SEO pages
        if: steps.gate.outputs.should_post == 'true' && (steps.state.outputs.instagram_done != 'true' || steps.state.outputs.threads_done != 'true' || (vars.PINTEREST_ENABLED == 'true' && steps.state.outputs.pinterest_done != 'true') || (env.BLUESKY_APP_PASSWORD != '' && steps.state.outputs.bluesky_done != 'true'))
        env:
          SOCIAL_DATE: ${{ steps.gate.outputs.date }}
        run: npm run gallery:build

      - name: Publish gallery update to GitHub Pages source
        id: gallery_commit
        if: steps.gate.outputs.should_post == 'true' && (steps.state.outputs.instagram_done != 'true' || steps.state.outputs.threads_done != 'true' || (vars.PINTEREST_ENABLED == 'true' && steps.state.outputs.pinterest_done != 'true') || (env.BLUESKY_APP_PASSWORD != '' && steps.state.outputs.bluesky_done != 'true'))
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery sitemap.xml robots.txt

          if git diff --cached --quiet; then
            echo "Daily gallery already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Archive PROPORTION PIECE gallery ${{ steps.gate.outputs.date }}"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Explicitly trigger Pages deployment after gallery commit
        if: steps.gate.outputs.should_post == 'true' && steps.gallery_commit.outputs.changed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          # Commits made with GITHUB_TOKEN do not reliably fan out into another workflow.
          # Dispatch the Pages workflow explicitly so the just-pushed gallery reaches the live site.
          gh workflow run deploy-pages.yml --ref main

      - name: Select artwork for this slot
        if: steps.gate.outputs.should_post == 'true' && (steps.state.outputs.instagram_done != 'true' || steps.state.outputs.threads_done != 'true' || (vars.PINTEREST_ENABLED == 'true' && steps.state.outputs.pinterest_done != 'true') || (env.BLUESKY_APP_PASSWORD != '' && steps.state.outputs.bluesky_done != 'true'))
        id: select
        env:
          SOCIAL_DATE: ${{ steps.gate.outputs.date }}
          SLOT: ${{ steps.gate.outputs.slot }}
        run: node automation/social-slot.mjs select

      - name: Host image publicly
        if: steps.gate.outputs.should_post == 'true' && (steps.state.outputs.instagram_done != 'true' || steps.state.outputs.threads_done != 'true' || (vars.PINTEREST_ENABLED == 'true' && steps.state.outputs.pinterest_done != 'true') || (env.BLUESKY_APP_PASSWORD != '' && steps.state.outputs.bluesky_done != 'true'))
        id: host
        shell: bash
        run: |
          ASSET="${{ steps.select.outputs.asset_name }}"
          cp "${{ steps.select.outputs.image_path }}" "/tmp/$ASSET"
          gh release upload "$RELEASE_TAG" "/tmp/$ASSET" --clobber
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$ASSET"
          echo "media_url=$URL" >> "$GITHUB_OUTPUT"
          curl -fL --retry 4 --retry-delay 2 -o /tmp/host-check.jpg "$URL"
          test -s /tmp/host-check.jpg

      - name: Publish to Instagram
        if: steps.gate.outputs.should_post == 'true' && steps.state.outputs.instagram_done != 'true'
        env:
          LIVE_PUBLISHING: 'true'
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MEDIA_URL: ${{ steps.host.outputs.media_url }}
          CAPTION_B64: ${{ steps.select.outputs.instagram_caption_b64 }}
          ALT_TEXT_B64: ${{ steps.select.outputs.alt_text_b64 }}
        shell: bash
        run: |
          export CAPTION="$(printf '%s' "$CAPTION_B64" | base64 --decode)"
          export ALT_TEXT="$(printf '%s' "$ALT_TEXT_B64" | base64 --decode)"
          npm run social:instagram

      - name: Mark Instagram slot complete
        if: steps.gate.outputs.should_post == 'true' && steps.state.outputs.instagram_done != 'true'
        shell: bash
        run: |
          MARKER="${{ steps.state.outputs.instagram_marker }}"
          printf 'published %s slot %s to Instagram\n' "${{ steps.gate.outputs.date }}" "${{ steps.gate.outputs.slot }}" > "/tmp/$MARKER"
          gh release upload "$RELEASE_TAG" "/tmp/$MARKER" --clobber

      - name: Publish to Threads
        if: steps.gate.outputs.should_post == 'true' && steps.state.outputs.threads_done != 'true'
        env:
          LIVE_PUBLISHING: 'true'
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          MEDIA_URL: ${{ steps.host.outputs.media_url }}
          CAPTION_B64: ${{ steps.select.outputs.threads_caption_b64 }}
          ALT_TEXT_B64: ${{ steps.select.outputs.alt_text_b64 }}
        shell: bash
        run: |
          export CAPTION="$(printf '%s' "$CAPTION_B64" | base64 --decode)"
          export ALT_TEXT="$(printf '%s' "$ALT_TEXT_B64" | base64 --decode)"
          npm run social:threads

      - name: Mark Threads slot complete
        if: steps.gate.outputs.should_post == 'true' && steps.state.outputs.threads_done != 'true'
        shell: bash
        run: |
          MARKER="${{ steps.state.outputs.threads_marker }}"
          printf 'published %s slot %s to Threads\n' "${{ steps.gate.outputs.date }}" "${{ steps.gate.outputs.slot }}" > "/tmp/$MARKER"
          gh release upload "$RELEASE_TAG" "/tmp/$MARKER" --clobber


      - name: Publish to Bluesky
        if: steps.gate.outputs.should_post == 'true' && env.BLUESKY_APP_PASSWORD != '' && steps.state.outputs.bluesky_done != 'true'
        env:
          MEDIA_URL: ${{ steps.host.outputs.media_url }}
          CAPTION_B64: ${{ steps.select.outputs.bluesky_caption_b64 }}
          ALT_TEXT_B64: ${{ steps.select.outputs.alt_text_b64 }}
        shell: bash
        run: |
          export CAPTION="$(printf '%s' "$CAPTION_B64" | base64 --decode)"
          export ALT_TEXT="$(printf '%s' "$ALT_TEXT_B64" | base64 --decode)"
          npm run social:bluesky

      - name: Mark Bluesky slot complete
        if: steps.gate.outputs.should_post == 'true' && env.BLUESKY_APP_PASSWORD != '' && steps.state.outputs.bluesky_done != 'true'
        shell: bash
        run: |
          MARKER="${{ steps.state.outputs.bluesky_marker }}"
          printf 'published %s slot %s to Bluesky\n' "${{ steps.gate.outputs.date }}" "${{ steps.gate.outputs.slot }}" > "/tmp/$MARKER"
          gh release upload "$RELEASE_TAG" "/tmp/$MARKER" --clobber

      - name: Publish to Pinterest
        if: steps.gate.outputs.should_post == 'true' && vars.PINTEREST_ENABLED == 'true' && steps.state.outputs.pinterest_done != 'true'
        env:
          LIVE_PUBLISHING: 'true'
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          MEDIA_URL: ${{ steps.host.outputs.media_url }}
          SHARE_URL: ${{ steps.select.outputs.share_url }}
          PINTEREST_TITLE_B64: ${{ steps.select.outputs.pinterest_title_b64 }}
          PINTEREST_DESCRIPTION_B64: ${{ steps.select.outputs.pinterest_description_b64 }}
          ALT_TEXT_B64: ${{ steps.select.outputs.alt_text_b64 }}
        shell: bash
        run: |
          export PINTEREST_TITLE="$(printf '%s' "$PINTEREST_TITLE_B64" | base64 --decode)"
          export PINTEREST_DESCRIPTION="$(printf '%s' "$PINTEREST_DESCRIPTION_B64" | base64 --decode)"
          export ALT_TEXT="$(printf '%s' "$ALT_TEXT_B64" | base64 --decode)"
          npm run social:pinterest

      - name: Mark Pinterest slot complete
        if: steps.gate.outputs.should_post == 'true' && vars.PINTEREST_ENABLED == 'true' && steps.state.outputs.pinterest_done != 'true'
        shell: bash
        run: |
          MARKER="${{ steps.state.outputs.pinterest_marker }}"
          printf 'published %s slot %s to Pinterest\n' "${{ steps.gate.outputs.date }}" "${{ steps.gate.outputs.slot }}" > "/tmp/$MARKER"
          gh release upload "$RELEASE_TAG" "/tmp/$MARKER" --clobber

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### PROPORTION PIECE social publishing" >> "$GITHUB_STEP_SUMMARY"
          echo "- Local slot gate: ${{ steps.gate.outputs.should_post }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Date: ${{ steps.gate.outputs.date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Slot: ${{ steps.gate.outputs.slot }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target London time: ${{ steps.gate.outputs.target_time }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Instagram already complete before run: ${{ steps.state.outputs.instagram_done }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Threads already complete before run: ${{ steps.state.outputs.threads_done }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bluesky configured: ${{ env.BLUESKY_APP_PASSWORD != '' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bluesky already complete before run: ${{ steps.state.outputs.bluesky_done }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pinterest enabled: ${{ vars.PINTEREST_ENABLED }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pinterest already complete before run: ${{ steps.state.outputs.pinterest_done }}" >> "$GITHUB_STEP_SUMMARY"

  portrait-plan:
    # Resolve once in an independent successful job: failed reusable workflows
    # need not expose outputs, and retries must retain the same date and slot.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.slot != '3') }}
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      date: ${{ steps.gate.outputs.date }}
      slot: ${{ steps.gate.outputs.slot }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve London portrait date and slot
        id: gate
        env:
          FORCE_PORTRAIT_SLOT: ${{ (github.event_name == 'push' && github.event.head_commit.message == 'retry-deleted-portrait-slot0-2026-10-09' && '0') || (github.event_name == 'workflow_dispatch' && inputs.slot) || '' }}
        run: node automation/portrait-slot.mjs gate

  portraits:
    # A second job in the SAME workflow run; the existing cronjob.com
    # dispatches and their times are unchanged. Landscape finishes first
    # so the portrait gallery can preserve its five entries.
    needs: [publish, portrait-plan]
    if: ${{ !cancelled() && needs.portrait-plan.outputs.should_run == 'true' }}
    uses: ./.github/workflows/portrait-live.yml
    with:
      slot: ${{ needs.portrait-plan.outputs.slot }}
      date: ${{ needs.portrait-plan.outputs.date }}
      live: true
      repost_deleted: ${{ github.event_name == 'push' && github.event.head_commit.message == 'retry-deleted-portrait-slot0-2026-10-09' }}
    secrets: inherit

  portraits-retry:
    # One bounded retry in the same scheduled run. Keep the original date/slot
    # and honour completion markers, including after a partial platform failure.
    needs: [portraits, portrait-plan]
    if: ${{ !cancelled() && needs.portraits.result == 'failure' && needs.portrait-plan.outputs.should_run == 'true' }}
    uses: ./.github/workflows/portrait-live.yml
    with:
      slot: ${{ needs.portrait-plan.outputs.slot }}
      date: ${{ needs.portrait-plan.outputs.date }}
      live: true
      repost_deleted: false
    secrets: inherit


  watercolor-landscape:
    # Action Painting and Tissue both update the same archive files at 09:00.
    # Wait for Action landscape/portrait before writing the Tissue gallery.
    needs: [publish, portrait-plan, portraits, portraits-retry, action-landscape, action-portrait]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.portrait-plan.outputs.should_run == 'true' && (needs.portrait-plan.outputs.slot == '0' || needs.portrait-plan.outputs.slot == '2') }}
    uses: ./.github/workflows/watercolor-live.yml
    with:
      slot: ${{ needs.portrait-plan.outputs.slot }}
      date: ${{ needs.portrait-plan.outputs.date }}
      orientation: landscape
      live: true
    secrets: inherit

  watercolor-landscape-retry:
    # Exactly one retry; the per-platform markers prevent duplicate posts.
    needs: [watercolor-landscape, portrait-plan]
    if: ${{ always() && !cancelled() && needs.watercolor-landscape.result == 'failure' && github.ref == 'refs/heads/main' && (needs.portrait-plan.outputs.slot == '0' || needs.portrait-plan.outputs.slot == '2') }}
    uses: ./.github/workflows/watercolor-live.yml
    with:
      slot: ${{ needs.portrait-plan.outputs.slot }}
      date: ${{ needs.portrait-plan.outputs.date }}
      orientation: landscape
      live: true
    secrets: inherit

  watercolor-portrait:
    # Sequential: complete all gallery writes for landscape before portrait.
    needs: [watercolor-landscape, watercolor-landscape-retry, portrait-plan]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.portrait-plan.outputs.should_run == 'true' && (needs.portrait-plan.outputs.slot == '0' || needs.portrait-plan.outputs.slot == '2') }}
    uses: ./.github/workflows/watercolor-live.yml
    with:
      slot: ${{ needs.portrait-plan.outputs.slot }}
      date: ${{ needs.portrait-plan.outputs.date }}
      orientation: portrait
      live: true
    secrets: inherit

  watercolor-portrait-retry:
    needs: [watercolor-portrait, portrait-plan]
    if: ${{ always() && !cancelled() && needs.watercolor-portrait.result == 'failure' && github.ref == 'refs/heads/main' && (needs.portrait-plan.outputs.slot == '0' || needs.portrait-plan.outputs.slot == '2') }}
    uses: ./.github/workflows/watercolor-live.yml
    with:
      slot: ${{ needs.portrait-plan.outputs.slot }}
      date: ${{ needs.portrait-plan.outputs.date }}
      orientation: portrait
      live: true
    secrets: inherit

  watercolour-v2s-landscape:
    # Existing 15:00 UK afternoon slot; not a fourth cron trigger.
    needs: [publish, portrait-plan, portraits, portraits-retry]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.portrait-plan.outputs.should_run == 'true' && needs.portrait-plan.outputs.slot == '1' }}
    uses: ./.github/workflows/watercolour-live.yml
    with:
      slot: '1'
      date: ${{ needs.portrait-plan.outputs.date }}
      orientation: landscape
      live: true
    secrets: inherit

  watercolour-v2s-landscape-retry:
    needs: [watercolour-v2s-landscape, portrait-plan]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.watercolour-v2s-landscape.result == 'failure' && needs.portrait-plan.outputs.slot == '1' }}
    uses: ./.github/workflows/watercolour-live.yml
    with:
      slot: '1'
      date: ${{ needs.portrait-plan.outputs.date }}
      orientation: landscape
      live: true
    secrets: inherit

  watercolour-v2s-portrait:
    # Serialize landscape and portrait gallery edits.
    needs: [watercolour-v2s-landscape, watercolour-v2s-landscape-retry, portrait-plan]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.portrait-plan.outputs.should_run == 'true' && needs.portrait-plan.outputs.slot == '1' }}
    uses: ./.github/workflows/watercolour-live.yml
    with:
      slot: '1'
      date: ${{ needs.portrait-plan.outputs.date }}
      orientation: portrait
      live: true
    secrets: inherit


  oil-v3-landscape:
    # Same existing 15:00 UK afternoon dispatch. Keep gallery writes
    # serialised after the previous watercolour publishing jobs.
    needs: [portrait-plan, watercolour-v2s-portrait, watercolour-v2s-portrait-retry]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.portrait-plan.outputs.should_run == 'true' && needs.portrait-plan.outputs.slot == '1' }}
    uses: ./.github/workflows/oil-live.yml
    with:
      slot: '1'
      date: ${{ needs.portrait-plan.outputs.date }}
      orientation: landscape
      live: true
    secrets: inherit

  oil-v3-landscape-retry:
    needs: [oil-v3-landscape, portrait-plan]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.oil-v3-landscape.result == 'failure' && needs.portrait-plan.outputs.slot == '1' }}
    uses: ./.github/workflows/oil-live.yml
    with:
      slot: '1'
      date: ${{ needs.portrait-plan.outputs.date }}
      orientation: landscape
      live: true
    secrets: inherit

  oil-v3-portrait:
    needs: [oil-v3-landscape, oil-v3-landscape-retry, portrait-plan]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.portrait-plan.outputs.should_run == 'true' && needs.portrait-plan.outputs.slot == '1' }}
    uses: ./.github/workflows/oil-live.yml
    with:
      slot: '1'
      date: ${{ needs.portrait-plan.outputs.date }}
      orientation: portrait
      live: true
    secrets: inherit

  oil-v3-portrait-retry:
    needs: [oil-v3-portrait, portrait-plan]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.oil-v3-portrait.result == 'failure' && needs.portrait-plan.outputs.slot == '1' }}
    uses: ./.github/workflows/oil-live.yml
    with:
      slot: '1'
      date: ${{ needs.portrait-plan.outputs.date }}
      orientation: portrait
      live: true
    secrets: inherit

  watercolour-v2s-portrait-retry:
    needs: [watercolour-v2s-portrait, portrait-plan]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.watercolour-v2s-portrait.result == 'failure' && needs.portrait-plan.outputs.slot == '1' }}
    uses: ./.github/workflows/watercolour-live.yml
    with:
      slot: '1'
      date: ${{ needs.portrait-plan.outputs.date }}
      orientation: portrait
      live: true
    secrets: inherit

  action-landscape:
    # Two morning Action Painting studies, serialised to preserve the gallery.
    needs: [publish, portrait-plan, portraits, portraits-retry]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.portrait-plan.outputs.should_run == 'true' && needs.portrait-plan.outputs.slot == '0' }}
    uses: ./.github/workflows/action-live.yml
    with:
      slot: '0'
      date: ${{ needs.portrait-plan.outputs.date }}
      orientation: landscape
      live: true
    secrets: inherit

  action-portrait:
    needs: [action-landscape, portrait-plan]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.portrait-plan.outputs.should_run == 'true' && needs.portrait-plan.outputs.slot == '0' && needs.action-landscape.result == 'success' }}
    uses: ./.github/workflows/action-live.yml
    with:
