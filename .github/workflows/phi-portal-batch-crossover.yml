name: TEST portal batching reversed-order crossover
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phi-portal-batch-crossover.yml'
      - 'tests/phi-portal-batch-crossover.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify exact portal geometry and material state
        run: node --test tests/phi-portal-batch-parity.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Compile only the current TEST tower (not live)
        run: |
          ./node_modules/.bin/esbuild test/virtual-gallery/gallery-phi.js --bundle --minify --format=esm --platform=browser --target=es2022 --outfile=test/virtual-gallery/gallery-phi-bundle.js
          node --check test/virtual-gallery/gallery-phi-bundle.js
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/phi-portal-cross-http.log 2>&1 &
      - name: Measure six controlled lift journeys across two floors in crossed order
        run: node tests/phi-portal-batch-crossover.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phi-portal-batch-crossover
          path: phi-portal-batch-crossover/results.json
          if-no-files-found: ignore
