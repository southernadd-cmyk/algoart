name: Verify test lift painting queue priority and profiling
# Retired automatic trigger: old test tower experiment files were removed.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/phi-lift-queue-profiler.test.mjs
