name: Deploy ALGO ART to Pages
# Deployment refresh: publish latest About-page artist statement and gallery updates.

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'test/**'
      - 'automation/build-phi-test-room-signs.mjs'
      - 'automation/phi-stage-curation-plugin.mjs'
      - 'automation/phi-n8ao-test-plugin.mjs'
      - 'automation/phi-bvh-test-plugin.mjs'
      - 'automation/phi-warmup-test-plugin.mjs'
      - 'tests/phi-entry-warmup.test.mjs'
      - 'tests/phi-mesh-bvh.test.mjs'
      - 'tests/phi-csm.test.mjs'
      - 'tests/phi-lighting-study.test.mjs'
      - 'tests/phi-pool-composition.test.mjs'
      - 'tests/phi-n8ao.test.mjs'
      - 'tests/phi-stage-curation.test.mjs'
      - 'tests/phi-pre-expansion.test.mjs'
      - 'tests/phi-test-room-signs.test.mjs'
      - 'tests/phi-room-sign-counts.test.mjs'
      - 'tests/phi-reception-refresh.test.mjs'
      - 'tests/phi-reception-penrose.test.mjs'
      - 'tests/phi-gallery-penrose.test.mjs'
      - 'tests/phi-exterior-plants-disabled.test.mjs'
      - 'tests/phi-presentation.test.mjs'
      - 'tests/phi-gramophone-timeline.test.mjs'
      - 'tests/phi-gramophone-score-map.test.mjs'
      - 'tests/phi-gramophone-asap-debussy.test.mjs'
      - 'tests/phi-gramophone-experience.test.mjs'
      - 'tests/phi-gramophone-independent-source.test.mjs'
      - 'css/**'
      - 'fonts/**'
      - 'js/**'
      - 'gallery/**'
      - 'press/**'
      - 'about/**'
      - 'confluence/**'
      - 'reels/**'
      - 'favicon.svg'
      - 'social-card.svg'
      - 'social-card.png'
      - 'robots.txt'
      - 'google*.html'
      - 'B732C1640DA947DB8E65C914FA8703EE.txt'
      - '.github/workflows/indexnow-notify.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.npmrc'
      - 'sitemap.xml'
      - '.nojekyll'
  workflow_dispatch:
  # Commits pushed by the bundle-sync workflow's GITHUB_TOKEN do not
  # trigger push workflows. Deploy when that workflow finishes instead.
  workflow_run:
    workflows: ['Synchronise deployed gallery bundle', 'Build TouchDesigner second monitor bank', 'Import annotated Debussy recording for test tower']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never interrupt Pages while it is syncing files. A cancelled deployment
  # may leave the previous site live and subsequent releases unable to land.
  # Queue newer publishes until the current deployment has completed.
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # Pages should not depend on archived test experiments (photoreal/CSM,
      # legacy visitor palette, gltfpack pilots). Those have separate workflows,
      # and the test tower is deliberately a clean mirror of live plus chat v2.
      - name: Build live and test gallery bundles
        run: |
          npm run gallery:bundle
          npm run gallery:bundle:phi
          # The experimental preview must NEVER gate production Pages,
          # daily publishing or tomorrow's R2 canary.
          if ! node automation/build-hybrid-tower-test.mjs; then
            echo "::warning::Optional hybrid sculpture tower build failed; publishing live gallery unchanged"
            rm -f gallery/hybrid-tower-test/index.html gallery/visit/gallery-phi-hybrid-test-bundle.js
          fi
          ./node_modules/.bin/esbuild test/virtual-gallery/gallery-phi.js --bundle --minify --format=esm --platform=browser --target=es2022 --outfile=test/virtual-gallery/gallery-phi-bundle.js
          node --check gallery/visit/gallery-bundle.js
          node --check gallery/visit/gallery-phi-bundle.js
          if [[ -f gallery/visit/gallery-phi-hybrid-test-bundle.js ]]; then
            node --check gallery/visit/gallery-phi-hybrid-test-bundle.js || {
              echo "::warning::Optional hybrid test bundle did not pass syntax; removing test preview"
              rm -f gallery/hybrid-tower-test/index.html gallery/visit/gallery-phi-hybrid-test-bundle.js
            }
          fi
          node --test tests/gallery-classical-playlist.test.mjs
          node --check test/virtual-gallery/gallery-phi-bundle.js

      - name: Verify archive and visitor chat v1/v2 release
        run: |
          node automation/validate-phi-archive.mjs
          node --test tests/phi-bounded-light-pool-live.test.mjs tests/phi-stable-point-lights-live.test.mjs tests/phi-stable-point-lights.test.mjs
          node --test test/virtual-gallery/phi-visitor-chat.test.mjs test/virtual-gallery/visitor-v2/chat-v2.test.mjs test/virtual-gallery/phi-visitor-selection.test.mjs gallery/visit/phi-visitor-chat.test.mjs gallery/visit/visitor-v2/chat-v2.test.mjs gallery/visit/phi-visitor-selection.test.mjs
          test -s test/virtual-gallery/visitor-v2/harness.html
          test -s test/virtual-gallery/full-engine.html
          grep -q 'visitor-v2/chat-v2.mjs' test/virtual-gallery/gallery-phi.js
          grep -q 'gallery-phi-bundle.js?v=test-chat-v2-' test/virtual-gallery/full-engine.html

      - name: Verify recently repaired regression tests
        run: |
          node --check tests/phi-translation-area-sign.test.mjs
          node --test tests/phi-translation-area-sign.test.mjs
          node tests/mobile-png-download.test.mjs
          node tests/control-ranges.test.mjs

      - name: Verify walkthrough XSS regression
        run: node --test tests/step-by-step-svg-attribute-safety.test.mjs

      - name: Audit duplicate live/test static media
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          live=Path('gallery/visit')
          test=Path('test/virtual-gallery')
          extensions={'.glb','.gltf','.bin','.mp3','.wav','.ogg','.mp4','.webm','.jpg','.jpeg','.png','.ktx2','.basis'}
          matches=[]
          for f in test.rglob('*'):
              if not f.is_file() or f.suffix.lower() not in extensions:
                  continue
              peer=live/f.relative_to(test)
              if not peer.is_file() or f.stat().st_size!=peer.stat().st_size:
                  continue
              def digest(p):
                  h=sha256()
                  with p.open('rb') as stream:
                      for chunk in iter(lambda:stream.read(1048576),b''):
                          h.update(chunk)
                  return h.digest()
              if digest(f)==digest(peer):
                  matches.append((f.stat().st_size,str(f),str(peer)))
          matches.sort(reverse=True)
          total=sum(size for size,_,_ in matches)
          print(f'Identical media pairs: {len(matches)}; redundant bytes: {total:,} ({total/1048576:.1f} MiB)')
          print('Largest 25 candidates (not removed; runtime URL resolution must be confirmed):')
          for size,source,peer in matches[:25]:
              print(f'{size/1048576:8.2f} MiB  {source}  ==  {peer}')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble public site only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          # Publish runtime assets and pages, not CI, source tooling, or node_modules.
          for dir in about confluence css fonts js gallery press reels; do
            if [[ -d "$dir" ]]; then cp -a "$dir" "_site/$dir"; fi
          done
          # Explicitly publish only the Tissue V8 visual study from the
          # otherwise-private test tree. Retired test tower stays excluded.
          mkdir -p _site/preview/tissue-v8
          cp test/tissue-v8/index.html _site/preview/tissue-v8/index.html
          # Root-level static pages, metadata, favicons and verification files.
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.webmanifest' -o -name '*.xml' -o -name '*.txt' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.svg' -o -name '*.ico' -o -name '.nojekyll' \) -exec cp -t _site -- {} +
          # Prevent accidental publication of non-runtime files in copied directories.
          find _site -type d \( -name node_modules -o -name .git -o -name .github -o -name tests -o -name automation -o -name .chat-v2-staging \) -prune -exec rm -rf -- {} +
          test -s _site/index.html
          test -s _site/confluence/index.html
          test -s _site/preview/tissue-v8/index.html
          test -s _site/about/step-by-step/index.html
          test -s _site/gallery/visit/gallery-phi-bundle.js
          test -s _site/gallery/visit/index.html
          if [[ -e _site/test ]]; then echo 'Retired test tower must not be published' >&2; exit 1; fi
          test -s _site/js/generator.js
          test -s _site/css/marker-font.css
          if find _site -type d \( -name node_modules -o -name .github -o -name automation -o -name .chat-v2-staging \) | grep -q .; then
            echo 'Internal directory exposed in Pages artifact' >&2
            exit 1
          fi
          if find _site -type f \( -name '*.log' -o -name '*-staging.zip' \) | grep -q .; then
            echo 'Unexpected development logs or staging archives in Pages artifact' >&2
            exit 1
          fi
          echo "Public artifact size:"
          du -sh _site
          echo "Public artifact file count:"
          find _site -type f | wc -l

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # The Pages action itself enforces a 600000 ms maximum timeout.
    # Keep build success distinct from confirmed deployment success.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

