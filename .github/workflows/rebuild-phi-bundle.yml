name: Rebuild phi gallery bundle
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rebuild-phi-bundle.yml'
permissions:
  contents: write
concurrency:
  group: rebuild-phi-gallery-bundle
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run gallery:bundle:phi
      - name: Commit compiled gallery bundle
        run: |
          if git diff --quiet -- gallery/visit/gallery-phi-bundle.js; then
            echo "Gallery bundle already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery/visit/gallery-phi-bundle.js
          git commit -m "Rebuild gallery phi bundle for updated recordings"
          git push
