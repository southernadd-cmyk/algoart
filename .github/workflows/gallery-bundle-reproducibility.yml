name: Verify gallery bundle reproducibility
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gallery-bundle-reproducibility.yml'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned gallery bundler
        run: npm install --no-save --package-lock=false
      - name: Rebuild gallery bundle
        run: npm run gallery:bundle
      - name: Validate generated bundle and live gallery regression tests
        run: |
          node --check gallery/visit/gallery-bundle.js
          node --test tests/gallery-public-launch.test.mjs tests/gallery-xr-loading.test.mjs tests/gallery-xr-controls.test.mjs tests/gallery-production-planning.test.mjs
      - name: Check committed bundle matches production source
        id: parity
        continue-on-error: true
        run: git diff --exit-code -- gallery/visit/gallery-bundle.js
      - name: Stage rebuilt bundle for review
        if: steps.parity.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b automation/lift-minimap-bundle
          git add gallery/visit/gallery-bundle.js
          git commit -m "Build lift minimap marker into production bundle"
          git push --force origin HEAD:refs/heads/automation/lift-minimap-bundle
      - name: Preserve candidate bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-rebuilt-bundle
          path: gallery/visit/gallery-bundle.js
          retention-days: 7
      - name: Report parity without blocking manual diagnosis
        run: |
          if [ "${{ steps.parity.outcome }}" = 'failure' ]; then
            echo "Gallery bundle differs from its source. Review the generated artifact or PR." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Gallery bundle is reproducible byte-for-byte." >> "$GITHUB_STEP_SUMMARY"
          fi
