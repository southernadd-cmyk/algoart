name: Verify social publishing pace and captions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/social-pacing-checks.yml'
      - '.github/workflows/social-live.yml'
      - '.github/workflows/portrait-live.yml'
      - '.github/workflows/action-live.yml'
      - '.github/workflows/watercolor-live.yml'
      - '.github/workflows/watercolour-live.yml'
      - '.github/workflows/oil-live.yml'
      - 'automation/captions.mjs'
      - 'automation/social-stagger.mjs'
      - 'automation/social-publish-policy.mjs'
      - 'automation/publish-threads.mjs'
      - 'automation/threads-publish-safety.mjs'
      - 'tests/threads-publish-safety.test.mjs'
      - 'tests/social-frozen-release.test.mjs'
      - 'automation/threads-evening-feature.mjs'
      - 'tests/social-caption-rotation.test.mjs'
      - 'tests/social-stagger.test.mjs'
      - 'tests/social-publish-policy.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/social-pacing-checks.yml'
      - '.github/workflows/social-live.yml'
      - '.github/workflows/watercolour-live.yml'
      - 'automation/publish-threads.mjs'
      - 'automation/threads-publish-safety.mjs'
      - 'tests/threads-publish-safety.test.mjs'
      - 'tests/social-publish-policy.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify dry-run pacing, deterministic captions, links and limits
        run: |
          node --test tests/social-stagger.test.mjs \
            tests/social-caption-rotation.test.mjs \
            tests/social-caption-limits.test.mjs \
            tests/social-publish-policy.test.mjs \
            tests/portrait-captions.test.mjs \
            tests/threads-publish-safety.test.mjs
      - name: Verify real frozen V10 publishing queues and release assets (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pp-social-frozen
          gh release view algoart-social-2026-11 --json assets > /tmp/pp-social-frozen/assets.json
          for entry in \
            action-landscape-2026-11-10-queue.json \
            action-portrait-2026-11-10-queue.json \
            watercolour-landscape-2026-11-09-queue.json \
            watercolour-portrait-2026-11-09-queue.json \
            oil-landscape-2026-11-09-queue.json \
            oil-portrait-2026-11-09-queue.json; do
            gh release download algoart-social-2026-11 --pattern "$entry" -D /tmp/pp-social-frozen
          done
          PP_FROZEN_QUEUE_DIR=/tmp/pp-social-frozen node --test tests/social-frozen-release.test.mjs
