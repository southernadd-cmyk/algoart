            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Reproduce four watercolor JPEGs and their editor links
        run: node tests/watercolor-pipeline.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watercolor-daily-examples
          path: watercolor-check-results/
          retention-days: 14
+'{{ inputs.orientation }}-slot'+ '
          assert "'15:00'" not in watercolor
          print('PASS: YAML parses and watercolor is separate from marker publishers')
          PY
  browser-watercolor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
