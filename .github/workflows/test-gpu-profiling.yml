name: Verify and build TEST tower optimisation experiments
on:
  push:
    branches: [main]
    paths:
      - 'test/virtual-gallery/gallery-phi.js'
      - 'test/virtual-gallery/phi-gpu-profiler.mjs'
      - 'tests/phi-gpu-profiler.test.mjs'
      - 'test/virtual-gallery/phi-caption-batch.mjs'
      - 'tests/phi-caption-batch.test.mjs'
      - 'test/virtual-gallery/phi-frame-material.mjs'
      - 'test/virtual-gallery/phi-painting-frame-batch.mjs'
      - 'tests/phi-painting-frame-batch.test.mjs'
      - 'test/virtual-gallery/phi-room-visibility-culler.mjs'
      - 'test/virtual-gallery/phi-visibility-cell-index.mjs'
      - 'tests/phi-visibility-cell-index.test.mjs'
      - 'tests/phi-room-visibility-culler.test.mjs'
      - 'test/virtual-gallery/phi-room-batch-study.mjs'
      - 'tests/phi-room-batch-study.test.mjs'
      - 'test/virtual-gallery/phi-uploaded-texture-ledger.mjs'
      - 'tests/phi-uploaded-texture-ledger.test.mjs'
      - 'test/virtual-gallery/phi-room-lighting-renderer.mjs'
      - 'tests/phi-shadow-receiver-invalidation.test.mjs'
      - '.github/workflows/test-gpu-profiling.yml'
permissions:
  contents: write
concurrency:
  group: test-tower-gpu-profiling
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify GPU timing and caption geometry batching
        run: node --test tests/phi-gpu-profiler.test.mjs tests/phi-caption-batch.test.mjs tests/phi-painting-frame-batch.test.mjs tests/phi-room-visibility-culler.test.mjs tests/phi-visibility-cell-index.test.mjs tests/phi-room-batch-study.test.mjs tests/phi-uploaded-texture-ledger.test.mjs tests/phi-shadow-receiver-invalidation.test.mjs
      - name: Build TEST bundle without altering live
        run: |
          ./node_modules/.bin/esbuild test/virtual-gallery/gallery-phi.js --bundle --minify --format=esm --platform=browser --target=es2022 --outfile=test/virtual-gallery/gallery-phi-bundle.js
          node --check test/virtual-gallery/gallery-phi-bundle.js
          node --input-type=module -e "import fs from 'node:fs';if(!fs.readFileSync('test/virtual-gallery/gallery-phi-bundle.js','utf8').includes('__phiRoomVisibility'))process.exit(1)"
      - name: Publish generated TEST bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          original_source=$(git rev-parse HEAD:test/virtual-gallery/gallery-phi.js)
          original_frame_shader=$(git rev-parse HEAD:test/virtual-gallery/phi-frame-material.mjs)
          original_frame_batch=$(git rev-parse HEAD:test/virtual-gallery/phi-painting-frame-batch.mjs)
          original_room_culler=$(git rev-parse HEAD:test/virtual-gallery/phi-room-visibility-culler.mjs)
          original_visibility_cells=$(git rev-parse HEAD:test/virtual-gallery/phi-visibility-cell-index.mjs)
          original_room_batches=$(git rev-parse HEAD:test/virtual-gallery/phi-room-batch-study.mjs)
          original_upload_ledger=$(git rev-parse HEAD:test/virtual-gallery/phi-uploaded-texture-ledger.mjs)
          original_lighting=$(git rev-parse HEAD:test/virtual-gallery/phi-room-lighting-renderer.mjs)
          git add test/virtual-gallery/gallery-phi-bundle.js
          if ! git diff --cached --quiet; then
            git commit -m "Build test tower GPU profiling experiment"
            # A concurrent push can occur after fetch. Retry safely: always
            # rebase first, then verify that NONE of our compiled inputs changed.
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              [[ "$(git rev-parse HEAD:test/virtual-gallery/phi-room-lighting-renderer.mjs)" == "$original_lighting" ]] || { echo 'Lighting source changed; refusing stale TEST bundle'; exit 1; }
            [[ "$(git rev-parse HEAD:test/virtual-gallery/gallery-phi.js)" == "$original_source" ]] || { echo 'Concurrent test source changed; refusing outdated bundle'; exit 1; }
            [[ "$(git rev-parse HEAD:test/virtual-gallery/phi-frame-material.mjs)" == "$original_frame_shader" ]] || { echo 'Concurrent frame shader changed; refusing outdated bundle'; exit 1; }
            [[ "$(git rev-parse HEAD:test/virtual-gallery/phi-painting-frame-batch.mjs)" == "$original_frame_batch" ]] || { echo 'Concurrent frame batch changed; refusing outdated bundle'; exit 1; }
            [[ "$(git rev-parse HEAD:test/virtual-gallery/phi-room-visibility-culler.mjs)" == "$original_room_culler" ]] || { echo 'Concurrent room culler changed; refusing outdated bundle'; exit 1; }
            [[ "$(git rev-parse HEAD:test/virtual-gallery/phi-visibility-cell-index.mjs)" == "$original_visibility_cells" ]] || { echo 'Compiled visibility module changed; refusing stale bundle'; exit 1; }
            [[ "$(git rev-parse HEAD:test/virtual-gallery/phi-room-batch-study.mjs)" == "$original_room_batches" ]] || { echo 'Room batch implementation changed; aborting obsolete bundle'; exit 1; }
            [[ "$(git rev-parse HEAD:test/virtual-gallery/phi-uploaded-texture-ledger.mjs)" == "$original_upload_ledger" ]] || { echo 'Texture upload ledger changed; refusing stale bundle'; exit 1; }
              if git push origin HEAD:main; then
                echo "Published verified TEST bundle"
                exit 0
              fi
              echo "Concurrent push rejected attempt $attempt; retrying from latest main"
              sleep 2
            done
            echo 'Could not safely publish TEST bundle after retries'
            exit 1
          fi
