name: Verify R2 publisher integration

on:
  push:
    branches: [release/r2-daily-social-integration-20261109]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r2-publisher-integration.yml'
      - '.github/workflows/gallery-daily.yml'
      - '.github/actions/wait-for-r2-gallery/**'
      - 'automation/*r2*.mjs'
      - 'automation/r2-daily-media.py'
      - 'automation/publish-social-r2.py'
      - '.github/workflows/social-live.yml'
      - '.github/workflows/confluence-social.yml'
      - 'tests/test_r2_social_media.py'
      - 'tests/test_r2_social_queue.py'
      - 'automation/social-r2-queue.py'
      - '.github/workflows/portrait-live.yml'
      - '.github/workflows/watercolor-live.yml'
      - '.github/workflows/watercolour-live.yml'
      - '.github/workflows/oil-live.yml'
      - '.github/workflows/action-live.yml'
      - 'tests/r2-*.mjs'
      - 'automation/prepare-r2-daily.mjs'
      - 'tests/test_r2_daily_media.py'

# Cancel outdated PR checks; never cancel an unrelated branch or production run.
concurrency:
  group: r2-publisher-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      R2_EDITION_DATE: '2026-11-09'
      R2_STAGE_OUTPUT: /tmp/r2-integration-fixture-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test immutable uploads, recovery, social readiness and exact rollback
        run: |
          python -m pip install --disable-pip-version-check 'boto3>=1.37,<2'
          python -m unittest discover -s tests -p test_r2_daily_media.py
          python -m unittest discover -s tests -p test_r2_social_media.py
          python -m unittest discover -s tests -p test_r2_social_queue.py
          node --test tests/r2-art-only-publishing.test.mjs tests/r2-art-only-prune.test.mjs tests/r2-art-only-workflow.test.mjs tests/r2-publisher.test.mjs tests/confluence-daily-publishing.test.mjs tests/social-publish-policy.test.mjs tests/gallery-public-launch.test.mjs
      - name: Build the staged gallery and tower using the frozen historical fixture
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --only-shell chromium
          node --input-type=module <<'PLAYWRIGHT_SMOKE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage();
            await page.setContent('<canvas width="4" height="4"></canvas>');
            const ok=await page.evaluate(()=>document.querySelector('canvas').toDataURL('image/png').startsWith('data:image/png;base64,'));
            if(!ok) throw Error('Chromium canvas smoke failed');
            console.log('R2_CHROMIUM_SMOKE_OK');
          } finally {
            await browser.close();
          }
          PLAYWRIGHT_SMOKE
          npm run gallery:bundle:phi
          node automation/prepare-r2-daily.mjs
      - name: Verify staged gallery and tower with local R2 media fixtures in Chromium
        run: R2_BROWSERS=chromium node tests/r2-gallery-browser.mjs --fixture
      - name: Reproduce the exact archived edition including Confluence
        env:
          ALGOART_LOCAL_URL: http://127.0.0.1:4173/
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/r2-editor.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/archive-reproduction.mjs --edition "$R2_EDITION_DATE"
