name: TEST portal geometry rendered pixel parity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phi-portal-batch-pixel-parity.yml'
      - 'tests/phi-portal-batch-pixel-parity.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/phi-portal-pixels-http.log 2>&1 &
      - name: Verify exact RGB and alpha output of original vs merged portal frames
        run: node tests/phi-portal-batch-pixel-parity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phi-portal-pixel-parity
          path: phi-portal-batch-pixel-parity/
          if-no-files-found: ignore
