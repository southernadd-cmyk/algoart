name: Sculpture V2 post-publication daily archive

# Independently follows a SUCCESSFUL scheduled gallery build.
# It must not modify archived gallery files or run for the
# manual 11 Nov R2 canary/recovery. PRs only exercise no-secret safety tests.
on:
  pull_request:
    paths:
      - 'automation/publish-sculpture-v2-daily-r2.py'
      - 'tests/test_sculpture_v2_daily_r2.py'
      - '.github/workflows/sculpture-v2-postpublish-daily.yml'
  workflow_dispatch: # Explicit, date-pinned recovery for 11 November only
  workflow_run:
    workflows: ['Build ALGO ART daily gallery']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: sculpture-v2-postpublish-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Offline immutable-publication and gallery-isolation regression
        run: |
          python3 -m pip install 'boto3>=1.37,<2'
          python3 -m py_compile automation/publish-sculpture-v2-daily-r2.py
          python3 -m unittest discover -s tests -p test_sculpture_v2_daily_r2.py -v

  # Explicit full rehearsal of the already-published 11 Nov gallery.
  # Runs on a PR with no secrets, no R2 writes, no git push and no V1 bake.
  dry-run-11nov:
    if: github.event_name == 'pull_request'
    needs: safety
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      V2_BAKE_OUT: /tmp/v2-dry-run-11nov
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published 11 November paintings without requiring any V1 pack
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          day=Path('gallery/2026-11-11')
          meta=json.loads((day/'meta.json').read_text())
          assert meta['date']=='2026-11-11'
          solo=[entry for entry in meta['entries'] if entry.get('orientation')=='portrait' and entry.get('material')!='confluence']
          assert len(solo)==6, f'Expected six solo portraits, got {len(solo)}'
          assert len({e['imageFile'] for e in solo})==len(solo)
          assert all((day/e['imageFile']).is_file() for e in solo)
          print('V2_REHEARSAL_SOURCE_OK portraits=',len(solo),'v1_not_required=true')
          PY
      - name: Install browser baker and start local read-only gallery
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/v2-dryrun-11nov-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/gallery/sculpture-v2-test/sculpture-bake.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/gallery/sculpture-v2-test/sculpture-bake.html >/dev/null
          node automation/build-sculpture-v2-baker.mjs
      - name: Rebuild and validate BOTH complete V2 quality packs, in scratch only
        run: |
          node automation/build-sculpture-v2-packs.mjs --date 2026-11-11 --quality both --out "$V2_BAKE_OUT"
          node --test tests/sculpture-v2-packs.test.mjs
          python3 -m pip install 'boto3>=1.37,<2'
          python3 automation/publish-sculpture-v2-daily-r2.py --date 2026-11-11 --out "$V2_BAKE_OUT" --dry-run
      - name: Prove no source archive modifications and no V1 output
        run: |
          test -z "$(git status --porcelain -- gallery)"
          test ! -e "$V2_BAKE_OUT/2026-11-11/3d/sculptures.json.gz"
          test -s "$V2_BAKE_OUT/2026-11-11/3d/v2/sculptures.desktop.json.gz"
          test -s "$V2_BAKE_OUT/2026-11-11/3d/v2/sculptures.mobile.json.gz"
          test -s "$V2_BAKE_OUT/2026-11-11/3d/v2/manifest.json"
          echo 'V2_ONLY_DRY_RUN_OK date=2026-11-11 r2_writes=0 gallery_changes=0 v1_bakes=0'
      - name: Preserve small bake audit only, not generated meshes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-only-11nov-dry-run-audit
          path: /tmp/v2-dry-run-11nov/bake-report.json
          retention-days: 7
          if-no-files-found: warn

  bake-after-gallery-success:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_branch == 'main')
    needs: safety
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: archive-media-test
    env:
      UPSTREAM_STARTED: ${{ github.event.workflow_run.run_started_at || '2026-11-11T08:00:00Z' }}
      UPSTREAM_RUN: ${{ github.event.workflow_run.id || github.run_id }}
      V2_RECOVERY_DATE: ${{ github.event_name == 'workflow_dispatch' && '2026-11-11' || '' }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published gallery date and solo portrait roster
        id: roster
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPSTREAM_STARTED"
          DAY=$(TZ=Europe/London date -d "$UPSTREAM_STARTED" +%F)
          test "$DAY" \> "2026-11-10"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$DAY" == "2026-11-11"
            echo "V2_11_NOV_RECOVERY_ONLY"
          fi
          # An armed R2 canary deliberately holds the scheduled gallery build.
          # A successful no-op upstream run MUST NOT trigger any V2 baking
          # or produce a misleading error before the manual canary.
          if [[ ! -e "gallery/$DAY/meta.json" ]]; then
            printf 'date=%s\neligible=0\n' "$DAY" >> "$GITHUB_OUTPUT"
            echo "V2_DAILY_SKIPPED_UPSTREAM_HOLD date=$DAY"
            exit 0
          fi
          test -s "gallery/$DAY/meta.json"
          DAY="$DAY" python3 - <<'PY'
          import json,os
          from pathlib import Path
          date=os.environ['DAY']
          base=Path('gallery')/date
          meta=json.loads((base/'meta.json').read_text())
          assert meta['date']==date
          solo=[x for x in meta['entries'] if x.get('orientation')=='portrait'
                and x.get('material')!='confluence']
          assert solo, 'No source portraits for V2'
          assert len({e['imageFile'] for e in solo})==len(solo)
          assert all((base/e['imageFile']).is_file() for e in solo)
          print('V2_DAILY_GALLERY_PUBLISHED_OK',date,'eligible',len(solo))
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write(f'eligible={len(solo)}\n')
          PY
          echo "date=$DAY" >> "$GITHUB_OUTPUT"
          echo "V2 postpublication follows successful upstream run $UPSTREAM_RUN"
      - name: Install independent V2 baker without changing gallery
        if: steps.roster.outputs.eligible != '0'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v2-daily-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 1
          done
          node automation/build-sculpture-v2-baker.mjs
      - name: Bake V2 desktop and mobile ONLY into ephemeral scratch
        if: steps.roster.outputs.eligible != '0'
        shell: bash
        run: |
          node automation/build-sculpture-v2-packs.mjs --date "${{ steps.roster.outputs.date }}" \
            --quality both --out "$RUNNER_TEMP/v2-daily"
          V2_BAKE_OUT="$RUNNER_TEMP/v2-daily" \
            node --test tests/sculpture-v2-packs.test.mjs
          python3 automation/publish-sculpture-v2-daily-r2.py \
            --date "${{ steps.roster.outputs.date }}" --out "$RUNNER_TEMP/v2-daily" --dry-run
      - name: Upload verified daily mesh packs create-only to existing R2
        if: steps.roster.outputs.eligible != '0'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_MEDIA_ACCESS_KEY_ID: ${{ secrets.R2_MEDIA_ACCESS_KEY_ID }}
          R2_MEDIA_SECRET_ACCESS_KEY: ${{ secrets.R2_MEDIA_SECRET_ACCESS_KEY }}
          V2_PUBLISH_DATE: ${{ steps.roster.outputs.date }}
        run: |
          python3 -m pip install 'boto3>=1.37,<2'
          python3 automation/publish-sculpture-v2-daily-r2.py \
            --date "${{ steps.roster.outputs.date }}" --out "$RUNNER_TEMP/v2-daily"
      - name: Retain small source-scoped daily V2 audit (never V1)
        if: ${{ always() && steps.roster.outputs.eligible != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-daily-audit-${{ steps.roster.outputs.date }}
          path: ${{ runner.temp }}/v2-daily/bake-report.json
          retention-days: 14
          if-no-files-found: warn
