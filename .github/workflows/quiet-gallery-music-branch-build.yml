name: Validate quiet gallery music branch
on:
  push:
    branches:
      - feature/quiet-gallery-music-20261107
    paths-ignore:
      - gallery/visit/gallery-phi-bundle.js

permissions:
  contents: write

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check JavaScript source syntax
        run: |
          node --check gallery/visit/gallery-phi.js
          node --check gallery/visit/phi-gramophone-music.mjs
          node --check gallery/visit/phi-visitor-chat.mjs
          node --check gallery/visit/phi-visitor-knowledge.mjs
          node --check gallery/visit/visitor-v2/chat-v2.mjs
          node --check gallery/visit/visitor-v2/topic-browser.mjs
          node --check gallery/visit/phi-reception-layout.mjs
      - name: Check removed exhibit references
        run: |
          ! grep -Eq "THE GRAMOPHONE|What is the gramophone\?|The gramophone in reception|experiment in golden listening"             about/index.html README.md gallery/visit/index.html             gallery/visit/gallery-phi.js gallery/visit/phi-visitor-chat.mjs             gallery/visit/visitor-v2/chat-v2.mjs gallery/visit/visitor-v2/topic-browser.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production gallery bundle
        run: npm run gallery:bundle:phi
      - name: Commit the generated bundle only to this feature branch
        run: |
          if ! git diff --quiet -- gallery/visit/gallery-phi-bundle.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gallery/visit/gallery-phi-bundle.js
            git commit -m "Build gallery bundle for quiet optional music"
            git push origin HEAD:feature/quiet-gallery-music-20261107
          fi
