name: ALGO ART full mobile layout regression

on:
  push:
    paths:
      - '.github/workflows/full-mobile-layout-regression.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Check entire mobile UI
        run: |
          python3 -m http.server 4173 >/tmp/algoart-mobile-full-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          cat > full-mobile-check.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser=await chromium.launch({headless:true});
          const sizes=[
            {width:320,height:568},
            {width:360,height:740},
            {width:375,height:667},
            {width:390,height:844},
            {width:412,height:915},
            {width:430,height:932}
          ];

          function intersects(a,b){
            return Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left)) *
                   Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));
          }

          for(const size of sizes){
            const page=await browser.newPage({
              viewport:size,
              isMobile:true,
              hasTouch:true
            });

            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await page.evaluate(()=>{
              localStorage.removeItem('algoart-ethos-seen');
              localStorage.setItem('algoart-inspector-mobile','closed');
            });
            await page.reload({waitUntil:'networkidle'});

            const base=await page.evaluate(()=>{
              const rect=s=>{
                const e=document.querySelector(s);
                if(!e)return null;
                const r=e.getBoundingClientRect();
                const cs=getComputedStyle(e);
                return{
                  selector:s,left:r.left,right:r.right,top:r.top,bottom:r.bottom,
                  width:r.width,height:r.height,display:cs.display,
                  visibility:cs.visibility,opacity:+cs.opacity
                };
              };
              return{
                innerWidth,
                innerHeight,
                scrollWidth:document.documentElement.scrollWidth,
                scrollHeight:document.documentElement.scrollHeight,
                bodyOverflowX:getComputedStyle(document.body).overflowX,
                bodyOverflowY:getComputedStyle(document.body).overflowY,
                items:[
                  rect('.toolbar'),
                  rect('.brand-lockup'),
                  rect('.seed'),
                  rect('#regenerate'),
                  rect('#variations'),
                  rect('#geometry'),
                  rect('.gallery-nav'),
                  rect('.canvas-shell'),
                  rect('.canvas-wrap'),
                  rect('#art'),
                  rect('.stats'),
                  rect('.stage-footer'),
                  rect('.stage-footer span:first-child'),
                  rect('#inspectorToggle'),
                  rect('#ethosToast')
                ].filter(Boolean)
              };
            });

            if(base.scrollWidth>base.innerWidth+1) throw new Error(`${size.width}px document horizontal overflow ${base.scrollWidth}>${base.innerWidth}`);
            if(base.bodyOverflowX!=='hidden') throw new Error(`${size.width}px expected body overflow-x hidden, got ${base.bodyOverflowX}`);
            if(base.bodyOverflowY==='hidden') throw new Error(`${size.width}px vertical scrolling is still locked`);

            for(const item of base.items){
              if(item.display==='none'||item.visibility==='hidden'||item.opacity===0)continue;
              if(item.left < -1 || item.right > base.innerWidth+1){
                throw new Error(`${size.width}px horizontal clipping: ${JSON.stringify(item)}`);
              }
            }

            const geometryButton=base.items.find(x=>x.selector==='#geometry');
            if(!geometryButton||geometryButton.display==='none'||geometryButton.width<40){
              throw new Error(`${size.width}px Reveal control is not visibly usable`);
            }

            await page.click('#geometry');
            const revealOn=await page.evaluate(()=>({
              text:document.getElementById('geometry').textContent.trim(),
              active:document.getElementById('geometry').classList.contains('active'),
              reveal:document.querySelector('.canvas-wrap').classList.contains('reveal-active')
            }));
            if(!revealOn.active||!revealOn.reveal||!/^Hide/.test(revealOn.text)){
              throw new Error(`${size.width}px Reveal could not be switched on: ${JSON.stringify(revealOn)}`);
            }
            await page.click('#geometry');
            const revealOff=await page.evaluate(()=>({
              text:document.getElementById('geometry').textContent.trim(),
              active:document.getElementById('geometry').classList.contains('active'),
              reveal:document.querySelector('.canvas-wrap').classList.contains('reveal-active')
            }));
            if(revealOff.active||revealOff.reveal||!/^Reveal/.test(revealOff.text)){
              throw new Error(`${size.width}px Reveal could not be switched off: ${JSON.stringify(revealOff)}`);
            }

            const canvas=base.items.find(x=>x.selector==='.canvas-wrap');
            if(!canvas||canvas.width<200) throw new Error(`${size.width}px artwork is too small or missing: ${JSON.stringify(canvas)}`);

            const footer=base.items.find(x=>x.selector==='.stage-footer');
            const params=base.items.find(x=>x.selector==='#inspectorToggle');
            if(footer&&params&&intersects(footer,params)>1){
              throw new Error(`${size.width}px footer overlaps Parameters button`);
            }

            // 4-Up overlay should fit horizontally and be vertically scrollable.
            await page.click('#variations');
            const variations=await page.evaluate(()=>{
              const sels=['.variations-overlay','.variations-sheet','.variations-head','#closeVariations','.variations-grid','.variations-actions','#shuffleVariations'];
              const items=sels.map(s=>{
                const e=document.querySelector(s),r=e.getBoundingClientRect(),cs=getComputedStyle(e);
                return{selector:s,left:r.left,right:r.right,width:r.width,display:cs.display};
              });
              return{
                viewport:innerWidth,
                docWidth:document.documentElement.scrollWidth,
                sheetScrollHeight:document.querySelector('.variations-sheet').scrollHeight,
                sheetClientHeight:document.querySelector('.variations-sheet').clientHeight,
                items
              };
            });
            if(variations.docWidth>variations.viewport+1) throw new Error(`${size.width}px 4-Up causes document overflow`);
            for(const item of variations.items){
              if(item.display==='none')continue;
              if(item.left < -1 || item.right > variations.viewport+1) throw new Error(`${size.width}px 4-Up clipped: ${JSON.stringify(item)}`);
            }
            await page.click('#closeVariations');

            // Parameter drawer: all six tabs visible, all panels horizontally contained,
            // and vertically overflowing panels can actually reach their bottom.
            await page.click('#inspectorToggle');
            const drawer=await page.evaluate(()=>{
              const inspector=document.querySelector('.inspector');
              const ir=inspector.getBoundingClientRect();
              const tabs=[...document.querySelectorAll('.tab')].map(e=>{
                const r=e.getBoundingClientRect();
                return{left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height,text:e.textContent.trim()};
              });
              return{
                viewport:innerWidth,
                docWidth:document.documentElement.scrollWidth,
                inspector:{left:ir.left,right:ir.right,width:ir.width},
                head:document.querySelector('.inspector-head').getBoundingClientRect().toJSON(),
                tabs
              };
            });
            if(drawer.docWidth>drawer.viewport+1) throw new Error(`${size.width}px drawer causes document overflow`);
            if(drawer.inspector.left < -1 || drawer.inspector.right > drawer.viewport+1) throw new Error(`${size.width}px drawer clipped`);
            for(const tab of drawer.tabs){
              if(tab.left < -1 || tab.right > drawer.viewport+1 || tab.width<50 || tab.height<28){
                throw new Error(`${size.width}px tab clipped/unusable: ${JSON.stringify(tab)}`);
              }
            }

            const tabNames=['composition','phi','marker','geometry-panel','colour','export'];
            for(const name of tabNames){
              await page.click(`.tab[data-tab="${name}"]`);
              const panel=await page.evaluate(name=>{
                const p=document.querySelector(`.tab-panel[data-panel="${name}"]`);
                const pr=p.getBoundingClientRect();
                const controls=[...p.querySelectorAll('button,input,select,.mode-picker,.checks,.mini-note,.section-title')]
                  .filter(e=>getComputedStyle(e).display!=='none')
                  .map(e=>{
                    const r=e.getBoundingClientRect();
                    return{tag:e.tagName,id:e.id||'',class:e.className||'',left:r.left,right:r.right,width:r.width};
                  });
                const before=p.scrollTop;
                p.scrollTop=p.scrollHeight;
                const after=p.scrollTop;
                return{
                  viewport:innerWidth,
                  panel:{left:pr.left,right:pr.right,width:pr.width},
                  scrollHeight:p.scrollHeight,
                  clientHeight:p.clientHeight,
                  before,after,
                  controls
                };
              },name);
              if(panel.panel.left < -1 || panel.panel.right > panel.viewport+1) throw new Error(`${size.width}px ${name} panel clipped`);
              for(const c of panel.controls){
                if(c.left < panel.panel.left-1 || c.right > panel.panel.right+1){
                  throw new Error(`${size.width}px ${name} child overflow: ${JSON.stringify(c)}`);
                }
              }
              if(panel.scrollHeight>panel.clientHeight+2 && panel.after===0){
                throw new Error(`${size.width}px ${name} panel cannot vertically scroll`);
              }
            }

            console.log(JSON.stringify({
              size,
              documentWidth:base.scrollWidth,
              canvasWidth:canvas.width,
              bodyOverflowY:base.bodyOverflowY,
              tabs:drawer.tabs.map(t=>({text:t.text,width:t.width})),
              fullMobileFit:true
            },null,2));

            await page.close();
          }

          await browser.close();
          JS
          node full-mobile-check.mjs
