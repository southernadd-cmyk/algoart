name: Publish live visitor chat v1 bundle
on:
  push:
    branches: [main]
    paths:
      - 'gallery/visit/index.html'
permissions:
  contents: write
concurrency:
  group: live-visitor-chat-v1-build
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run visitor chat v1 tests
        run: node --test gallery/visit/phi-visitor-chat.test.mjs
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Compile live tower without test-only engine changes
        run: npx esbuild gallery/visit/gallery-phi.js --bundle --minify --format=esm --platform=browser --target=es2022 --outfile=gallery/visit/gallery-phi-bundle.js
      - name: Publish production bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gallery/visit/gallery-phi-bundle.js
          if ! git diff --staged --quiet; then
            git commit -m 'Publish live tower visitor chat v1 bundle'
            git push
          fi
