name: Gallery bundle release checks
on:
  push:
    branches: [main, "release/**"]
    paths:
      - 'tests/phi-idle-work.test.mjs'
      - 'tests/phi-desk-hologram.test.mjs'
      - 'tests/gallery-public-launch.test.mjs'
      - 'tests/studio-walkthrough-link.test.mjs'
      - 'js/settings-url.js'
      - 'js/app.js'
      - 'index.html'
      - 'about/step-by-step/index.html'
      - 'tests/gallery-production-planning.test.mjs'
      - 'tests/gallery-exterior-graffiti.test.mjs'
      - 'tests/gallery-backdrop.test.mjs'
      - 'tests/gallery-interior-graffiti.test.mjs'
      - 'test/virtual-gallery/architectural-materials.test.mjs'
      - 'test/virtual-gallery/environment-v1.test.mjs'
      - 'test/virtual-gallery/paper-isolation.test.mjs'
      - 'test/virtual-gallery/sculptures.test.mjs'
      - 'test/virtual-gallery/study-material.test.mjs'
      - 'test/virtual-gallery/vector-tracing.test.mjs'
      - 'gallery/visit/layout-v2.mjs'
      - 'gallery/visit/hanging-v3.mjs'
      - 'gallery/visit/sculptures.mjs'
      - 'tests/gallery-xr-loading.test.mjs'
      - 'tests/gallery-xr-controls.test.mjs'
      - 'gallery/visit/**'
      - 'package.json'
      - 'gallery/visit/gallery-v2.js'
      - 'gallery/visit/index.html'
      - 'gallery/visit/gallery-bundle.js'
      - 'test/virtual-gallery/index.html'
      - '.github/workflows/gallery-bundle-release-checks.yml'
  workflow_dispatch:
jobs:
  gallery-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install gallery test dependencies
        run: npm install --no-save --package-lock=false
      # Run the focused regression before the expensive gallery tests.
      - name: Lift motion, arrival preparation and sculpture staging regression
        run: node --test tests/phi-lift-motion.test.mjs tests/gallery-entry-preparation.test.mjs tests/phi-sculpture-stage.test.mjs
      - name: Monitor scheduling, map invalidation and screen crop regression
        run: node --test tests/phi-idle-work.test.mjs tests/phi-desk-hologram.test.mjs
      - name: Gallery public launch regression
        run: node --test tests/gallery-public-launch.test.mjs tests/gallery-xr-loading.test.mjs tests/gallery-xr-controls.test.mjs tests/gallery-production-planning.test.mjs tests/gallery-exterior-graffiti.test.mjs tests/gallery-interior-graffiti.test.mjs tests/gallery-backdrop.test.mjs
      - name: Studio walkthrough links regression
        run: node --test tests/studio-walkthrough-link.test.mjs
      - name: Production-module unit tests
        run: node --test test/virtual-gallery/architectural-materials.test.mjs test/virtual-gallery/environment-v1.test.mjs test/virtual-gallery/paper-isolation.test.mjs test/virtual-gallery/sculptures.test.mjs test/virtual-gallery/study-material.test.mjs test/virtual-gallery/vector-tracing.test.mjs
      - name: Enforce gallery bundle parity with production source
        run: |
          npm run gallery:bundle:check
          npm run gallery:bundle:phi:check
          node automation/validate-phi-archive.mjs
      - name: Validate bundle syntax and test entry point
        run: |
          node --check gallery/visit/gallery-bundle.js
          test -s gallery/visit/gallery-bundle.js
          grep -q 'test/virtual-gallery/gallery-phi-bundle.js' test/virtual-gallery/index.html
          if grep -q 'location.replace' test/virtual-gallery/index.html; then exit 1; fi


