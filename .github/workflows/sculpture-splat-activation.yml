name: GS6 Gaussian gallery activation

on:
  pull_request:
    paths:
      - 'gallery/visit/index.html'
      - 'gallery/visit/gallery-phi.js'
      - 'gallery/sculpture-splats/**'
      - 'gallery/sculpture-v2-test/**'
      - 'automation/build-sculpture-v2-test.mjs'
      - 'tests/sculpture-splat-activation-browser.mjs'
      - 'tests/sculpture-splat-renderer.test.mjs'
      - '.github/workflows/sculpture-splat-activation.yml'

permissions:
  contents: read
concurrency:
  group: gs6-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify actual reception, historical and activation-day splat packs
        run: |
          node --input-type=module <<'JS'
          import {getV2R2Catalog,getV2DailyManifest} from './gallery/sculpture-v2-test/v2-pack-loader.mjs';
          import {fetchSplatManifest,downloadSplatPack} from './gallery/sculpture-splats/r2-loader.mjs';
          const catalog=await getV2R2Catalog();
          for(const day of ['reception','2026-10-10','2026-11-25','2026-11-26']){
            const source=day==='reception'?{portraits:1,qualities:catalog.reception}:day<'2026-11-18'?catalog.days[day]:await getV2DailyManifest(day);
            const manifest=await fetchSplatManifest(day);
            for(const quality of ['mobile','desktop']){
              const pack=await downloadSplatPack(day,quality,{manifest,sourceSha256:source.qualities[quality].sha256});
              if(pack.expectedPortraits!==source.portraits)throw Error('Source roster mismatch '+day);
              console.log('GS6_SOURCE_VERIFIED',day,quality,pack.expectedPortraits);
            }
          }
          JS
      - name: Build both live representations and run regression tests
        run: |
          node automation/build-sculpture-v2-test.mjs
          node automation/build-sculpture-v2-test.mjs --production-splats
          node --check gallery/visit/gallery-phi-splats-bundle.js
          node --check gallery/visit/gallery-phi-sculpture-v2-test-bundle.js
          node --test tests/sculpture-splat-renderer.test.mjs tests/sculpture-v2-tower-coverage.test.mjs tests/verify-pages-live.test.mjs
          test -s gallery/visit/vendor/three-0.187.0/build/three.module.js
          grep -q 'gallery-phi-splats-bundle.js?v=gs6-01' gallery/visit/index.html
          if grep -q GS6_ENTRY_START gallery/sculpture-v2-test/index.html; then exit 1; fi
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/gs6-http.log 2>&1 &
      - name: Verify real Spark rendering, mobile, mesh rollback and missing-pack fallback
        run: node tests/sculpture-splat-activation-browser.mjs
