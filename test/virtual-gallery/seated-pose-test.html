<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seated visitor rig test · PROPORTION PIECE</title>
<style>body{margin:0;background:#eeeae1;color:#292e2b;font:16px system-ui}
header{padding:15px 22px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
h1{font:normal 25px Georgia;margin:0 20px 0 0}
button,select{font:inherit;padding:9px 12px;background:#fff;border:1px solid #999;border-radius:4px}
#view{display:block;width:100%;height:65vh;touch-action:none}
pre{white-space:pre-wrap;overflow:auto;background:#dedbd2;padding:15px;margin:0;font-size:12px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head><body>
<header><h1>seated visitor test</h1>
<label>model <select id="model"><option value="male">Male</option><option value="female">Female</option></select></label>
<button id="refresh">rebuild pose</button><a href="./">Back to gallery</a>
</header>
<canvas id="view"></canvas><pre id="log">Loading actual rigged visitor model…</pre>
<script type="module">
import * as THREE from 'three';
import {loadRiggedCharacterAsset,createRiggedCharacter} from './visitors.mjs?v=seat-placement-20261022';
const canvas=document.getElementById('view'),log=document.getElementById('log');
const scene=new THREE.Scene();scene.background=new THREE.Color('#deded7');
scene.add(new THREE.HemisphereLight('#ffffff','#8c877e',2));
const light=new THREE.DirectionalLight('#fff9eb',2.4);light.position.set(-4,7,5);scene.add(light);
const camera=new THREE.PerspectiveCamera(40,1,.1,70);camera.position.set(3.8,2.8,5.4);camera.lookAt(0,1,0);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.outputColorSpace=THREE.SRGBColorSpace;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:'#c9c6bc'}));
ground.rotation.x=-Math.PI/2;scene.add(ground);
const benchMaterial=new THREE.MeshStandardMaterial({color:'#937d66',roughness:.85});
const frameMaterial=new THREE.MeshStandardMaterial({color:'#4e5753',metalness:.4,roughness:.7});
function box(group,w,h,d,x,y,z,material){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);mesh.position.set(x,y,z);group.add(mesh);}
const bench=new THREE.Group();box(bench,1.8,.10,.58,0,.47,0,benchMaterial);
box(bench,1.8,.42,.08,0,.76,-.29,benchMaterial);
for(const x of [-.7,.7])for(const z of [-.2,.2])box(bench,.07,.46,.07,x,.23,z,frameMaterial);
scene.add(bench);
let figure=null;
const asset=await loadRiggedCharacterAsset();
const selector=document.getElementById('model');
function build(){
if(figure){scene.remove(figure);figure=null;}
if(!asset){log.textContent='Rigged model could not be loaded. Check console/network.';return;}
try{
figure=createRiggedCharacter(THREE,asset,{bodyType:selector.value,x:0,y:.35,z:0,yaw:0,scale:1},{seated:true});
scene.add(figure);
log.textContent=JSON.stringify(figure.userData.galleryRigMetrics,null,2)+'\n\nLook for knees at 90°, feet on ground, hips over seat; confirm that mesh is not distorted.';
}catch(error){log.textContent='SEATED POSE FAILED: '+error.message;console.error(error);}
}
selector.addEventListener('change',build);document.getElementById('refresh').addEventListener('click',build);
build();
function resize(){const width=canvas.clientWidth,height=canvas.clientHeight;renderer.setSize(width,height,false);camera.aspect=width/height;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></body></html>
