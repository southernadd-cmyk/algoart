name: Deploy ALGO ART to Pages
# Deployment refresh: restore the test tower to the live baseline.

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'test/**'
      - 'automation/build-phi-test-room-signs.mjs'
      - 'automation/phi-stage-curation-plugin.mjs'
      - 'automation/phi-n8ao-test-plugin.mjs'
      - 'automation/phi-bvh-test-plugin.mjs'
      - 'automation/phi-warmup-test-plugin.mjs'
      - 'tests/phi-entry-warmup.test.mjs'
      - 'tests/phi-mesh-bvh.test.mjs'
      - 'tests/phi-csm.test.mjs'
      - 'tests/phi-lighting-study.test.mjs'
      - 'tests/phi-pool-composition.test.mjs'
      - 'tests/phi-n8ao.test.mjs'
      - 'tests/phi-stage-curation.test.mjs'
      - 'tests/phi-pre-expansion.test.mjs'
      - 'tests/phi-test-room-signs.test.mjs'
      - 'tests/phi-room-sign-counts.test.mjs'
      - 'tests/phi-reception-refresh.test.mjs'
      - 'tests/phi-reception-penrose.test.mjs'
      - 'tests/phi-gallery-penrose.test.mjs'
      - 'tests/phi-exterior-plants-disabled.test.mjs'
      - 'tests/phi-presentation.test.mjs'
      - 'tests/phi-gramophone-timeline.test.mjs'
      - 'tests/phi-gramophone-score-map.test.mjs'
      - 'tests/phi-gramophone-asap-debussy.test.mjs'
      - 'tests/phi-gramophone-experience.test.mjs'
      - 'tests/phi-gramophone-independent-source.test.mjs'
      - 'css/**'
      - 'fonts/**'
      - 'js/**'
      - 'gallery/**'
      - 'press/**'
      - 'about/**'
      - 'reels/**'
      - 'favicon.svg'
      - 'social-card.svg'
      - 'social-card.png'
      - 'robots.txt'
      - 'google*.html'
      - 'B732C1640DA947DB8E65C914FA8703EE.txt'
      - '.github/workflows/indexnow-notify.yml'
      - '.github/workflows/deploy-pages.yml'
      - 'sitemap.xml'
      - '.nojekyll'
  workflow_dispatch:
  # Commits pushed by the bundle-sync workflow's GITHUB_TOKEN do not
  # trigger push workflows. Deploy when that workflow finishes instead.
  workflow_run:
    workflows: ['Synchronise deployed gallery bundle', 'Build TouchDesigner second monitor bank', 'Import annotated Debussy recording for test tower']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # A stale queued deployment must not block the newest live and test update.
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # Pages should not depend on archived test experiments (photoreal/CSM,
      # legacy visitor palette, gltfpack pilots). Those have separate workflows,
      # and the test tower is deliberately a clean mirror of live plus chat v2.
      - name: Build live and test gallery bundles
        run: |
          npm run gallery:bundle
          npm run gallery:bundle:phi
          ./node_modules/.bin/esbuild test/virtual-gallery/gallery-phi.js --bundle --minify --format=esm --platform=browser --target=es2022 --outfile=test/virtual-gallery/gallery-phi-bundle.js
          node --check gallery/visit/gallery-bundle.js
          node --check gallery/visit/gallery-phi-bundle.js
          node --check test/virtual-gallery/gallery-phi-bundle.js

      - name: Verify archive and visitor chat v1/v2 release
        run: |
          node automation/validate-phi-archive.mjs
          node --test test/virtual-gallery/phi-visitor-chat.test.mjs test/virtual-gallery/visitor-v2/chat-v2.test.mjs test/virtual-gallery/phi-visitor-selection.test.mjs
          test -s test/virtual-gallery/visitor-v2/harness.html
          test -s test/virtual-gallery/full-engine.html
          grep -q 'visitor-v2/chat-v2.mjs' test/virtual-gallery/gallery-phi.js
          grep -q 'test-chat-v2-20261101' test/virtual-gallery/full-engine.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

