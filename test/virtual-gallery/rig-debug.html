<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gallery Visitor Rig — Isolated Pose Test</title>
<style>
html,body{margin:0;height:100%;background:#e6e5df;color:#252b2a;font:15px Arial,sans-serif}
main{display:grid;grid-template-rows:auto 1fr;height:100%}
header{background:#faf9f5;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
strong{font-size:18px;margin-right:16px}button{padding:9px 14px;border:1px solid #68716d;background:#fff;cursor:pointer}
button[aria-pressed=true]{background:#293932;color:#fff}
small{display:block;color:#52605a}canvas{width:100%;height:100%;display:block}
#status{margin-left:auto;font-size:12px}#error{color:#a33;white-space:pre-wrap}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body><main>
<header>
 <div><strong>Gallery visitor rig test</strong><small>Same pose function used by the virtual gallery</small></div>
 <button id="relaxed" aria-pressed="true">Arms lowered</button>
 <button id="original" aria-pressed="false">Original rest pose</button>
 <span id="status">Loading rigged characters…</span><span id="error"></span>
</header>
<canvas id="view" aria-label="3D male and female pose comparison"></canvas>
</main>
<script type="module">
import * as THREE from 'three';
import {loadRiggedCharacterAsset,createRiggedCharacter} from './visitors.mjs?v=verified-rig-test-20261021';
const canvas=document.querySelector('#view'),status=document.querySelector('#status');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
const scene=new THREE.Scene();scene.background=new THREE.Color('#e6e5df');
scene.add(new THREE.HemisphereLight('#ffffff','#85857c',2.4));
const sun=new THREE.DirectionalLight('#ffffff',2.7);sun.position.set(-2,5,4);scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshLambertMaterial({color:'#dbddd8'}));
floor.rotation.x=-Math.PI/2;scene.add(floor);
const camera=new THREE.PerspectiveCamera(39,1,.05,100);
camera.position.set(0,1.55,6.4);camera.lookAt(0,1.0,0);
let group=new THREE.Group();scene.add(group);
function resize(){
const w=window.innerWidth,h=window.innerHeight-document.querySelector('header').offsetHeight;
renderer.setSize(w,h);camera.aspect=w/Math.max(1,h);camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();
renderer.setAnimationLoop(()=>renderer.render(scene,camera));
let asset;
function display(relaxed){
 group.clear();
 let rendered=0;
 for(const [type,x] of [['male',-1.2],['female',1.2]]){
  const visitor=createRiggedCharacter(THREE,asset,{bodyType:type,x,y:0,z:0,scale:1,yaw:0,pose:0},{relaxed});
  if(visitor){group.add(visitor);rendered++;}
 }
 status.textContent=rendered+'/2 rigged characters visible · '+(relaxed?'verified standing pose':'original A-pose');
 if(rendered!==2)document.querySelector('#error').textContent='Pose validation failed: see developer console';
 for(const [name,pressed] of [['relaxed',relaxed],['original',!relaxed]])
  document.getElementById(name).setAttribute('aria-pressed',String(pressed));
}
try{
 asset=await loadRiggedCharacterAsset();
 if(!asset)throw new Error('Rigged GLB not available at models/human-male-female-rigged.glb');
 display(true);
 document.querySelector('#relaxed').addEventListener('click',()=>display(true));
 document.querySelector('#original').addEventListener('click',()=>display(false));
}catch(error){
 console.error(error);status.textContent='Failed to load';
 document.querySelector('#error').textContent=error.message;
}
</script>
</body></html>
