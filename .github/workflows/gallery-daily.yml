name: Build ALGO ART daily gallery

# Only scheduled or explicit gallery builds may write new gallery assets.
# 9 Nov recovery: rerun after isolating the Confluence social test output.
# 8 Nov 2026: restore the 18-study archive after external GitHub Release
# Recovery follow-up: keep 9 originally published editions byte-for-byte
# and fill only the 9 missing studies; rebuild matching page and 3D assets.
# hosting returned HTTP 504 during the social workflow. This independent
# gallery generator never posts to social networks and preserves archived JPEGs.
on:
  # Repair/build changes can recover today's edition immediately without a manual dispatch.
  # Gallery output commits do not match these paths, so this cannot loop.
  push:
    branches: [main]
    paths:
      - 'gallery/visit/exterior-graffiti-plan.mjs'
  schedule:
    # Early morning UTC; the generator resolves the calendar day in Europe/London.
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Edition to recover (YYYY-MM-DD); blank uses London today'
        required: false
        type: string
      r2_canary:
        description: 'Publish the armed new edition from R2 with Pages copies for rollback'
        required: false
        default: false
        type: boolean
      r2_art_only:
        description: 'EXPERIMENTAL: date-armed R2-only edition with no GitHub painting binaries'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: gallery-daily
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      date: ${{ steps.plan.outputs.date }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: gallery
          persist-credentials: false
      - name: Select the dated publication or recovery path
        id: plan
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.date }}
          CANARY_REQUESTED: ${{ inputs.r2_canary }}
          ART_ONLY_REQUESTED: ${{ inputs.r2_art_only }}
          ARMED_DATE: ${{ vars.PP_R2_CANARY_DATE }}
          ART_ONLY_DATE: ${{ vars.PP_R2_ART_ONLY_DATE }}
          ART_ONLY_SOCIAL_READY: ${{ vars.PP_R2_ART_ONLY_SOCIAL_READY }}
        run: |
          TODAY="$(TZ=Europe/London date +%F)"
          DAY="${REQUESTED_DATE:-$TODAY}"
          [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && "$(date -d "$DAY" +%F)" == "$DAY" ]]
          MODE=legacy
          if [[ -f "gallery/$DAY/media-publication.json" ]]; then
            MODE=recover
          elif [[ "$ART_ONLY_REQUESTED" == true ]]; then
            # Explicit and date-armed only. Scheduled runs cannot enter this branch.
            [[ "$CANARY_REQUESTED" != true && "$GITHUB_EVENT_NAME" == workflow_dispatch &&
               -n "$ART_ONLY_DATE" && "$ART_ONLY_SOCIAL_READY" == true &&
               "$REQUESTED_DATE" == "$TODAY" &&
               "$DAY" == "$ART_ONLY_DATE" && "$DAY" > "2026-11-11" ]]
            if [[ -e "gallery/$DAY/meta.json" ]]; then
              echo "::error::R2-only publishing is restricted to a new edition date."
              exit 1
            fi
            MODE=r2-only
          elif [[ "$CANARY_REQUESTED" == true ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$REQUESTED_DATE" == "$TODAY" &&
               "$DAY" == "$ARMED_DATE" && "$DAY" > "2026-11-09" ]]
            if [[ -e "gallery/$DAY/meta.json" ]]; then
              echo "::error::The canary requires a new edition date."
              exit 1
            fi
            MODE=canary
          elif [[ "$DAY" == "$ARMED_DATE" ]]; then
            echo "This edition date is armed for a manual R2 canary." >> "$GITHUB_STEP_SUMMARY"
            MODE=hold
          fi
          printf 'date=%s\nmode=%s\n' "$DAY" "$MODE" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.mode == 'legacy' || needs.plan.outputs.mode == 'canary' || needs.plan.outputs.mode == 'r2-only'
    environment: ${{ (needs.plan.outputs.mode == 'canary' || needs.plan.outputs.mode == 'r2-only') && 'archive-media-test' || 'gallery-daily' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PUBLIC_SITE_URL: https://southernadd-cmyk.github.io/algoart/
      ALGOART_LOCAL_URL: http://127.0.0.1:4173/
      SOCIAL_DATE: ${{ needs.plan.outputs.date }}
      R2_EDITION_DATE: ${{ needs.plan.outputs.date }}
      R2_STAGE_OUTPUT: /tmp/pp-r2-edition-${{ github.run_id }}
      R2_CANARY: ${{ needs.plan.outputs.mode == 'canary' || needs.plan.outputs.mode == 'r2-only' }}
      R2_ART_ONLY: ${{ needs.plan.outputs.mode == 'r2-only' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install generator runtime
        run: |
          npm install
          npx playwright install --only-shell chromium
          node --input-type=module -e "import {chromium} from 'playwright'; const b=await chromium.launch({headless:true}); await b.close(); console.log('R2_CHROMIUM_SMOKE_OK')"

      - name: Install gallery preview dependency
        run: python3 -m pip install --break-system-packages 'Pillow>=10,<13'

      - name: Start local ALGO ART
        run: |
          python3 -m http.server 4173 >/tmp/algoart-gallery-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/algoart-gallery-http.log
          exit 1

      - name: Validate requested edition date
        run: |
          if [ -n "$SOCIAL_DATE" ]; then
            [[ "$SOCIAL_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 1
          fi

      - name: Select dated gallery edition format
        id: edition
        shell: bash
        run: |
          DAY="${SOCIAL_DATE:-$(node -e "const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const x=Object.fromEntries(p.map(v=>[v.type,v.value]));process.stdout.write(x.year+'-'+x.month+'-'+x.day)")}"
          if [[ "$DAY" > "2026-11-08" ]]; then
            echo "random=true" >> "$GITHUB_OUTPUT"
            echo "Twelve independent random studies for $DAY"
          else
            echo "random=false" >> "$GITHUB_OUTPUT"
            echo "Legacy eighteen-study edition for $DAY"
          fi

      - name: Validate golden roster and Confluence publication selection
        if: steps.edition.outputs.random == 'true'
        run: node --test tests/confluence-daily-publishing.test.mjs

      - name: Generate twelve independent random gallery studies
        if: steps.edition.outputs.random == 'true'
        run: node automation/generate-gallery-daily-12.mjs

      - name: Generate Confluence shared-canvas studies
        if: steps.edition.outputs.random == 'true'
        run: node automation/generate-gallery-confluence.mjs

      - name: Archive solo and Confluence studies
        if: steps.edition.outputs.random == 'true'
        env:
          GALLERY_QUEUE_MATERIAL: random
        run: npm run gallery:build

      - name: Generate deterministic daily batch
        if: steps.edition.outputs.random != 'true'
        run: npm run social:generate

      - name: Build marker gallery
        if: steps.edition.outputs.random != 'true'
        run: npm run gallery:build

      - name: Generate two landscape watercolor studies
        if: steps.edition.outputs.random != 'true'
        env:
          SOCIAL_MATERIAL: watercolor
          SOCIAL_ORIENTATION: landscape
        run: npm run social:generate

      - name: Archive landscape watercolors
        if: steps.edition.outputs.random != 'true'
        env:
          GALLERY_QUEUE_MATERIAL: watercolor
          GALLERY_QUEUE_ORIENTATION: landscape
        run: npm run gallery:build

      - name: Generate two portrait watercolor studies
        if: steps.edition.outputs.random != 'true'
        env:
          SOCIAL_MATERIAL: watercolor
          SOCIAL_ORIENTATION: portrait
        run: npm run social:generate

      - name: Archive portrait watercolors
        if: steps.edition.outputs.random != 'true'
        env:
          GALLERY_QUEUE_MATERIAL: watercolor
          GALLERY_QUEUE_ORIENTATION: portrait
        run: npm run gallery:build

      - name: Generate daily V2S Watercolour landscape
        if: steps.edition.outputs.random != 'true'
        env:
          SOCIAL_COUNT: '2'
          SOCIAL_MATERIAL: watercolour
          SOCIAL_ORIENTATION: landscape
        run: npm run social:generate

      - name: Archive daily V2S Watercolour landscape
        if: steps.edition.outputs.random != 'true'
        env:
          GALLERY_QUEUE_MATERIAL: watercolour
          GALLERY_QUEUE_ORIENTATION: landscape
        run: npm run gallery:build

      - name: Generate daily V2S Watercolour portrait
        if: steps.edition.outputs.random != 'true'
        env:
          SOCIAL_COUNT: '2'
          SOCIAL_MATERIAL: watercolour
          SOCIAL_ORIENTATION: portrait
        run: npm run social:generate

      - name: Archive daily V2S Watercolour portrait
        if: steps.edition.outputs.random != 'true'
        env:
          GALLERY_QUEUE_MATERIAL: watercolour
          GALLERY_QUEUE_ORIENTATION: portrait
        run: npm run gallery:build

      - name: Generate daily Oil Paint landscape
        if: steps.edition.outputs.random != 'true'
        env:
          SOCIAL_COUNT: '2'
          SOCIAL_MATERIAL: oil
          SOCIAL_ORIENTATION: landscape
        run: npm run social:generate

      - name: Archive daily Oil Paint landscape
        if: steps.edition.outputs.random != 'true'
        env:
          GALLERY_QUEUE_MATERIAL: oil
          GALLERY_QUEUE_ORIENTATION: landscape
        run: npm run gallery:build

      - name: Generate daily Oil Paint portrait
        if: steps.edition.outputs.random != 'true'
        env:
          SOCIAL_COUNT: '2'
          SOCIAL_MATERIAL: oil
          SOCIAL_ORIENTATION: portrait
        run: npm run social:generate

      - name: Archive daily Oil Paint portrait
        if: steps.edition.outputs.random != 'true'
        env:
          GALLERY_QUEUE_MATERIAL: oil
          GALLERY_QUEUE_ORIENTATION: portrait
        run: npm run gallery:build

      - name: Generate Action Painting landscape
        if: steps.edition.outputs.random != 'true'
        env:
          SOCIAL_MATERIAL: action
          SOCIAL_ORIENTATION: landscape
          SOCIAL_COUNT: '1'
        run: npm run social:generate

      - name: Archive Action Painting landscape
        if: steps.edition.outputs.random != 'true'
        env:
          GALLERY_QUEUE_MATERIAL: action
          GALLERY_QUEUE_ORIENTATION: landscape
        run: npm run gallery:build

      - name: Generate Action Painting portrait
        if: steps.edition.outputs.random != 'true'
        env:
          SOCIAL_MATERIAL: action
          SOCIAL_ORIENTATION: portrait
          SOCIAL_COUNT: '1'
        run: npm run social:generate

      - name: Archive Action Painting portrait
        if: steps.edition.outputs.random != 'true'
        env:
          GALLERY_QUEUE_MATERIAL: action
          GALLERY_QUEUE_ORIENTATION: portrait
        run: npm run gallery:build

      # Build the preview from the FINAL archive (including late Action Painting slots).
      # Never publish a gallery page that references an image we have not generated.
      - name: Build final daily gallery mosaic
        shell: bash
        run: |
          DAY="${SOCIAL_DATE:-$(node -e "const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()); const x=Object.fromEntries(p.map(v=>[v.type,v.value])); process.stdout.write(x.year+'-'+x.month+'-'+x.day)")}"
          python3 automation/build-gallery-previews.py --date "$DAY" --force

      # The 3D visitor never needs the archive JPEG's original pixel count.
      # Generate both browser-targeted sizes after the LAST artwork slot.
      - name: Test gallery texture exporter
        run: python3 -m unittest discover -s tests -p test_gallery_3d_textures.py

      - name: Generate WebP textures for the 3D exhibition
        shell: bash
        run: |
          DAY="${SOCIAL_DATE:-$(node -e "const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()); const x=Object.fromEntries(p.map(v=>[v.type,v.value])); process.stdout.write(x.year+'-'+x.month+'-'+x.day)")}"
          python3 automation/build-gallery-3d-textures.py --date "$DAY"

      # V2 sculpture meshes are baked separately after publication to R2.
      # Do not generate a second legacy V1 sculpture pack here.

      # This runs only after the final artwork slot has been archived, so the
      # baked geometry and daily archive share the same seed signatures.
      - name: Pre-render graffiti atlases for new indoor floor and exterior facade
        # Graffiti is optional; exclude its binary atlases from new R2-only editions.
        if: env.R2_ART_ONLY != 'true'
        shell: bash
        run: |
          DAY="${SOCIAL_DATE:-$(node -e "const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const x=Object.fromEntries(p.map(v=>[v.type,v.value]));process.stdout.write(x.year+'-'+x.month+'-'+x.day)")}"
          node automation/build-gallery-graffiti.mjs --date="$DAY"

      - name: Verify saved graffiti atlases
        if: env.R2_ART_ONLY != 'true'
        shell: bash
        run: |
          DAY="${SOCIAL_DATE:-$(node -e "const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const x=Object.fromEntries(p.map(v=>[v.type,v.value]));process.stdout.write(x.year+'-'+x.month+'-'+x.day)")}"
          test -s "gallery/$DAY/3d/graffiti/desktop/manifest.json"
          test -s "gallery/$DAY/3d/graffiti/mobile/manifest.json"
          test -s gallery/visit/graffiti-assets/exterior/desktop/manifest.json
          test -s gallery/visit/graffiti-assets/exterior/mobile/manifest.json
          node --test tests/gallery-exterior-graffiti.test.mjs tests/gallery-interior-graffiti.test.mjs

      - name: Validate every phi exhibition before publication
        run: node automation/validate-phi-archive.mjs

      - name: Prebuild complete 3D tower geometry
        run: node automation/build-tower-geometry.mjs

      - name: Illustrate the same seeded tower geometry
        run: node automation/build-gallery-tower-illustration.mjs

      - name: Verify illustrated floor geometry
        run: node --test tests/gallery-tower-illustration.test.mjs

      - name: Rebuild production gallery bundle from verified sources
        run: |
          npm run gallery:bundle
          npm run gallery:bundle:phi

      - name: Verify public 3D gallery files, imports and floor links
        run: node --test tests/gallery-public-launch.test.mjs

      - name: Verify standing gallery visitors on every floor
        run: node --test tests/gallery-standing-visitors.test.mjs

      - name: Verify gallery output
        shell: bash
        run: |
          test -s gallery/index.html
          test -s gallery/archive.json
          test -s gallery/feed.xml
          test -s gallery/tower-layouts.json
          test -s gallery/tower-geometry.bin.gz
          node --input-type=module -e "
          import fs from 'node:fs';
          import zlib from 'node:zlib';
          const packed=zlib.gunzipSync(fs.readFileSync('gallery/tower-geometry.bin.gz'));
          const size=packed.readUInt32LE(0);
          const baked=JSON.parse(packed.subarray(4,4+size).toString('utf8'));
          const live=JSON.parse(fs.readFileSync('gallery/tower-layouts.json','utf8'));
          if(baked.version!==2||baked.floors.length!==live.floors.length)throw Error('Incomplete prepared tower');
          for(let i=0;i<live.floors.length;i++){
            const day=live.floors[i],floor=baked.floors[i];
            if(day.date!==floor.date||floor.signature!==day.studies.map(x=>x.join(':')).join('|'))throw Error('Stale prepared tower '+day.date);
            if(!floor.batches.length)throw Error('Missing floor meshes '+day.date);
            // A gallery has no exterior wall windows: only glazed
            // walkways (separate geometry) and the uppermost skylights.
            const allowed=new Set(['floor','roof','join','plinth','brick','skylight']);
            for(const batch of floor.batches){
              if(!allowed.has(batch.material))throw Error('Unexpected facade material '+batch.material+' on '+day.date);
            }
            if(i===live.floors.length-1&&!floor.batches.some(b=>b.material==='skylight'))
              throw Error('Rooftop skylight missing '+day.date);
          }
          "
          test -s sitemap.xml
          test -s robots.txt
          DAY="${SOCIAL_DATE:-$(node -e "const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()); const x=Object.fromEntries(p.map(v=>[v.type,v.value])); process.stdout.write(x.year+'-'+x.month+'-'+x.day)")}"
          test -s "gallery/$DAY/index.html"
          test -s "gallery/$DAY/archive-preview.jpg"
          test -s "gallery/$DAY/3d/manifest.json"
          DAY="$DAY" python3 - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image
          date = os.environ['DAY']
          preview = Path('gallery') / date / 'archive-preview.jpg'
          with Image.open(preview) as image:
              image.verify()
          with Image.open(preview) as image:
              assert image.size == (840, 600), f'{preview}: {image.size}'
          import json
          meta = json.loads((Path('gallery') / date / 'meta.json').read_text())
          manifest = json.loads((Path('gallery') / date / '3d' / 'manifest.json').read_text())
          assert manifest['version'] == 1
          assert set(manifest['images']) == {entry['imageFile'] for entry in meta['entries']}
          for variants in manifest['images'].values():
              for label, cap in [('desktop', 1100), ('mobile', 640)]:
                  asset = Path('gallery') / date / variants[label]
                  assert asset.is_file(), f'Missing {label} texture: {asset}'
                  with Image.open(asset) as img:
                      assert img.format == 'WEBP', f'{asset} is not WebP'
                      assert max(img.size) <= cap, f'{asset} exceeds {cap}px'
          portraits = {entry['imageFile'] for entry in meta['entries'] if entry.get('orientation') == 'portrait' and entry.get('material') != 'confluence'}
          assert portraits and all((Path('gallery') / date / name).is_file() for name in portraits), 'Missing solo portraits for V2'
          print(f'Verified complete mosaic, WebP textures and V2 source portraits: {preview}')
          PY
          COUNT="$(DAY="$DAY" node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('gallery/'+process.env.DAY+'/meta.json')); console.log(m.entries.length)")"
          # New materials add artwork without changing the historical batch size.
          # Require the established baseline; do not reject additional material batches.
          if [[ "$DAY" > "2026-11-08" ]]; then
            DAY="$DAY" node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {validateRandomGalleryEdition} from './automation/confluence-edition.mjs';
          const day = process.env.DAY;
          const {entries} = JSON.parse(fs.readFileSync(`gallery/${day}/meta.json`, 'utf8'));
          validateRandomGalleryEdition(day, entries);
          JS
            test -s "gallery/$DAY/random-edition.json"
          elif [[ "$DAY" > "2026-10-16" ]]; then
            test "$COUNT" -eq 18
            DAY="$DAY" node --input-type=module -e "import fs from 'node:fs';const e=JSON.parse(fs.readFileSync('gallery/'+process.env.DAY+'/meta.json')).entries;for(const [kind,n] of [['marker',4],['watercolor',4],['watercolour',4],['oil',4],['action',2]]) {const found=e.filter(x=>(x.material||'marker')===kind);if(found.length!==n)throw Error(kind+' must have '+n+' studies; got '+found.length)}"
            DAY="$DAY" node --input-type=module -e "import fs from 'node:fs'; const day=process.env.DAY; const m=JSON.parse(fs.readFileSync('gallery/'+day+'/meta.json')); for(const orientation of ['landscape','portrait']) {if(!m.entries.some(e=>e.material==='action' && e.orientation===orientation))throw Error('Missing Action Painting '+orientation+' in '+day)}"
          else
            test "$COUNT" -ge 13
          fi
          echo "Verified gallery/$DAY with $COUNT actual artwork entries."

      - name: Prepare the verified edition overlay and upload immutable R2 media
        if: env.R2_CANARY == 'true'
        env:
          PP_R2_CANARY_DATE: ${{ needs.plan.outputs.mode == 'r2-only' && vars.PP_R2_ART_ONLY_DATE || vars.PP_R2_CANARY_DATE }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_MEDIA_ACCESS_KEY_ID: ${{ secrets.R2_MEDIA_ACCESS_KEY_ID }}
          R2_MEDIA_SECRET_ACCESS_KEY: ${{ secrets.R2_MEDIA_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          node automation/prepare-r2-daily.mjs
          python3 -m pip install --break-system-packages 'boto3>=1.37,<2'
          python3 automation/r2-daily-media.py upload "$R2_STAGE_OUTPUT/media-publication.json"

      - name: Check staged 2D gallery and real tower before committing
        if: env.R2_CANARY == 'true'
        run: |
          # Chromium was smoke-tested above. Avoid APT-based WebKit install.
          R2_BROWSERS=chromium node tests/r2-gallery-browser.mjs

      - name: Prepare and verify R2-only V2 sculptures before publishing gallery
        if: env.R2_ART_ONLY == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_MEDIA_ACCESS_KEY_ID: ${{ secrets.R2_MEDIA_ACCESS_KEY_ID }}
          R2_MEDIA_SECRET_ACCESS_KEY: ${{ secrets.R2_MEDIA_SECRET_ACCESS_KEY }}
          PP_R2_ART_ONLY_DATE: ${{ vars.PP_R2_ART_ONLY_DATE }}
          PP_R2_ART_ONLY_SOCIAL_READY: ${{ vars.PP_R2_ART_ONLY_SOCIAL_READY }}
          V2_PUBLISH_DATE: ${{ needs.plan.outputs.date }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          node automation/build-sculpture-v2-baker.mjs
          mkdir -p /tmp/r2-art-only-v2-${{ github.run_id }}
          node automation/build-sculpture-v2-packs.mjs \
            --date "$SOCIAL_DATE" --quality both \
            --out "/tmp/r2-art-only-v2-${{ github.run_id }}"
          V2_BAKE_OUT="/tmp/r2-art-only-v2-${{ github.run_id }}" \
            node --test tests/sculpture-v2-packs.test.mjs
          python3 automation/publish-sculpture-v2-daily-r2.py \
            --date "$SOCIAL_DATE" --out "/tmp/r2-art-only-v2-${{ github.run_id }}" --dry-run
          python3 automation/publish-sculpture-v2-daily-r2.py \
            --date "$SOCIAL_DATE" --out "/tmp/r2-art-only-v2-${{ github.run_id }}"
          echo "R2_ONLY_GALLERY_AND_V2_VERIFIED date=$SOCIAL_DATE"

      - name: Save the media inventory and delivery verification
        if: ${{ always() && env.R2_CANARY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: r2-canary-${{ needs.plan.outputs.date }}
          path: |
            ${{ env.R2_STAGE_OUTPUT }}/media-publication.json
            ${{ env.R2_STAGE_OUTPUT }}/upload-verification.json
          if-no-files-found: warn

      - name: Persist gallery archive
        id: gallery_commit
        shell: bash
        run: |
          rm -rf social-output
          # npm install can modify the tracked lockfile. Restore it before rebase.
          git restore --worktree package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$R2_ART_ONLY" == true ]]; then
            # No binary ever enters this edition's Git tree. The cleanup is
            # permitted only after all R2 objects and staged bytes verified.
            node automation/activate-r2-daily.mjs
            node automation/prune-r2-art-only.mjs
            git add -A gallery sitemap.xml robots.txt
            # Artwork storage means ZERO new binary art blobs in the Git commit.
            if git diff --cached --name-only --diff-filter=ACM | \
                grep -E "^gallery/$SOCIAL_DATE/.*\\.(jpg|jpeg|png|webp|gif|json\\.gz)$"; then
              echo "::error::R2-only commit still contains artwork bytes"
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "::error::R2-only edition has no catalogue changes"
              exit 1
            fi
            git commit -m "Publish R2-only ALGO ART daily gallery $SOCIAL_DATE"
            # Push must fail closed when another publisher updated main.
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add gallery sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Daily gallery already matches the deterministic batch."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            DAY="${SOCIAL_DATE:-$(node -e "const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()); const x=Object.fromEntries(p.map(v=>[v.type,v.value])); process.stdout.write(x.year+'-'+x.month+'-'+x.day)")}"
            git commit -m "Publish ALGO ART daily gallery $DAY"
            if [[ "$R2_CANARY" == true ]]; then
              node automation/activate-r2-daily.mjs
              git add "gallery/$DAY" gallery/index.html gallery/archive.json gallery/feed.xml
              git commit -m "Serve $DAY daily gallery media from R2"
              # Keep both commits atomic. A concurrent main update must abort
              # this canary so it cannot overwrite another gallery publisher.
              git push origin HEAD:main
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Daily assets are regenerated deterministically by this job. When
            # another gallery build updated binary atlases concurrently, keep
            # this build's version during the rebase instead of failing.
            git fetch origin main
            git -c merge.renormalize=false rebase -X theirs origin/main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Explicitly trigger Pages deployment
        if: steps.gallery_commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --ref main

      - name: Verify the deployed canary and its social source
        if: env.R2_CANARY == 'true'
        run: |
          node automation/verify-r2-gallery-ready.mjs "$SOCIAL_DATE"
          R2_BROWSERS=chromium node tests/r2-gallery-browser.mjs --live

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### ALGO/ART daily gallery" >> "$GITHUB_STEP_SUMMARY"
          echo "- Archive: https://southernadd-cmyk.github.io/algoart/gallery/" >> "$GITHUB_STEP_SUMMARY"
          echo "- 9 Nov: 12 solo studies and 4 Confluence studies. From 10 Nov: 12 solo studies and one Confluence portrait and landscape." >> "$GITHUB_STEP_SUMMARY"
          echo "- Static HTML + JSON-LD + Open Graph + RSS + sitemap" >> "$GITHUB_STEP_SUMMARY"

  recover:
    needs: plan
    if: needs.plan.outputs.mode == 'recover'
    runs-on: ubuntu-latest
    env:
      EDITION_DATE: ${{ needs.plan.outputs.date }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the frozen R2 edition and its local rollback copies
        run: python3 automation/r2-daily-media.py recover "gallery/$EDITION_DATE/media-publication.json"
      - name: Redispatch Pages when an operator requested recovery
        if: github.event_name == 'workflow_dispatch'
        run: gh workflow run deploy-pages.yml --ref main
      - name: Verify Pages has the complete edition
        run: node automation/verify-r2-gallery-ready.mjs "$EDITION_DATE"

  archive-check:
    needs: [build, recover]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.recover.result == 'success') }}
    uses: ./.github/workflows/archive-reproduction.yml
    with:
      checkout_ref: main

