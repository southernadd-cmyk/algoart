name: Regional Assembly preset release
on:
  pull_request:
    paths:
      - 'gallery/sculpture-v2-test/sculpture-presets.*'
      - 'automation/publish-sculpture-preset.py'
      - 'tests/sculpture-presets.test.mjs'
      - 'tests/test_sculpture_preset_release.py'
      - '.github/workflows/sculpture-preset-release.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sculpture-preset-release.yml'
      - 'automation/sculpture-preset-release.trigger'
permissions:
  contents: read
concurrency:
  group: sculpture-preset-release
  cancel-in-progress: false
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --test tests/sculpture-presets.test.mjs
          python3 -m unittest discover -s tests -p test_sculpture_preset_release.py -v
  rebuild-and-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: unit
    environment: archive-media-test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      V2_BAKE_PRESET: assembly-100-100-40-95
      V2_BAKE_OUT: artifacts/sculpture-preset-history
      V2_RECEPTION_OUT: artifacts/sculpture-preset-reception
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci
          npx playwright install --with-deps chromium
          python3 -m pip install 'boto3>=1.37,<2'
          node automation/build-sculpture-v2-baker.mjs
      - name: Restore the exact published reception painting
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from urllib.request import urlopen,Request
          url='https://proportion-piece-sculpture-v2.mr-adam-clement.workers.dev/sculptures-v2/v4.2.1-20261110/catalog/a9a1771413a085e3d73dc19c806c6a86d9026e36e8ba6539d5676bf4dc13892f.json'
          raw=urlopen(Request(url,headers={'Origin':'https://southernadd-cmyk.github.io'}),timeout=90).read()
          assert hashlib.sha256(raw).hexdigest()=='a9a1771413a085e3d73dc19c806c6a86d9026e36e8ba6539d5676bf4dc13892f'
          catalog=json.loads(raw)
          base=Path('gallery/sculpture-v2-test/reception');base.mkdir(parents=True,exist_ok=True)
          for key,name in [('image','recursive-divisions-portrait.png'),('source','source.json')]:
              spec=catalog['reception'][key]
              data=urlopen(Request(spec['url'],headers={'Origin':'https://southernadd-cmyk.github.io'}),timeout=90).read()
              assert len(data)==spec['bytes'] and hashlib.sha256(data).hexdigest()==spec['sha256']
              (base/name).write_bytes(data)
          PY
      - name: Start the private bake server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/preset-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/gallery/sculpture-v2-test/sculpture-bake.html >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Rebuild every published floor in both qualities
        run: |
          node automation/build-sculpture-v2-packs.mjs --all --quality both --out "$V2_BAKE_OUT"
          node --test tests/sculpture-v2-packs.test.mjs
      - name: Rebuild reception from the same original source
        run: |
          node automation/build-reception-v2.mjs
          cp gallery/sculpture-v2-test/reception/recursive-divisions-portrait.png "$V2_RECEPTION_OUT/"
          cp gallery/sculpture-v2-test/reception/source.json "$V2_RECEPTION_OUT/"
          node --test tests/sculpture-v2-reception.test.mjs
      - name: Audit the complete new release before accessing R2
        run: python3 automation/publish-sculpture-preset.py "$V2_BAKE_OUT" "$V2_RECEPTION_OUT" --dry-run
      - name: Publish and verify the new immutable release
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_MEDIA_ACCESS_KEY_ID: ${{ secrets.R2_MEDIA_ACCESS_KEY_ID }}
          R2_MEDIA_SECRET_ACCESS_KEY: ${{ secrets.R2_MEDIA_SECRET_ACCESS_KEY }}
        run: python3 automation/publish-sculpture-preset.py "$V2_BAKE_OUT" "$V2_RECEPTION_OUT"
      - name: Retain the publication receipt and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sculpture-preset-release-receipt
          path: |
            artifacts/sculpture-preset-history/release-publication.json
            artifacts/sculpture-preset-history/r2-preset-catalog.json
            artifacts/sculpture-preset-history/bake-report.json
            artifacts/sculpture-preset-reception/manifest.json
          if-no-files-found: warn
          retention-days: 90
