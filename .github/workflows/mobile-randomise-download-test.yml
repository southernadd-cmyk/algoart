name: Mobile randomise repeated-download regression
on:
  push:
    branches: [fix/mobile-randomise-repeat-download]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-randomise-download-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/algoart-mobile.log 2>&1 &
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Android-size PNG randomise PNG without refresh
        run: node tests/mobile-export-paper.test.mjs
      - name: Check export material reproducibility
        run: npm run test:tissue-colour
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-export-smoke
          path: oil-check-results/
          retention-days: 7
