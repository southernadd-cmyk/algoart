name: V5 recursive corner verification
on:
  push:
    branches: [fix/tissue-v5-recursive-corner]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corner:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/algoart.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Check V5 closed ribbon no false corner paint
        run: node tests/tissue-v5-corner.test.mjs
      - name: Verify historic pigments and V4 preservation
        run: npm run test:tissue-colour
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-corner-check
          path: oil-check-results/
          retention-days: 7
