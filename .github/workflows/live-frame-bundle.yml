name: Release approved live painting-frame batching
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-frame-bundle.yml'
permissions:
  contents: write
concurrency:
  group: live-frame-bundle-20261101
  cancel-in-progress: false
jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test frame geometry and ensure live material equals approved test material
        run: |
          node --test tests/phi-painting-frame-batch.test.mjs tests/phi-caption-batch.test.mjs
          cmp gallery/visit/phi-frame-material.mjs test/virtual-gallery/phi-frame-material.mjs
          node --check gallery/visit/gallery-phi.js
          node --check gallery/visit/phi-painting-frame-batch.mjs
          node --check gallery/visit/phi-frame-material.mjs
      - name: Build live production bundle and verify both batching features are present
        run: |
          npm run gallery:bundle:phi
          node --check gallery/visit/gallery-phi-bundle.js
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const s=fs.readFileSync('gallery/visit/gallery-phi-bundle.js','utf8');
          for(const needle of ['phi-instanced-painting-frames','phi-batched-painting-captions',
            'phiFrameDimensions','framebatch','captionbatch']){
            if(!s.includes(needle))throw Error('Bundle missing approved feature: '+needle);
          }
          JS
      - name: Update both live bundle cache references and create build evidence
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const file='gallery/visit/index.html';
          const old=fs.readFileSync(file,'utf8');
          const token=/gallery-phi-bundle\.js\?v=[a-zA-Z0-9_-]+/g;
          if((old.match(token)||[]).length!==2)throw Error('Unexpected live module reference count');
          const bundle=fs.readFileSync('gallery/visit/gallery-phi-bundle.js');
          const hash=createHash('sha256').update(bundle).digest('hex');
          const version='live-framebatch-'+hash.slice(0,12);
          fs.writeFileSync(file,old.replace(token,'gallery-phi-bundle.js?v='+version));
          const sourcePaths=['gallery/visit/gallery-phi.js','gallery/visit/phi-frame-material.mjs',
            'gallery/visit/phi-painting-frame-batch.mjs','gallery/visit/index.html'];
          const revisions=Object.fromEntries(sourcePaths.map(p=>[p,execFileSync('git',['rev-parse','HEAD:'+p],{encoding:'utf8'}).trim()]));
          fs.writeFileSync('gallery/visit/frame-batch-build.json',JSON.stringify({
            feature:'painting-frame-batching',enabledByDefault:true,rollback:'?framebatch=0',
            captionBatchPreserved:true,bundleSha256:hash,version,checks:'passed',revisions
          },null,2)+'\n');
          JS
      - name: Publish production bundle, cache version, and verification manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          original_source=$(git rev-parse HEAD:gallery/visit/gallery-phi.js)
          original_material=$(git rev-parse HEAD:gallery/visit/phi-frame-material.mjs)
          original_helper=$(git rev-parse HEAD:gallery/visit/phi-painting-frame-batch.mjs)
          original_html=$(git rev-parse HEAD:gallery/visit/index.html)
          git add gallery/visit/gallery-phi-bundle.js gallery/visit/index.html gallery/visit/frame-batch-build.json
          git commit -m 'Release verified painting-frame batching to live gallery'
          git pull --rebase origin main
          [[ "$(git rev-parse HEAD:gallery/visit/gallery-phi.js)" == "$original_source" ]] || { echo 'Live code changed concurrently; aborting'; exit 1; }
          [[ "$(git rev-parse HEAD:gallery/visit/phi-frame-material.mjs)" == "$original_material" ]] || { echo 'Frame shader changed concurrently; aborting'; exit 1; }
          [[ "$(git rev-parse HEAD:gallery/visit/phi-painting-frame-batch.mjs)" == "$original_helper" ]] || { echo 'Batching logic changed concurrently; aborting'; exit 1; }
          [[ "$(git rev-parse HEAD^:gallery/visit/index.html)" == "$original_html" ]] || { echo 'Live page changed concurrently; aborting'; exit 1; }
          git push origin HEAD:main
