name: Rebuild gallery bundle
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rebuild-gallery-bundle.yml'
      - 'gallery/visit/gallery-v2.js'
      - 'gallery/visit/gallery-phi.js'
      - 'package.json'
      - 'gallery/visit/*.mjs'
jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run gallery:bundle
      - run: npm run gallery:bundle:phi
      - name: Commit generated bundle only when changed
        run: |
          if ! git diff --quiet -- gallery/visit/gallery-bundle.js gallery/visit/gallery-phi-bundle.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add gallery/visit/gallery-bundle.js gallery/visit/gallery-phi-bundle.js
            git commit -m 'Rebuild gallery bundle from current source'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
