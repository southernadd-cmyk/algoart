name: Research gramophone score-to-recording alignment
on:
  push:
    branches: [main]
    paths:
      - 'automation/align-gramophone-scores.py'
      - '.github/workflows/gramophone-score-alignment.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gramophone-score-alignment-main
  cancel-in-progress: true
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install score alignment dependencies
        run: |
          python -m pip install --disable-pip-version-check 'librosa==0.11.0' 'soundfile>=0.13' 'scipy>=1.13'
      - name: Match digitized scores against exact gallery OGGs
        run: |
          python automation/align-gramophone-scores.py --track both --out gramophone-alignment-candidates.json
      - name: Preserve alignment candidate for independent inspection
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Base the update on the latest main BEFORE copying regenerated
          # evidence, so simultaneous source edits cannot cause rebase conflicts.
          git fetch origin main
          git checkout -B gramophone-evidence origin/main
          mkdir -p automation/alignment-evidence
          cp gramophone-alignment-candidates.json automation/alignment-evidence/gramophone-candidates.json
          git add automation/alignment-evidence/gramophone-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Record unpublished gramophone score alignment candidates"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gramophone-score-to-audio-candidates
          path: gramophone-alignment-candidates.json
          if-no-files-found: ignore
