name: Deploy social preview Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/social-preview/**'
      - '.github/workflows/deploy-social-preview-worker.yml'

permissions:
  contents: read

concurrency:
  group: deploy-social-preview-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test social preview Worker
        run: |
          node --test cloudflare/social-preview/src/worker.test.mjs
          node --test cloudflare/social-preview/tests/worker.test.mjs
      - name: Verify deployment credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
      - name: Deploy using Wrangler
        working-directory: cloudflare/social-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
