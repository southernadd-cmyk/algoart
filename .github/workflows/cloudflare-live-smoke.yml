name: Verify deployed Cloudflare social preview
on:
  pull_request:
    paths:
      - 'tests/cloudflare-live-smoke.mjs'
      - '.github/workflows/cloudflare-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/cloudflare-live-smoke.mjs
