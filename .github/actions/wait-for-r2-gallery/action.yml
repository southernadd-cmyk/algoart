name: Wait for the armed R2 gallery date
description: Require the verified Pages edition before publishing social links for an R2 canary.
inputs:
  date:
    description: London edition date
    required: true
  canary_date:
    description: Armed canary date
    required: false
  art_only_date:
    description: Armed R2 artwork-only date
    required: false
  art_only_auto_from:
    description: First date for scheduled R2-only editions
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      env:
        EDITION_DATE: ${{ inputs.date }}
        ARMED_DATE: ${{ inputs.canary_date }}
        ART_ONLY_DATE: ${{ inputs.art_only_date }}
        ART_ONLY_AUTO_FROM: ${{ inputs.art_only_auto_from }}
      run: |
        [[ "$EDITION_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
        if [[ "$EDITION_DATE" == "$ARMED_DATE" || "$EDITION_DATE" == "$ART_ONLY_DATE" || -f "gallery/$EDITION_DATE/media-publication.json" ||
              ( "$ART_ONLY_AUTO_FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && ! "$EDITION_DATE" < "$ART_ONLY_AUTO_FROM" ) ]]; then
          node automation/verify-r2-gallery-ready.mjs "$EDITION_DATE"
          git fetch origin main
          git checkout -B main origin/main
          test -s "gallery/$EDITION_DATE/media-publication.json"
        fi
