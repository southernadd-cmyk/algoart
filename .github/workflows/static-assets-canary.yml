name: Isolated website canary preflight (Cloudflare Git integration)
# No production publish. Cloudflare Workers Builds, already linked to GitHub,
# handles the actual deploy after a separate canary Worker is configured.
on:
  push:
    branches: [experiment/cloudflare-static-assets-canary-20261110]
    paths:
      - '.github/workflows/static-assets-canary.yml'
      - 'cloudflare/web-canary/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: independent-static-site-canary-preflight
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'southernadd-cmyk/algoart'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate the separate canary website
        run: bash cloudflare/web-canary/build.sh
      - name: Confirm the distinct Worker name and safe site base path
        run: |
          grep -q '^name = "proportion-piece-web-canary"$' cloudflare/web-canary/wrangler.toml
          grep -q '^base_path = "/algoart"$' cloudflare/web-canary/wrangler.toml
          grep -q '^directory = "../../_site"$' cloudflare/web-canary/wrangler.toml
          echo "CLOUDFLARE GIT CANARY PREFLIGHT PASS — no GitHub deployment token needed"
