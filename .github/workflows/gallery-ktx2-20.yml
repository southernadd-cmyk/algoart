name: Build twenty TEST-only KTX2 architecture maps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - automation/gallery-ktx2-20.trigger
permissions:
  contents: write
  actions: write
concurrency:
  group: gallery-ktx2-20-assets
  cancel-in-progress: true
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Pillow for WebP conversion
        run: python -m pip install Pillow==11.3.0
      - name: Install pinned Khronos KTX encoder
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/ktx.deb" \
            https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb
          echo "ca635ed489d8bf54fac8d7687056c651193de0740830a7738cc034adc63e3027  $RUNNER_TEMP/ktx.deb" | sha256sum -c
          sudo dpkg --install "$RUNNER_TEMP/ktx.deb" || { sudo apt-get update; sudo apt-get install -fy; }
          command -v toktx
      - name: Generate and inspect all twenty test-only maps
        run: python3 automation/build-gallery-ktx2-20.py
      - name: Validate all twenty originals and compression outputs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('test/virtual-gallery/ktx2-20/manifest.json').read_text())
          assert d['count']==20
          assert sum(x['usage']=='active' for x in d['textures'])==6
          assert sum(x['usage']=='reception' for x in d['textures'])==3
          assert sum(x['usage']=='optional' for x in d['textures'])==11
          assert all(x['width']>0 and x['height']>0 for x in d['textures'])
          assert all(x['ktx2Bytes']>128 for x in d['textures'])
          print('Validated 20 distinct KTX2 files: six core + three reception + eleven optional')
          PY
      - name: Commit only twenty compressed TEST textures and report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/virtual-gallery/ktx2-20/
          if ! git diff --cached --quiet; then
            git commit -m 'Add twenty test-only architectural KTX2 candidates and source-size manifest'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          gh workflow run deploy-pages.yml --ref main
