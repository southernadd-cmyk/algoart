name: Import annotated Debussy recording for test tower
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-asap-debussy-test.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-asap-debussy-test
  cancel-in-progress: true
jobs:
  import-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Obtain the exact ASAP-aligned MAESTRO performance
        run: |
          python -m pip install --disable-pip-version-check 'huggingface_hub>=0.31,<2'
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          import shutil
          name='2008/MIDI-Unprocessed_06_R2_2008_01-05_ORIG_MID--AUDIO_06_R2_2008_wav--4.wav'
          path=hf_hub_download(repo_id='ddPn08/maestro-v3.0.0',repo_type='dataset',filename=name)
          shutil.copyfile(path,'/tmp/reflets-asap-2008.wav')
          print('Source WAV bytes:',Path(path).stat().st_size)
          PY
      - name: Convert to quality Ogg Opus and check timing
        run: |
          python -m pip install --disable-pip-version-check 'imageio-ffmpeg>=0.6' 'soundfile>=0.13'
          python - <<'PY'
          import subprocess
          import imageio_ffmpeg
          ffmpeg=imageio_ffmpeg.get_ffmpeg_exe()
          cmd=[ffmpeg,'-hide_banner','-loglevel','error','-nostdin','-y',
               '-i','/tmp/reflets-asap-2008.wav','-map','0:a:0','-vn','-ac','2',
               '-c:a','libopus','-b:a','160k','-vbr','on','-application','audio',
               'gallery/visit/audio/debussy-reflets-asap-kleisen.ogg']
          print('FFmpeg:',ffmpeg,flush=True)
          subprocess.run(cmd,check=True)
          PY
          python - <<'PY'
          import json,hashlib,soundfile
          from pathlib import Path
          source=Path('/tmp/reflets-asap-2008.wav')
          out=Path('gallery/visit/audio/debussy-reflets-asap-kleisen.ogg')
          a=soundfile.info(str(source)).duration
          try:
              b=soundfile.info(str(out)).duration
          except RuntimeError:
              # Opus granule positions run at 48k samples/s even with a WAV
              # source of another sample rate; page granule includes pre-skip.
              import struct
              with open(out,'rb') as f:
                  f.seek(max(0,out.stat().st_size-128*1024))
                  tail=f.read()
              idx=tail.rfind(b'OggS')
              if idx<0: raise SystemExit('Missing final Ogg page')
              b=struct.unpack_from('<Q',tail,idx+6)[0]/48000
              print('Validated Ogg Opus granule duration:',b)
          print('Source/Opus duration',a,b,'Opus size',out.stat().st_size)
          if not (280<a<320) or abs(a-b)>.2:
              raise SystemExit('Audio duration differs from ASAP annotation span')
          meta={
              'piece':'Claude Debussy — Reflets dans l’eau',
              'performance':'MAESTRO 2008 — ASAP Kleisen11M',
              'source':'https://huggingface.co/datasets/ddPn08/maestro-v3.0.0',
              'alignment':'https://github.com/fosfrancesco/asap-dataset/tree/master/Debussy/Images_Book_1/1_Reflets_dans_lEau',
              'license':'CC BY-NC-SA 4.0',
              'derivedFromOriginalWav':True,
              'originalWavSha256':hashlib.sha256(source.read_bytes()).hexdigest(),
              'oggSha256':hashlib.sha256(out.read_bytes()).hexdigest(),
              'sourceDurationSeconds':a,
              'oggDurationSeconds':b
          }
          Path('gallery/visit/audio/debussy-reflets-asap-kleisen-provenance.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY
      - name: Commit test-only source audio and attribution metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B asap-audio-import origin/main
          git add gallery/visit/audio/debussy-reflets-asap-kleisen.ogg gallery/visit/audio/debussy-reflets-asap-kleisen-provenance.json
          if ! git diff --cached --quiet; then
            git commit -m "Store test-only ASAP-annotated Reflets recording with original WAV provenance"
            git push origin HEAD:main
          fi
