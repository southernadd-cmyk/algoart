name: Verify test lift painting queue priority and profiling
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phi-lift-queue-profiler-tests.yml'
      - 'tests/phi-lift-queue-profiler.test.mjs'
      - 'test/virtual-gallery/gallery-phi.js'
      - 'test/virtual-gallery/phi-artwork-preload.mjs'
      - 'test/virtual-gallery/phi-lift-painting-gpu.mjs'
      - 'test/virtual-gallery/phi-room-geometry-stage.mjs'
      - 'test/virtual-gallery/phi-lift-profile.mjs'
      - 'test/virtual-gallery/phi-postfx-pass-profiler.mjs'
      - 'test/virtual-gallery/phi-painting-arrival-gate.mjs'
      - 'test/virtual-gallery/phi-lift-indicator.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/phi-lift-queue-profiler.test.mjs
