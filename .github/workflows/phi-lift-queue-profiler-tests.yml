name: Verify test lift painting queue priority and profiling
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phi-lift-queue-profiler-tests.yml'
      - 'tests/phi-lift-queue-profiler.test.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/phi-lift-queue-profiler.test.mjs
