name: Manual AI sculpture pilot (Meshy image-to-3D)
# This workflow can spend provider credits. It runs ONLY when manually invoked.
# No scheduled/daily use, no push trigger and no production gallery modification.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Archive date of the source solo portrait"
        type: string
        required: true
        default: "2026-11-09"
      image_file:
        description: "Exact filename from gallery/YYYY-MM-DD/meta.json"
        type: string
        required: true
        default: "2026-11-09-G07-oil-rects-portrait.jpg"
      confirm_spend:
        description: "Type YES to authorize ONE credit-charging provider generation"
        required: true
        type: string
        default: "NO"

permissions:
  contents: read

jobs:
  prepare-one-image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
      GALLERY_DAY: ${{ inputs.date }}
      IMAGE_FILE: ${{ inputs.image_file }}
      CONFIRM: ${{ inputs.confirm_spend }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify one source and explicit paid-run approval
        shell: bash
        run: |
          python3 automation/meshy-sculpture-pilot.py \
            --date "$GALLERY_DAY" --image-file "$IMAGE_FILE" --dry-run
          if [[ "$CONFIRM" != "YES" ]]; then
            echo "No paid task submitted: confirm_spend was not YES" >&2
            exit 1
          fi
          if [[ -z "$MESHY_API_KEY" ]]; then
            echo "Missing MESHY_API_KEY secret. Nothing was charged." >&2
            exit 1
          fi
      - name: Generate ONE real image-to-3D textured GLB (provider credits apply)
        shell: bash
        run: |
          python3 automation/meshy-sculpture-pilot.py \
            --date "$GALLERY_DAY" --image-file "$IMAGE_FILE" \
            --confirm-spend "$CONFIRM" --out meshy-pilot-output
      - name: Upload the model for offline inspection (not to the gallery)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: meshy-one-image-sculpture-pilot
          path: meshy-pilot-output/
          if-no-files-found: error
          retention-days: 21
