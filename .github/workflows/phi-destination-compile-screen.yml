name: TEST destination shader compile A/B screen
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phi-destination-compile-screen.yml'
      - 'tests/phi-destination-compile-screen.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify staged compiler never exposes works across async boundaries
        run: node --test tests/phi-staged-reveal-compile.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Bundle current TEST tower in runner only
        run: |
          ./node_modules/.bin/esbuild test/virtual-gallery/gallery-phi.js --bundle --minify --format=esm --platform=browser --target=es2022 --outfile=test/virtual-gallery/gallery-phi-bundle.js
          node --check test/virtual-gallery/gallery-phi-bundle.js
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/phi-destination-compile-screen.log 2>&1 &
      - name: Compare original and precompiled scene on an identical destination
        run: node tests/phi-destination-compile-screen.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phi-destination-compile-screen
          path: phi-destination-compile-screen/results.json
          if-no-files-found: ignore
