name: Control range consistency
on:
  # Run on pull requests, not again on main after the same checks pass.
  pull_request:
    branches: [main]
    paths:
      - 'js/generator.js'
      - 'js/control-help.js'
      - 'tests/control-ranges.test.mjs'
      - 'tests/materials-ui.test.mjs'
      - 'tests/organic-version.test.mjs'
      - 'tests/growth-v8.test.mjs'
      - 'tests/renderer-lock.test.mjs'
      - 'tests/fixtures/**'
      - 'js/random.js'
      - 'js/phi.js'
      - 'js/palettes.js'
      - 'js/marker.js'
      - 'js/oil-render.js'
      - 'js/oil-surface.js'
      - 'js/oil-material.js'
      - 'tests/oil-render.test.mjs'
      - 'js/export.js'
      - 'css/style.css'
      - 'gallery/gallery.css'
      - 'automation/build-gallery.mjs'
      - 'gallery/index.html'
      - 'gallery/feed.xml'
      - 'gallery/*/index.html'
      - 'tests/site-quality.test.mjs'
      - 'package.json'
      - '.github/workflows/control-ranges.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control-ranges:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check effective ranges and artwork setting preservation
        run: npm run test:control-ranges
      - name: Check material labels, help and legacy URL setting IDs
        run: node tests/materials-ui.test.mjs
      - name: Check gallery descriptions, accessible colours, headings and script versions
        run: node tests/site-quality.test.mjs

      - name: Check renderer compatibility and Organic canvas growth
        run: npm run test:organic-version

      - name: Check V8 growth and V1–V7 recording fixtures
        run: npm run test:growth-v8

      - name: Prove published V8 renderer remains unchanged
        run: npm run test:renderer-lock

      - name: Prove historical Tissue material and V8 marks are unchanged
        run: npm run test:oil-render
      - name: Check seeded Tissue colours, paper and Randomise material lock
        run: npm run test:tissue-colour
