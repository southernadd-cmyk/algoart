name: Prepare test-only KTX2 architectural pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - automation/gallery-ktx2-pilot.trigger

permissions:
  contents: write
  actions: write

concurrency:
  group: gallery-ktx2-pilot
  cancel-in-progress: false

jobs:
  build-test-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install pinned Khronos texture encoder
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/ktx.deb" \
            https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb
          echo "ca635ed489d8bf54fac8d7687056c651193de0740830a7738cc034adc63e3027  $RUNNER_TEMP/ktx.deb" | sha256sum --check
          sudo dpkg --install "$RUNNER_TEMP/ktx.deb" || { sudo apt-get update; sudo apt-get install -fy; }
          command -v toktx
      - name: Build single original-resolution linear normal map
        run: |
          set -euo pipefail
          toktx --t2 --genmipmap --encode uastc --uastc_quality 4 \
            --assign_oetf linear --assign_primaries none \
            test/virtual-gallery/textures/Bricks055_NormalGL.ktx2 \
            test/virtual-gallery/textures/Bricks055_NormalGL.jpg
          mkdir -p test/virtual-gallery/basis
          cp node_modules/three/examples/jsm/libs/basis/basis_transcoder.js test/virtual-gallery/basis/
          cp node_modules/three/examples/jsm/libs/basis/basis_transcoder.wasm test/virtual-gallery/basis/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/virtual-gallery/textures/Bricks055_NormalGL.ktx2')
          assert p.stat().st_size>256
          assert p.read_bytes()[:12]==bytes.fromhex('ab4b5458203230bb0d0a1a0a'), 'Invalid KTX2 container identifier'
          assert Path('test/virtual-gallery/basis/basis_transcoder.wasm').stat().st_size>1024
          print('Test-only KTX2 normal map:',p.stat().st_size,'bytes')
          PY
      - name: Commit only test assets, then deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/virtual-gallery/textures/Bricks055_NormalGL.ktx2 \
            test/virtual-gallery/basis/basis_transcoder.js \
            test/virtual-gallery/basis/basis_transcoder.wasm
          if git diff --cached --quiet; then
            echo 'Pilot assets already current'
          else
            git commit -m 'Add test-only original-size KTX2 brick normal and matching transcoder'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          gh workflow run deploy-pages.yml --ref main
