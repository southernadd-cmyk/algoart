# Existing media gateway - public read-only Worker. Private backup is NOT bound.
# This is separate from the root social-preview Worker and GitHub Pages.
name = "proportion-piece-media"
main = "src/worker.mjs"
compatibility_date = "2026-11-09"
workers_dev = true
preview_urls = false

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "proportion-piece-media-test"
