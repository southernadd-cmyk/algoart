name: Creating overlay UI regression
on:
  pull_request:
    paths:
      - 'js/app.js'
      - 'js/export.js'
      - 'tests/creating-overlay.test.mjs'
      - '.github/workflows/creating-overlay.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/creating-overlay.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: node tests/creating-overlay.test.mjs
