<!doctype html><meta charset="utf-8"><title>Quaternius Meshopt pose validation</title><style>body{margin:0;background:#eeeae0}canvas{width:100vw;height:100vh;display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<canvas id="scene"></canvas><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'https://cdn.jsdelivr.net/npm/meshoptimizer@0.25.0/meshopt_decoder.module.js';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,preserveDrawingBuffer:true});
renderer.setSize(1200,720);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xece9e1);
scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.8));
const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(-3,8,6);scene.add(sun);
const camera=new THREE.PerspectiveCamera(40,1200/720,.01,200);camera.position.set(0,1.8,7);camera.lookAt(0,1,0);
const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
window.poseResults={status:'loading',errors:[]};
try{
 const assets=await Promise.all(['male','female'].map(g=>loader.loadAsync('./models/quaternius-'+g+'-meshopt.glb')));
 const roots=assets.map(a=>a.scene);const bases=roots.map(root=>{const dict={};root.traverse(o=>{if(o.isBone)dict[o.name]=o.quaternion.clone()});return dict});
 function move(geo,bone,axis,degrees){if(!bone)throw Error('Missing '+geo);bone.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(axis==='x'?1:0,axis==='y'?1:0,axis==='z'?1:0),THREE.MathUtils.degToRad(degrees)))}
 window.showPose=(pose)=>{
  roots.forEach((root,i)=>{
   const named={};let meshes=0;root.traverse(o=>{if(o.isBone){named[o.name]=o;o.quaternion.copy(bases[i][o.name])}if(o.isSkinnedMesh)meshes++});
   if(meshes<1)throw Error('Missing skinned mesh '+i);
   move('left upperarm',named.upperarm_l,'z',-65);
   move('right upperarm',named.upperarm_r,'z',65);
   if(pose==='arm'){move('raised upperarm',named.upperarm_r,'z',-100);move('raised upperarm',named.upperarm_r,'x',-25)}
   if(pose==='seated'){move('pelvis',named.pelvis,'x',-9);move('spine',named.spine_01,'x',10);
    for(const side of ['l','r']){move('thigh',named['thigh_'+side],'x',-82);move('calf',named['calf_'+side],'x',80)}}
   root.updateMatrixWorld(true);
   root.position.set(i===0?-1:1,0,0);
   const box=new THREE.Box3().setFromObject(root);root.position.y-=box.min.y;
   if(!scene.children.includes(root))scene.add(root);
   const visible=new THREE.Box3().setFromObject(root);
   if(!Number.isFinite(visible.min.y)||visible.max.y-visible.min.y<.1)throw Error('Invalid visible model '+i);
  });
  renderer.render(scene,camera);
  window.poseResults={status:'pass',pose};
 };
 window.showPose('standing');
}catch(e){window.poseResults={status:'fail',error:String(e),stack:e.stack};console.error(e)}
</script>
