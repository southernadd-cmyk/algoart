name: Oil V2 Stage C - Genuine Bristle Renders
on:
  push:
    branches: [experiment/oil-v2-performance-baseline]
    paths:
      - 'js/oil-v1-core-a.js'
      - 'js/oil-stage-c-brush.js'
      - 'tests/oil-stage-c-preview.mjs'
      - '.github/workflows/oil-stage-c.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage-c:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate experimental source syntax
        run: |
          node --check js/oil-v1-core-a.js
          node --check js/oil-stage-c-brush.js
          node --check tests/oil-stage-c-preview.mjs
      - run: npx playwright install --with-deps chromium
      - name: Start actual ALGO/ART application
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/algoart-oil-stage-c.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - name: Render and inspect real oil-brush images
        run: node tests/oil-stage-c-preview.mjs
      - name: Publish test results and comparison images
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oil-v2-stage-c-genuine-renderer
          path: oil-stage-c-results/
          retention-days: 30
