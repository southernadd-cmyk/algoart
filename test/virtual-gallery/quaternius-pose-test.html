<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Quaternius visitor pose test · PROPORTION PIECE</title>
<style>
body{margin:0;background:#e8e5de;color:#262a29;font:15px system-ui}header{padding:14px;background:#faf8f2;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font:24px Georgia;margin:0 18px 0 0}button,select,input{font:inherit}button,select{padding:7px 10px;border:1px solid #aaa;background:white;border-radius:5px}button[aria-pressed=true]{background:#294239;color:white}
main{display:grid;grid-template-columns:minmax(0,1fr) 270px;height:calc(100vh - 100px)}canvas{width:100%;height:100%;display:block}
aside{padding:16px;background:#faf8f2;overflow:auto}label{display:block;margin:12px 0;font-size:13px}label input[type=range]{width:100%}
#diag{white-space:pre-wrap;font:12px/1.5 monospace}#status{font-size:13px}small{color:#5d615e}a{color:inherit}
@media(max-width:720px){main{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}}
</style>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head><body>
<header><h1>Quaternius visitor pose test</h1>
<label>Choose character ZIP <input type="file" id="archive" accept=".zip"></label>
<select id="sex"><option value="male">Male</option><option value="female">Female</option></select>
<button data-pose="standing" aria-pressed="true">Standing</button><button data-pose="arm">Raise arm</button><button data-pose="seated">Seated</button>
<button id="reset">Reset</button><span id="status">Choose the Quaternius isolated pose ZIP to begin</span>
<a href="./">Gallery</a></header>
<main><canvas id="scene"></canvas><aside>
<b>Pose adjustments</b><p><small>Drag to orbit; scroll to zoom. Modify joints to inspect torso, shoulders, elbows and knees. Neither this test nor your uploaded ZIP changes the live gallery.</small></p>
<div id="controls"></div><pre id="diag"></pre></aside></main>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#e8e5de');
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.5));
const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(-3,7,6);scene.add(light);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshLambertMaterial({color:0xc9c7be}));floor.rotation.x=-Math.PI/2;scene.add(floor);
scene.add(new THREE.GridHelper(10,20,0xa6aaa4,0xd1d2ca));
const camera=new THREE.PerspectiveCamera(42,1,.01,100);camera.position.set(2.4,1.8,4);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1,0);orbit.update();
const status=document.querySelector('#status'),diag=document.querySelector('#diag'),controlPanel=document.querySelector('#controls'),sex=document.querySelector('#sex');
const axes=[['pelvis','x'],['spine_01','x'],['spine_02','x'],['upperarm_l','x'],['upperarm_l','z'],['upperarm_r','x'],['upperarm_r','z'],['lowerarm_r','x'],['thigh_l','x'],['thigh_r','x'],['calf_l','x'],['calf_r','x']];
let character=null,bones={},base={},pose='standing',archive=null,urls=[],cache={};
for(const [name,axis] of axes){
 const label=document.createElement('label'),out=document.createElement('output'),slider=document.createElement('input');
 label.textContent=name+' / '+axis+' ';out.textContent='0°';slider.type='range';slider.min=-145;slider.max=145;slider.step=1;slider.value=0;
 slider.dataset.bone=name;slider.dataset.axis=axis;slider.addEventListener('input',()=>{out.textContent=slider.value+'°';applyPose()});
 label.append(out,slider);controlPanel.appendChild(label);
}
function applyPose(){
 if(!character)return;
 for(const [name,bone] of Object.entries(bones))bone.quaternion.copy(base[name]);
 for(const slider of controlPanel.querySelectorAll('input')){
  const bone=bones[slider.dataset.bone];if(!bone)continue;
  const a=slider.dataset.axis,angle=THREE.MathUtils.degToRad(+slider.value);
  bone.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(a==='x'?1:0,a==='y'?1:0,a==='z'?1:0),angle));
 }
 scene.updateMatrixWorld(true);
 const missing=[...new Set(axes.filter(([n])=>!bones[n]).map(([n])=>n))];
 let skinned=0;character.traverse(o=>{if(o.isSkinnedMesh)skinned++});
 diag.textContent='Pose: '+pose+'\nBones: '+Object.keys(bones).length+'\nSkinned meshes: '+skinned+'\nMissing controls: '+(missing.join(', ')||'none')+'\n\nInspect waist and raised-arm shape visually.';
}
function preset(kind){
 pose=kind;
 for(const s of controlPanel.querySelectorAll('input')){s.value=0;s.previousSibling.textContent='0°'}
 const set=(b,a,v)=>{const s=controlPanel.querySelector('[data-bone="'+b+'"][data-axis="'+a+'"]');if(s){s.value=v;s.previousSibling.textContent=v+'°'}};
 // The supplied model's bind pose is a T-pose. Lower both upper arms first.
 set('upperarm_l','z',-65);
 set('upperarm_r','z',65);
 if(kind==='arm'){set('upperarm_r','z',-35);set('upperarm_r','x',-25);set('lowerarm_r','x',-25)}
 if(kind==='seated'){set('pelvis','x',-9);set('spine_01','x',10);for(const b of ['thigh_l','thigh_r'])set(b,'x',-82);for(const b of ['calf_l','calf_r'])set(b,'x',80)}
 applyPose();document.querySelectorAll('[data-pose]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pose===kind)));
}
async function loadCharacter(){
 if(!archive)return;
 const kind=sex.value;status.textContent='Loading '+kind+'…';
 if(character){scene.remove(character);character=null}
 if(!cache[kind]){
  const prefix=kind+'/',name=kind==='male'?'Superhero_Male_FullBody.gltf':'Superhero_Female_FullBody.gltf';
  const gltf=archive.file(prefix+name);if(!gltf)throw Error('Missing '+prefix+name+' in ZIP');
  // Resolve the actual glTF resources from the ZIP, rather than relying on
  // a server path or a LoadingManager URL rewrite.
  const documentJSON=JSON.parse(await gltf.async('string'));
  const toDataURL=async(uri,mime)=>{
   const resource=archive.file(prefix+decodeURIComponent(uri));
   if(!resource)throw Error('Missing model resource: '+prefix+uri);
   const data=await resource.async('base64');
   return 'data:'+mime+';base64,'+data;
  };
  for(const buffer of documentJSON.buffers||[]){
   if(buffer.uri&&!buffer.uri.startsWith('data:'))
     buffer.uri=await toDataURL(buffer.uri,'application/octet-stream');
  }
  for(const picture of documentJSON.images||[]){
   if(!picture.uri||picture.uri.startsWith('data:'))continue;
   const mime=/\\.png$/i.test(picture.uri)?'image/png':'image/jpeg';
   picture.uri=await toDataURL(picture.uri,mime);
  }
  cache[kind]=await new Promise((resolve,reject)=>
   new GLTFLoader().parse(JSON.stringify(documentJSON),'',resolve,reject));

 }
 character=cache[kind].scene;scene.add(character);bones={};base={};
 character.traverse(o=>{if(o.isBone){bones[o.name]=o;base[o.name]=o.quaternion.clone()}});
 const bounds=new THREE.Box3().setFromObject(character);character.position.y-=bounds.min.y;const size=bounds.getSize(new THREE.Vector3());const height=Math.max(.2,size.y);orbit.target.set(0,height*.52,0);camera.position.set(height*.75,height*.65,height*1.7);camera.near=Math.max(.001,height*.001);camera.far=Math.max(100,height*20);camera.updateProjectionMatrix();orbit.update();
 status.textContent=kind+' · '+Object.keys(bones).length+' bones';preset(pose);
}
document.querySelector('#archive').addEventListener('change',async e=>{
 try{
  for(const u of urls)URL.revokeObjectURL(u);urls=[];cache={};
  archive=await window.JSZip.loadAsync(e.target.files[0]);await loadCharacter();
 }catch(error){status.textContent='Could not load ZIP';diag.textContent=error.stack||error.message;console.error(error)}
});
sex.addEventListener('change',()=>loadCharacter().catch(e=>{status.textContent='Load error';diag.textContent=e.message}));
document.querySelectorAll('[data-pose]').forEach(b=>b.addEventListener('click',()=>preset(b.dataset.pose)));
document.querySelector('#reset').addEventListener('click',()=>preset('standing'));
function resize(){const r=renderer.domElement.getBoundingClientRect(),w=Math.max(1,r.width),h=Math.max(1,r.height);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(renderer.domElement);
renderer.setAnimationLoop(()=>{resize();renderer.render(scene,camera)});
</script></body></html>
