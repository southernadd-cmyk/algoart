name: Build ALGO ART daily gallery

on:
  push:
    paths:
      - 'automation/build-gallery.mjs'
      - '.github/workflows/gallery-daily.yml'
  schedule:
    # Early morning UTC; the generator resolves the calendar day in Europe/London.
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gallery-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_SITE_URL: https://southernadd-cmyk.github.io/algoart/
      ALGOART_LOCAL_URL: http://127.0.0.1:4173/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install generator runtime
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Start local ALGO ART
        run: |
          python3 -m http.server 4173 >/tmp/algoart-gallery-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/algoart-gallery-http.log
          exit 1

      - name: Generate deterministic daily batch
        run: npm run social:generate

      - name: Build crawlable gallery
        run: npm run gallery:build

      - name: Verify gallery output
        shell: bash
        run: |
          test -s gallery/index.html
          test -s gallery/archive.json
          test -s gallery/feed.xml
          test -s sitemap.xml
          test -s robots.txt
          DAY="$(node -e "const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()); const x=Object.fromEntries(p.map(v=>[v.type,v.value])); process.stdout.write(x.year+'-'+x.month+'-'+x.day)")"
          test -s "gallery/$DAY/index.html"
          COUNT="$(find "gallery/$DAY" -maxdepth 1 -name '*.jpg' | wc -l)"
          test "$COUNT" -ge 5
          echo "Verified gallery/$DAY with $COUNT artwork images."

      - name: Persist gallery archive
        id: gallery_commit
        shell: bash
        run: |
          rm -rf node_modules social-output package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Daily gallery already matches the deterministic batch."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            DAY="$(node -e "const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()); const x=Object.fromEntries(p.map(v=>[v.type,v.value])); process.stdout.write(x.year+'-'+x.month+'-'+x.day)")"
            git commit -m "Publish ALGO ART daily gallery $DAY"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Explicitly trigger Pages deployment
        if: steps.gallery_commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --ref main

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### ALGO/ART daily gallery" >> "$GITHUB_STEP_SUMMARY"
          echo "- Archive: https://southernadd-cmyk.github.io/algoart/gallery/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Five scheduled base artworks plus any validated curated studies" >> "$GITHUB_STEP_SUMMARY"
          echo "- Static HTML + JSON-LD + Open Graph + RSS + sitemap" >> "$GITHUB_STEP_SUMMARY"

  archive-check:
    needs: build
    if: ${{ always() }}
    uses: ./.github/workflows/archive-reproduction.yml
    with:
      checkout_ref: main
