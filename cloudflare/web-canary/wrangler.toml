# ISOLATED PREVIEW ONLY. Do not attach to the public domain or Pages routes.
# This Worker is distinct from the existing social-preview and R2 media Workers.
name = "proportion-piece-web-canary"
compatibility_date = "2026-10-13"
workers_dev = true

[assets]
# Package /algoart as a physical subfolder of the asset directory.
# Account rejects non-root assets.base_path (API error 100343).
directory = "../../_cf_assets"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
