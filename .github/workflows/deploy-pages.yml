name: Deploy ALGO ART to Pages
# Deployment refresh: restore the test tower to the live baseline.

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'test/**'
      - 'automation/build-phi-test-room-signs.mjs'
      - 'automation/phi-stage-curation-plugin.mjs'
      - 'tests/phi-stage-curation.test.mjs'
      - 'tests/phi-pre-expansion.test.mjs'
      - 'tests/phi-test-room-signs.test.mjs'
      - 'tests/phi-room-sign-counts.test.mjs'
      - 'tests/phi-reception-penrose.test.mjs'
      - 'tests/phi-gallery-penrose.test.mjs'
      - 'tests/phi-gramophone-timeline.test.mjs'
      - 'tests/phi-gramophone-score-map.test.mjs'
      - 'tests/phi-gramophone-asap-debussy.test.mjs'
      - 'tests/phi-gramophone-independent-source.test.mjs'
      - 'css/**'
      - 'fonts/**'
      - 'js/**'
      - 'gallery/**'
      - 'press/**'
      - 'about/**'
      - 'reels/**'
      - 'favicon.svg'
      - 'social-card.svg'
      - 'social-card.png'
      - 'robots.txt'
      - 'google*.html'
      - 'B732C1640DA947DB8E65C914FA8703EE.txt'
      - '.github/workflows/indexnow-notify.yml'
      - '.github/workflows/deploy-pages.yml'
      - 'sitemap.xml'
      - '.nojekyll'
  workflow_dispatch:
  # Commits pushed by the bundle-sync workflow's GITHUB_TOKEN do not
  # trigger push workflows. Deploy when that workflow finishes instead.
  workflow_run:
    workflows: ['Synchronise deployed gallery bundle', 'Build TouchDesigner second monitor bank', 'Import annotated Debussy recording for test tower']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # A stale queued deployment must not block the newest live and test update.
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Refresh generated bundles in deployment workspace
        run: |
          npm run gallery:bundle
          npm run gallery:bundle:phi
          npm run gallery:bundle:post-test
          node automation/build-phi-test-room-signs.mjs
          node --check gallery/visit/gallery-phi-test-room-signs-bundle.js
          node --test tests/phi-room-names.test.mjs tests/phi-test-room-signs.test.mjs tests/phi-reception-penrose.test.mjs tests/phi-gallery-penrose.test.mjs tests/phi-stage-routing.test.mjs tests/phi-postprocessing.test.mjs tests/phi-room-sign-counts.test.mjs
      - name: Validate public gallery before uploading the site
        run: |
          node automation/validate-phi-archive.mjs
          node --test tests/phi-translation-area-sign-runtime.test.mjs tests/phi-large-monitor-door-sign.test.mjs tests/phi-reception-rear-wall-monitors.test.mjs tests/phi-monitor-banks.test.mjs tests/phi-monitor-bank-two.test.mjs tests/phi-shell-cache.test.mjs tests/phi-sculpture-stage.test.mjs tests/gramophone-record.test.mjs tests/phi-gramophone-timeline.test.mjs tests/phi-gramophone-score-map.test.mjs tests/phi-gramophone-asap-debussy.test.mjs tests/phi-gramophone-independent-source.test.mjs tests/phi-reception-refresh.test.mjs tests/phi-reception-window.test.mjs tests/phi-touchdesigner-phase-one.test.mjs tests/phi-touchdesigner-six-screen.test.mjs tests/gallery-speakers.test.mjs
          node --test tests/gallery-public-launch.test.mjs tests/phi-full-engine-adapter.test.mjs tests/phi-presentation.test.mjs
          node --test tests/phi-lift-motion.test.mjs tests/gallery-entry-preparation.test.mjs tests/phi-curation-groups.test.mjs tests/phi-stage-curation.test.mjs tests/phi-pre-expansion.test.mjs
          node --test tests/phi-gallery-topbar.test.mjs
          node --check gallery/visit/gallery-bundle.js
          node --check gallery/visit/gallery-phi-bundle.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

