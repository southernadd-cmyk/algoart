name: ALGO ART social dry run

on:
  push:
    paths:
      - .github/workflows/social-dry-run.yml
  workflow_dispatch:
    inputs:
      date:
        description: Optional YYYY-MM-DD date for deterministic generation
        required: false
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOCIAL_DATE: ${{ inputs.date }}
      PUBLIC_SITE_URL: https://southernadd-cmyk.github.io/algoart/
      ALGOART_LOCAL_URL: http://127.0.0.1:4173/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Start local ALGO ART
        run: |
          python3 -m http.server 4173 >/tmp/algoart-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/algoart-http.log
          exit 1

      - name: Generate daily social batch
        run: npm run social:generate

      - name: Upload dry-run batch
        uses: actions/upload-artifact@v4
        with:
          name: algoart-social-${{ inputs.date || 'today' }}
          path: social-output/
          retention-days: 7
