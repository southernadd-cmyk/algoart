name: Sculpture V2 media gateway route safety

on:
  pull_request:
    paths:
      - 'cloudflare/media-read-only/**'
      - 'tests/sculpture-v2-media-gateway.test.mjs'
      - '.github/workflows/sculpture-v2-media-gateway.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/media-read-only/**'
      - 'tests/sculpture-v2-media-gateway.test.mjs'
      - '.github/workflows/sculpture-v2-media-gateway.yml'

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify read-only legacy and V2 routing
        run: |
          node --check cloudflare/media-read-only/src/worker.mjs
          node --test tests/sculpture-v2-media-gateway.test.mjs
          test ! -f cloudflare/media-read-only/src/.env

  credential-probe:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: safety
    runs-on: ubuntu-latest
    environment: archive-media-test
    timeout-minutes: 3
    steps:
      - name: Check availability of worker-deploy token without revealing credentials
        env:
          CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CF_DEPLOY_TOKEN" && -n "$CF_ACCOUNT" ]]; then
            echo "SCULPTURE_V2_CLOUDFLARE_DEPLOY_TOKEN_READY=true"
          else
            echo "SCULPTURE_V2_CLOUDFLARE_DEPLOY_TOKEN_READY=false"
            echo "::warning::No Cloudflare Workers deploy token is available to this environment. No Worker deployment attempted."
          fi
