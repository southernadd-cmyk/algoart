<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Vector source bridge</title></head><body>
<script src="../../js/random.js"></script>
<script src="../../js/phi.js"></script>
<script src="../../js/palettes.js"></script>
<script src="../../js/marker.js"></script>
<script src="../../js/phi-sheet-fit.js"></script>
<script src="../../js/generator.js"></script>
<script>
'use strict';
// This private iframe reuses the ACTUAL versioned drawing engine without
// running the editor UI or asking the export button to download anything.
// Do not modify the original rendering functions; SVGRecorder stays local.
const KEYS={
  seed:'seed',mode:'mode',orientation:'fmt',elements:'el',density:'den',
  complexity:'cx',negativeSpace:'neg',phiStrength:'phi',recursion:'rec',
  spiralInfluence:'spi',goldenAngle:'ga',nesting:'nest',pen:'pen',
  thickness:'th',wobble:'wob',overdraw:'od',opacity:'op',pressure:'pr',
  dryness:'dry',curveBias:'curve',shapeAmount:'shape',overlap:'overlap',
  rotation:'rot',lines:'ln',circles:'ci',rectangles:'re',polygons:'po',
  arcs:'ar',palette:'pal',colourCount:'cols',saturation:'sat',
  brightness:'bri',paper:'paper',grain:'grain'
};
const NUMERIC=new Set(['elements','density','complexity','negativeSpace',
 'phiStrength','recursion','spiralInfluence','goldenAngle','nesting','thickness',
 'wobble','overdraw','opacity','pressure','dryness','curveBias','shapeAmount',
 'overlap','rotation','colourCount','saturation','brightness','grain']);
const BOOLEANS=new Set(['lines','circles','rectangles','polygons','arcs']);
const DEFAULTS={
 seed:'PHI-1618',mode:'field',orientation:'landscape',
 elements:36,density:53,complexity:71,negativeSpace:41,phiStrength:91,
 recursion:4,spiralInfluence:63,goldenAngle:93,nesting:44,pen:'felt',
 thickness:13,wobble:32,overdraw:3,opacity:70,pressure:50,dryness:30,
 curveBias:40,shapeAmount:50,overlap:50,rotation:50,
 lines:true,circles:true,rectangles:true,polygons:true,arcs:true,
 palette:'marker',colourCount:5,saturation:75,brightness:50,
 paper:'#f5f0e6',grain:23
};
const supported=[1,2,3,4,5,6,7,8,9];
function settingsFromUrl(url){
  const p=new URL(url,location.href).searchParams;
  const settings={...DEFAULTS};
  for(const [name,key] of Object.entries(KEYS)){
    if(!p.has(key))continue;
    const value=p.get(key);
    settings[name]=NUMERIC.has(name)?Number(value):BOOLEANS.has(name)?
      (value==='true'||value==='1'):value;
  }
  settings.orientation=p.get('fmt')==='portrait'?'portrait':'landscape';
  const version=Number(p.get('v'));
  if(!supported.includes(version))throw Error('Unsupported historical renderer version');
  if(!settings.seed||!settings.mode)throw Error('Missing exact study state');
  return {settings,version,fit:p.get('sheet')==='phi'};
}
function collect(url){
  const A=window.AlgoArt;
  if(!A || !A.render || !A.phiSheetFit)throw Error('Generator bridge not ready');
  const {settings,version,fit}=settingsFromUrl(url);
  A.rendererVersion=version;
  A.supportedRendererVersions=supported;
  A.phiFramingEnabled=fit;
  A.svgRecorder={paths:[],precise:true,background:settings.paper};
  try{
    // Real generator and exact link: pens, source mode, transforms and RNG.
    A.render(document.createElement('canvas'),settings,.12,false);
    return {
      paths:A.svgRecorder.paths,
      width:A.W,height:A.H,
      version,mode:settings.mode,seed:settings.seed,phiSheetFit:fit,
      source:'Proportion Piece generator / precise SVG recorder'
    };
  }finally{
    A.svgRecorder=null;
    A.phiFramingEnabled=false;
  }
}
window.addEventListener('message',event=>{
  if(event.origin!==location.origin||event.source!==parent)return;
  const input=event.data;
  if(!input||input.type!=='pp-request-vectors')return;
  try{
    const result=collect(input.url);
    parent.postMessage({type:'pp-vectors-result',id:input.id,result},event.origin);
  }catch(error){
    parent.postMessage({type:'pp-vectors-result',id:input.id,error:String(error.message||error)},event.origin);
  }
});
parent.postMessage({type:'pp-vector-bridge-ready'},location.origin);
</script>
</body></html>
