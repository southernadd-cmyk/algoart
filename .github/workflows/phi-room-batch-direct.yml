name: Direct scene draw-call test for grouped rooms
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phi-room-batch-direct.yml'
permissions:
  contents: read
jobs:
  direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22',cache: npm}
      - run: npm ci
      - run: node --test tests/phi-room-batch-study.test.mjs tests/phi-room-visibility-culler.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Build test bundle without touching live
        run: |
          ./node_modules/.bin/esbuild test/virtual-gallery/gallery-phi.js --bundle --minify --format=esm --platform=browser --target=es2022 --outfile=test/virtual-gallery/gallery-phi-bundle.js
          node --check test/virtual-gallery/gallery-phi-bundle.js
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/phi-room-direct-http.log 2>&1 &
      - name: Measure draw calls before and after culling
        run: node tests/phi-room-batch-direct-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phi-room-batch-direct
          path: phi-room-batch-direct/results.json
          if-no-files-found: ignore
