name: Archive reproduction
# Automatically test code changes, not every gallery/social-output commit or push
# to an intermediate working branch. Daily gallery uses workflow_call below.
on:
  # PRs validate changes before merge; daily workflow_call verifies archives.
  # Do not repeat the expensive 3-browser suite on every main push.
  pull_request:
    branches: [main]
    paths:
      # Archive reproduction is a renderer/data contract, not a copy or styling test.
      - 'js/generator.js'
      - 'js/phi.js'
      - 'js/random.js'
      - 'js/marker.js'
      - 'js/*paint*.js'
      - 'js/*material*.js'
      - 'js/watercolour-*.js'
      - 'js/tissue-*.js'
      - 'js/cpu-*.js'
      - 'js/plotter.js'
      - 'js/export.js'
      - 'automation/config.mjs'
      - 'tests/archive-reproduction.mjs'
      - 'tests/archive-jpeg.test.mjs'
      - 'gallery/*/meta.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/archive-reproduction.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: false
        default: ''
permissions:
  contents: read
# Cancel superseded PR test runs, but never interrupt the main-branch
# archive reproducibility checks or the daily gallery's explicit call.
concurrency:
  group: archive-reproduction-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  reproduce:
    name: Archive / ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JavaScript dependencies
        timeout-minutes: 2
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record browser runtime
        run: npx playwright --version
      - name: Install browser system dependencies
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Download browser runtime
        timeout-minutes: 5
        run: npx playwright install ${{ matrix.browser }}
      - name: Start local editor
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/archive-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      # These deterministic Node checks are browser-independent.
      # Run them once rather than repeating the expensive suite for all 3 browsers.
      - name: Check visual metrics, geometry and fixed-order travel
        if: ${{ matrix.browser == 'chromium' }}
        run: |
          npm run test:plotter-metrics
          npm run test:plotter
          npm run test:tuning-equivalence
      - name: Compare plotter previews with canvas artwork
        env:
          ARCHIVE_BROWSER: ${{ matrix.browser }}
          ALGOART_LOCAL_URL: http://127.0.0.1:4173/
        run: npm run test:plotter-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plotter-${{ matrix.browser }}-${{ github.run_id }}
          path: plotter-check-results/
          retention-days: 14
      - name: Capture actual procedural oil previews for review
        if: ${{ matrix.browser == 'chromium' }}
        env:
          ALGOART_LOCAL_URL: http://127.0.0.1:4173/
        run: node tests/oil-preview.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.browser == 'chromium' }}
        with:
          name: procedural-oil-previews
          path: oil-check-results/
          retention-days: 14
      - name: Reproduce representative archive coverage on PRs; full archive on explicit runs
        if: ${{ !cancelled() }}
        env:
          ARCHIVE_BROWSER: ${{ matrix.browser }}
          ALGOART_LOCAL_URL: http://127.0.0.1:4173/
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node tests/archive-reproduction.mjs --representative
          else
            npm run test:archive
          fi
      - name: Reject changed artwork without rejecting JPEG compression
        if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        env:
          ALGOART_LOCAL_URL: http://127.0.0.1:4173/
        run: node tests/archive-jpeg.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-${{ matrix.browser }}-${{ github.run_id }}
          path: archive-check-results/
          retention-days: 14
