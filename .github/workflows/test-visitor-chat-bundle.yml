name: Build test visitor chat
on:
  push:
    branches: [main]
    paths:
      - 'test/virtual-gallery/full-engine.html'
permissions:
  contents: write
concurrency:
  group: test-visitor-chat-bundle
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all visitor conversation tests
        run: node --test test/virtual-gallery/phi-visitor-chat.test.mjs
      - name: Install build dependencies
        run: npm ci --ignore-scripts
      - name: Build test tower (not live)
        run: npx esbuild test/virtual-gallery/gallery-phi.js --bundle --minify --format=esm --platform=browser --target=es2022 --outfile=test/virtual-gallery/gallery-phi-bundle.js
      - name: Publish tested bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/virtual-gallery/gallery-phi-bundle.js
          if ! git diff --staged --quiet; then
            git commit -m 'Rebuild test-tower visitor chat bundle'
            git push
          fi
