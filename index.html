<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALGO/ART — φ Generator</title>
<meta name="description" content="Golden-ratio algorithmic marker art generator">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<header>
  <div class="brand">ALGO/<span>ART</span> — φ</div>
  <div class="seed"><input id="seed" value="PHI-1618"><button id="newSeed">New seed</button></div>
  <div class="actions">
    <button id="regenerate">Regenerate</button>
    <button id="mutate">Mutate</button>
    <button id="randomise">Randomise</button>
    <button id="geometry">Show geometry</button>
    <button class="primary" id="save">Save PNG</button>
  </div>
</header>
<main>
  <div class="stage">
    <div class="canvas-wrap">
      <canvas id="art" width="1400" height="1000"></canvas>
      <div class="stats" id="stats"></div>
    </div>
  </div>
  <aside>
    <section><h3>Composition</h3><div class="controls">
      <div class="control"><label>Mode</label><select id="mode"><option value="field">Golden Field</option><option value="spiral">Golden Spiral</option><option value="rects">Recursive Rectangles</option><option value="burst">Fibonacci Burst</option><option value="network">Phi Network</option><option value="organic">Organic</option><option value="geometric">Geometric</option><option value="scribble">Controlled Scribble</option></select></div>
      <div class="control"><label>Elements</label><output></output><input id="elements" type="range" min="8" max="140" value="52"></div>
      <div class="control"><label>Density</label><output></output><input id="density" type="range" min="0" max="100" value="62"></div>
      <div class="control"><label>Complexity</label><output></output><input id="complexity" type="range" min="0" max="100" value="58"></div>
      <div class="control"><label>Negative space</label><output></output><input id="negativeSpace" type="range" min="0" max="100" value="24"></div>
    </div></section>
    <section><h3>Golden ratio</h3><div class="controls">
      <div class="control"><label>φ adherence</label><output></output><input id="phiStrength" type="range" min="0" max="100" value="90"></div>
      <div class="control"><label>Recursion</label><output></output><input id="recursion" type="range" min="1" max="9" value="5"></div>
      <div class="control"><label>Spiral influence</label><output></output><input id="spiralInfluence" type="range" min="0" max="100" value="65"></div>
      <div class="control"><label>Golden angle</label><output></output><input id="goldenAngle" type="range" min="0" max="100" value="100"></div>
      <div class="control"><label>Nesting</label><output></output><input id="nesting" type="range" min="0" max="100" value="38"></div>
    </div></section>
    <section><h3>Marker pen</h3><div class="controls">
      <div class="control"><label>Pen</label><select id="pen"><option value="felt">Felt Tip</option><option value="fine">Fine Marker</option><option value="broad">Broad Marker</option><option value="highlighter">Highlighter</option><option value="dry">Dry Marker</option><option value="paint">Paint Pen</option><option value="scribble">Scribble Pen</option></select></div>
      <div class="control"><label>Thickness</label><output></output><input id="thickness" type="range" min="1" max="28" value="9"></div>
      <div class="control"><label>Wobble</label><output></output><input id="wobble" type="range" min="0" max="100" value="32"></div>
      <div class="control"><label>Overdraw</label><output></output><input id="overdraw" type="range" min="1" max="10" value="5"></div>
      <div class="control"><label>Opacity</label><output></output><input id="opacity" type="range" min="10" max="100" value="76"></div>
      <div class="control"><label>Pressure</label><output></output><input id="pressure" type="range" min="0" max="100" value="44"></div>
      <div class="control"><label>Dryness</label><output></output><input id="dryness" type="range" min="0" max="100" value="15"></div>
    </div></section>
    <section><h3>Geometry</h3><div class="controls">
      <div class="control"><label>Curved ↔ straight</label><output></output><input id="curveBias" type="range" min="0" max="100" value="55"></div>
      <div class="control"><label>Shape amount</label><output></output><input id="shapeAmount" type="range" min="0" max="100" value="65"></div>
      <div class="control"><label>Overlap</label><output></output><input id="overlap" type="range" min="0" max="100" value="48"></div>
      <div class="control"><label>Rotation</label><output></output><input id="rotation" type="range" min="0" max="100" value="80"></div>
      <div class="checks"><label><input id="lines" type="checkbox" checked> Lines</label><label><input id="circles" type="checkbox" checked> Ellipses</label><label><input id="rectangles" type="checkbox" checked> Rectangles</label><label><input id="polygons" type="checkbox" checked> Polygons</label><label><input id="arcs" type="checkbox" checked> Arcs</label></div>
    </div></section>
    <section><h3>Colour & paper</h3><div class="controls">
      <div class="control"><label>Palette</label><select id="palette"><option value="spectrum">Full Spectrum</option><option value="golden">Golden-angle hues</option><option value="marker">Classic Markers</option><option value="cmyk">CMYK</option><option value="primary">Primary</option><option value="neon">Neon</option><option value="pastel">Pastel</option><option value="earth">Earth</option><option value="warm">Warm</option><option value="cold">Cold</option><option value="mono">Monochrome</option></select></div>
      <div class="control"><label>Colours</label><output></output><input id="colourCount" type="range" min="1" max="14" value="8"></div>
      <div class="control"><label>Saturation</label><output></output><input id="saturation" type="range" min="10" max="100" value="84"></div>
      <div class="control"><label>Brightness</label><output></output><input id="brightness" type="range" min="20" max="80" value="52"></div>
      <div class="control"><label>Paper</label><input id="paper" type="color" value="#f5f0e6"></div>
      <div class="control"><label>Paper grain</label><output></output><input id="grain" type="range" min="0" max="100" value="18"></div>
    </div></section>
    <section><h3>Export</h3><div class="controls"><div class="control"><label>PNG scale</label><select id="exportScale"><option value="1">1× — 1400×1000</option><option value="2" selected>2× — 2800×2000</option><option value="3">3× — 4200×3000</option></select></div></div></section>
    <div class="note">Everything runs locally in the browser. Same seed + same settings = same composition. φ ≈ 1.618034 · golden angle ≈ 137.508°.</div>
  </aside>
</main>
</div>
<script src="js/random.js"></script>
<script src="js/phi.js"></script>
<script src="js/palettes.js"></script>
<script src="js/marker.js"></script>
<script src="js/generator.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
