name: Deploy independent gallery cron Worker

on:
  # Redeploy whenever the Worker or this workflow changes on main, so a
  # merged fix is live before the next cron. Gallery editions never match.
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-gallery-fallback-worker.yml'
      - 'automation/cloudflare-gallery-fallback/src/**'
      - 'automation/cloudflare-gallery-fallback/wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-cron-worker-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: archive-media-test
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      # Reuse an EXISTING long-lived GitHub token if one was configured.
      # Do not use github.token: it expires before the next cron.
      DISPATCH_TOKEN: ${{ secrets.GALLERY_DISPATCH_TOKEN || secrets.PP_GITHUB_TOKEN || secrets.GITHUB_PAT || secrets.GH_PAT || secrets.GITHUB_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the independent Worker
        run: node --test automation/cloudflare-gallery-fallback/src/index.test.mjs
      - name: Inspect existing credentials (never print values)
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "::error::The existing archive-media-test CLOUDFLARE_API_TOKEN is unavailable"; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo "::error::The existing Cloudflare account ID is unavailable"; exit 1; }
          echo "CLOUDFLARE_EXISTING_DEPLOYMENT_CREDENTIALS_OK"
          if [[ -z "$DISPATCH_TOKEN" ]]; then
            echo "::warning::No existing long-lived GitHub workflow_dispatch token found under supported secret names. Not deploying a broken cron."
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check existing Worker secret bindings without printing their contents
        shell: bash
        run: |
          set -euo pipefail
          for worker in proportion-piece-social proportion-piece-media proportion-piece-sculpture-v2 proportion-piece-web-canary; do
            echo "Inspecting GitHub authentication binding on $worker"
            if npx --yes wrangler@4.160.0 secret list --name "$worker" \
              > "$RUNNER_TEMP/gallery-worker-secrets.json" 2> "$RUNNER_TEMP/gallery-worker-secret-error"; then
              WORKER_NAME="$worker" node --input-type=module -e '
                import fs from "node:fs";
                const data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/gallery-worker-secrets.json","utf8"));
                const yes=data.some(e=>/^(GITHUB_TOKEN|GITHUB_PAT|GH_PAT|PP_GITHUB_TOKEN|GALLERY_DISPATCH_TOKEN|GITHUB_DISPATCH_TOKEN)$/i.test(e.name));
                console.log(process.env.WORKER_NAME+" has compatible GitHub auth secret: "+(yes?"yes":"no"));
              '
            else
              echo "::notice::Worker secret inventory not accessible for $worker"
            fi
          done
      - name: Verify GitHub dispatch token is valid
        if: steps.credentials.outputs.can_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o "$RUNNER_TEMP/workflow-api-response.json" -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/southernadd-cmyk/algoart/actions/workflows/gallery-daily.yml")
          if [[ "$status" != 200 ]]; then
            echo "::error::Existing dispatch token cannot read gallery-daily workflow (HTTP $status)"
            exit 1
          fi
      - name: Deploy isolated Cloudflare cron Worker using existing account token
        if: steps.credentials.outputs.can_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.160.0 deploy \
            --config automation/cloudflare-gallery-fallback/wrangler.toml
          printf '%s' "$DISPATCH_TOKEN" | \
            npx --yes wrangler@4.160.0 secret put GITHUB_TOKEN \
              --config automation/cloudflare-gallery-fallback/wrangler.toml
          npx --yes wrangler@4.160.0 secret list \
            --config automation/cloudflare-gallery-fallback/wrangler.toml \
            > "$RUNNER_TEMP/gallery-fallback-secrets.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/gallery-fallback-secrets.json","utf8"));
            if (!data.some(item => item.name === "GITHUB_TOKEN")) throw new Error("GITHUB_TOKEN not bound");
            console.log("GALLERY_FALLBACK_WORKER_SECRET_BOUND");
          '
          echo "GALLERY_FALLBACK_CRON_DEPLOYED"
