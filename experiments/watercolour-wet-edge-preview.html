<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALGO/ART — Watercolour V2 Wet-Edge Lab</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}
body{background:#171b1b;color:#e8e6df;margin:0;padding:20px}
header{max-width:1500px;margin:auto}h1{font-size:clamp(1.3rem,3vw,2.1rem);margin:0 0 6px}
p{line-height:1.45;color:#c3c9c5}.alert{color:#f8cf8b;font-size:0.91rem}
.controls{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin:22px 0}
label{display:grid;gap:5px;font-size:.82rem;color:#c7d5ca}
select,input,button{background:#242c2b;color:white;border:1px solid #71877e;border-radius:4px;padding:10px;font:inherit}
input{min-width:240px}button{cursor:pointer;background:#476e5a;border-color:#69937c;font-weight:bold}
main{max-width:1500px;margin:auto}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
figure{margin:0}figcaption{padding:9px 0 12px;font-weight:650}
canvas{display:block;width:100%;height:auto;border:1px solid #6b6558;background:#f5f0e6}
.small{font-size:.8rem;color:#b8bbb6}#status{min-height:1.5em}
@media(max-width:820px){.comparison{grid-template-columns:1fr}}
</style></head><body><main><header>
<h1>ALGO/ART / Watercolour V2 — wet-edge laboratory</h1>
<p>Identical composition, seed, geometry, seeded pigment and fixed cream paper. Only the material treatment changes.</p>
<p class="alert">Experimental branch only. Stable Tissue &amp; Graphite V6, gallery, social posts and exports are not modified.</p>
<div class="controls">
<label>Reference artwork<select id="preset"></select></label>
<label>Seed<input id="seed" aria-label="Seed" spellcheck="false"></label>
<label>Render quality<select id="quality"><option value="0.56" selected>Fast comparison</option><option value="1">Detailed</option></select></label>
<button id="render" type="button">Render comparison</button>
</div>
<p id="status" aria-live="polite">Loading renderers…</p></header>
<section class="comparison">
<figure><figcaption>LEFT — Stable Tissue &amp; Graphite V6</figcaption><canvas id="reference" aria-label="Original V6 artwork"></canvas></figure>
<figure><figcaption>RIGHT — Experimental translucent pooled-edge watercolour</figcaption><canvas id="experimental" aria-label="Wet-edge watercolour artwork"></canvas></figure>
</section>
<p class="small" id="stats"></p>
</main>
<script src="../js/random.js"></script>
<script src="../js/phi.js"></script>
<script src="../js/palettes.js"></script>
<script src="../js/marker.js"></script>
<script src="../js/generator.js"></script>
<script src="../js/oil-surface.js"></script>
<script src="../js/oil-material.js"></script>
<script src="../js/oil-render.js"></script>
<script src="./watercolour-wet-edge-v2.js"></script>
<script>
(function(){
  'use strict';
  const A=window.AlgoArt;
  const base={"orientation":"landscape","elements":24,"density":64,"complexity":52,"negativeSpace":59,"phiStrength":96,"recursion":5,"spiralInfluence":51,"goldenAngle":88,"nesting":47,"pen":"fine","thickness":11,"wobble":34,"overdraw":3,"opacity":72,"pressure":36,"dryness":19,"curveBias":77,"shapeAmount":65,"overlap":58,"rotation":46,"lines":true,"circles":true,"rectangles":true,"polygons":true,"arcs":true,"palette":"golden","colourCount":4,"saturation":88,"brightness":61,"paper":"#f5f0e6","grain":13};
  const cases=[{"name":"01-connected-landscape","label":"Connected Fields","mode":"network","seed":"OIL-DEMO-CONNECTED-628"},{"name":"02-recursive-landscape","label":"Recursive Divisions","mode":"rects","seed":"OIL-DEMO-RECURSIVE-837","elements":18,"density":55,"complexity":61,"negativeSpace":65,"recursion":5,"spiralInfluence":50,"goldenAngle":91,"nesting":56,"curveBias":18,"shapeAmount":46,"overlap":62,"rotation":26,"palette":"earth"},{"name":"03-growth-portrait","label":"Growth Systems","mode":"organic","orientation":"portrait","seed":"OIL-DEMO-GROWTH-419","elements":36,"density":52,"complexity":71,"negativeSpace":52,"phiStrength":93,"recursion":4,"spiralInfluence":57,"goldenAngle":94,"nesting":58,"curveBias":86,"shapeAmount":68,"overlap":60,"rotation":63},{"name":"04-orbital-portrait","label":"Orbital Studies","mode":"field","orientation":"portrait","seed":"OIL-DEMO-ORBITAL-113","elements":28,"density":56,"complexity":72,"negativeSpace":64,"phiStrength":97,"recursion":4,"spiralInfluence":48,"goldenAngle":93,"nesting":46,"curveBias":61,"shapeAmount":68,"overlap":46,"rotation":55,"palette":"warm"}];
  A.rendererVersion=8;
  const preset=document.getElementById('preset');
  const seed=document.getElementById('seed');
  const status=document.getElementById('status');
  const quality=document.getElementById('quality');
  let identity=A.oilMaterial;
  for(const [i,c] of cases.entries()){
    const opt=document.createElement('option');
    opt.value=String(i);opt.textContent=c.label+' — '+(c.orientation||base.orientation);
    preset.append(opt);
  }
  function choose(){
    const c=cases[Number(preset.value)||0];
    seed.value=c.seed;
  }
  function draw(){
    window.__previewReady=false;
    status.textContent='Rendering…';
    // Let the status paint before the synchronous native Canvas2D work.
    requestAnimationFrame(()=>setTimeout(()=>{
      const s={...base,...cases[Number(preset.value)||0],seed:seed.value.trim()||'WET-EDGE-STUDY'};
      const scale=Number(quality.value);
      delete s.name;delete s.label;
      const left=document.getElementById('reference');
      const right=document.getElementById('experimental');
      try{
        A.oilMaterial=identity;
        const before=A.renderOil(left,s,scale,false,6);
        A.oilMaterial=A.watercolourMaterialExperiment;
        const after=A.renderOil(right,s,scale,false,6);
        if(before.strategy!==after.strategy)throw new Error('Composition strategy changed');
        document.getElementById('stats').textContent=
          'Seed '+s.seed+' | V8 '+s.mode+' | '+s.orientation+
          ' | paper #f5f0e6 | '+(A.lastWatercolourExperimentStats?.chains||0)+' source chains';
        status.textContent='Comparison ready — same seed, V8 geometry and source colours.';
        window.__previewReady=true;
      }catch(e){
        status.textContent='Render failed: '+e.message;
        window.__previewError=String(e.stack||e);
        console.error(e);
      }finally{
        A.oilMaterial=identity;
      }
    },25));
  }
  preset.addEventListener('change',()=>{choose();draw()});
  document.getElementById('render').addEventListener('click',draw);
  choose();
  draw();
})();
</script></body></html>
