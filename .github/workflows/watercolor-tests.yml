name: Watercolor publishing regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'automation/**'
      - 'js/app.js'
      - 'tests/watercolor-*.test.mjs'
      - '.github/workflows/watercolor-live.yml'
      - '.github/workflows/social-live.yml'
      - '.github/workflows/gallery-daily.yml'
      - '.github/workflows/watercolor-tests.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: watercolor-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scheduling-and-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test four watercolor IDs, slots and gallery merging
        run: npm run test:watercolor-publishing
      - name: Preserve existing five marker landscape and portrait slots
        run: npm run test:portrait-publishing
      - name: Validate workflow YAML and two-slot restrictions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          parent=Path('.github/workflows/social-live.yml').read_text()
          watercolor=Path('.github/workflows/watercolor-live.yml').read_text()
          gallery=Path('.github/workflows/gallery-daily.yml').read_text()
          for p in ['social-live.yml','watercolor-live.yml','gallery-daily.yml']:
              yaml.safe_load(Path('.github/workflows',p).read_text())
          assert 'watercolor-landscape:' in parent and 'watercolor-portrait:' in parent
          assert "slot == '0' || needs.portrait-plan.outputs.slot == '2'" in parent
          assert 'SOCIAL_MATERIAL: watercolor' in watercolor
          assert 'GALLERY_QUEUE_MATERIAL: watercolor' in gallery
          assert 'done-'+ '
          assert "'15:00'" not in watercolor
          print('PASS: YAML parses and watercolor is separate from marker publishers')
          PY
  browser-watercolor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start local renderer
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/watercolor-ci.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Reproduce four watercolor JPEGs and their editor links
        run: node tests/watercolor-pipeline.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watercolor-daily-examples
          path: watercolor-check-results/
          retention-days: 14
+'{DATE}-watercolor-'+ '
          assert "'15:00'" not in watercolor
          print('PASS: YAML parses and watercolor is separate from marker publishers')
          PY
  browser-watercolor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start local renderer
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/watercolor-ci.log 2>&1 &
