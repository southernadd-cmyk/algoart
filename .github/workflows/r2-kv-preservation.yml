name: Release A — retain and restore Workers KV preview JPEGs

# One-shot isolated branch only; does not deploy the Worker or change KV.
# Stores a private immutable backup, with only anonymous metadata in CI report.
on:
  push:
    branches:
      - plan/archive-storage-foundation-20261109
    paths:
      - .github/workflows/r2-kv-preservation.yml

permissions:
  contents: read

concurrency:
  group: proportion-piece-release-a-kv-preservation
  cancel-in-progress: false

jobs:
  preserve-kv-previews:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/plan/archive-storage-foundation-20261109' && github.event.head_commit.message == 'Run private Workers KV preservation and restore 2026-11-09' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: archive-r2-test
    steps:
      - name: Checkout isolated test only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify test code and install read-only API clients
        run: |
          python -m py_compile automation/r2-preserve-preview-kv.py
          python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'boto3>=1.34,<2'

      - name: Fetch KV JPEGs read-only, preserve privately in R2 and verify restored hashes
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: proportion-piece-archive-test
          CF_KV_READ_TOKEN: ${{ secrets.CF_KV_READ_TOKEN }}
          KV_BACKUP_REPORT_DIR: ${{ runner.temp }}/release-a-kv-preservation
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python automation/r2-preserve-preview-kv.py

      - name: Publish anonymised verification report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-a-kv-preservation-report-${{ github.run_id }}
          path: ${{ runner.temp }}/release-a-kv-preservation/
          if-no-files-found: warn
          retention-days: 30

      - name: Clarify permanent-storage boundaries
        if: always()
        run: |
          echo '### Release A — Cloudflare preview JPEG preservation' >> "$GITHUB_STEP_SUMMARY"
          echo 'Read-only source KV -> private R2 immutable archive -> complete SHA-256 restore.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Share tokens and JPEG bytes are stored only in the PRIVATE backup, never in Actions reports.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This snapshot is provisional and not a second-provider backup. No live code changed.' >> "$GITHUB_STEP_SUMMARY"
