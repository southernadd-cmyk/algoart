name: Test local Three.js gallery bundle
on:
  push:
    branches:
      - fix/local-three-gallery-bundle
  workflow_dispatch:
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts esbuild@0.25.12 three@0.180.0
      - name: Bundle gallery and VR addon
        run: npx esbuild gallery/visit/gallery-v2.js --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=gallery/visit/gallery-bundle.js
      - name: Verify bundle and absence of remote Three.js imports
        run: |
          test -s gallery/visit/gallery-bundle.js
          if grep -E 'cdn\\.jsdelivr\\.net|from ["\x27]three|import\\(["\x27]three' gallery/visit/gallery-bundle.js; then
            echo "Unexpected external Three.js reference"
            exit 1
          fi
          node --check gallery/visit/gallery-bundle.js
      - uses: actions/upload-artifact@v4
        with:
          name: local-three-gallery-bundle
          path: gallery/visit/gallery-bundle.js
