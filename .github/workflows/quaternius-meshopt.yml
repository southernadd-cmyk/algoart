name: Build compressed Quaternius visitors
on:
  push:
    branches: [main]
    paths:
      - 'automation/build-quaternius-flat.py'
      - 'automation/meshopt-quaternius.mjs'
      - 'test/virtual-gallery/quaternius-meshopt-check.html'
      - 'test/virtual-gallery/visitors.mjs'
      - '.github/workflows/quaternius-meshopt.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  compress-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install conversion dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Rebuild Quaternius vertex-colour models, eye textures only
        run: python automation/build-quaternius-flat.py
      - name: Install proven Meshopt tooling
        run: npm install --no-save --no-package-lock @gltf-transform/core@4.5.1 @gltf-transform/extensions@4.5.1 @gltf-transform/functions@4.5.1 meshoptimizer@0.25.0
      - name: Compress male and female rigs
        run: |
          node automation/meshopt-quaternius.mjs
      - name: Verify sizes, skin bones, vertex colours and Meshopt
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,struct
          p=Path('test/virtual-gallery/models')
          total=0
          for sex in ('male','female'):
            def read(suffix):
              data=(p/f'quaternius-{sex}-{suffix}.glb').read_bytes()
              assert data[:4]==b'glTF' and struct.unpack_from('<I',data,8)[0]==len(data)
              n=struct.unpack_from('<I',data,12)[0]
              return data,json.loads(data[20:20+n])
            before,a=read('flat')
            after,b=read('meshopt')
            print(f'{sex}: original {len(before):,}, compressed {len(after):,}; meshes {len(a.get("meshes",[]))}->{len(b.get("meshes",[]))}; skins {len(a.get("skins",[]))}->{len(b.get("skins",[]))}; nodes {len(a.get("nodes",[]))}->{len(b.get("nodes",[]))}; extensions {b.get("extensionsRequired",[])}',flush=True)
            assert len(after)<len(before),(sex,'not smaller')
            assert 'EXT_meshopt_compression' in b.get('extensionsRequired',[])
            assert len(a['meshes'])==len(b['meshes'])
            assert len(a['skins'])==1 and len(b['skins'])>=1
            def joint_names(g,skin):return sorted(g['nodes'][i].get('name','') for i in skin['joints'])
            expected=joint_names(a,a['skins'][0])
            assert len(expected)==65 and all(joint_names(b,skin)==expected for skin in b['skins'])
            def skinned_nodes(g):return sorted(n.get('name','') for n in g['nodes'] if 'skin' in n)
            assert skinned_nodes(a)==skinned_nodes(b)
            assert len(b.get('images',[]))==1
            assert any('COLOR_0' in prim['attributes'] for mesh in b['meshes'] for prim in mesh['primitives'])
            total+=len(after)
            print(f'{sex}: {len(before):,} -> {len(after):,} bytes',flush=True)
          print(f'COMBINED: {total:,} bytes',flush=True)
          PY
      - name: Install Chromium pose-test tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test actual compressed male and female models in WebGL
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/quaternius-test.log 2>&1 &
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import {mkdirSync} from 'node:fs';
          mkdirSync('quaternius-pose-screenshots',{recursive:true});
          const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl']});
          try{
            const page=await browser.newPage({viewport:{width:1200,height:720}});
            page.on('pageerror',e=>console.error('BROWSER:',e.message));
            await page.goto('http://127.0.0.1:4173/test/virtual-gallery/quaternius-meshopt-check.html');
            await page.waitForFunction(()=>window.poseResults?.status!=='loading',null,{timeout:60000});
            for(const pose of ['standing','arm','seated']){
              if(pose!=='standing')await page.evaluate(p=>window.showPose(p),pose);
              const state=await page.evaluate(()=>window.poseResults);
              if(state.status!=='pass')throw Error(pose+': '+JSON.stringify(state));
              await page.screenshot({path:'quaternius-pose-screenshots/'+pose+'.png'});
              console.log('PASS browser pose:',pose);
            }
          }finally{await browser.close()}
          JS
      - name: Upload compressed pose screenshots
        uses: actions/upload-artifact@v4
        with:
          name: quaternius-meshopt-pose-screenshots
          path: quaternius-pose-screenshots/*.png
          if-no-files-found: error
      - name: Upload compressed files without changing the live gallery
        uses: actions/upload-artifact@v4
        with:
          name: quaternius-male-female-meshopt
          path: test/virtual-gallery/models/quaternius-*-meshopt.glb
          if-no-files-found: error
      - name: Install validated visitors in production
        run: |
          mkdir -p gallery/visit/models
          cp test/virtual-gallery/models/quaternius-{male,female}-meshopt.glb gallery/visit/models/
      - name: Publish validated visitor assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery/visit/models/quaternius-*-meshopt.glb
          if ! git diff --cached --quiet; then
            git commit -m "Publish 520 KB Quaternius Meshopt visitor models"
            git reset --hard HEAD
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish assets to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
