name: ALGO ART mobile UI regression

on:
  push:
    paths:
      - '.github/workflows/mobile-ui-regression.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Check mobile viewport fit and scrolling
        run: |
          python3 -m http.server 4173 >/tmp/algoart-mobile-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          cat > mobile-ui-check.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser=await chromium.launch({headless:true});
          const cases=[
            {width:320,height:568},
            {width:360,height:740},
            {width:390,height:844},
            {width:430,height:932},
            {width:768,height:1024}
          ];

          for(const size of cases){
            const page=await browser.newPage({viewport:size,isMobile:size.width<=430,hasTouch:size.width<=430});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await page.evaluate(()=>localStorage.setItem('algoart-inspector-mobile','closed'));
            await page.reload({waitUntil:'networkidle'});

            const state=await page.evaluate(()=>{
              const ids=['regenerate','variations'];
              const gallery=document.querySelector('.gallery-nav');
              const rects=ids.map(id=>[id,document.getElementById(id).getBoundingClientRect()]);
              rects.push(['gallery',gallery.getBoundingClientRect()]);
              const canvas=document.querySelector('.canvas-wrap').getBoundingClientRect();
              const toolbar=document.querySelector('.toolbar').getBoundingClientRect();
              return{
                innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                bodyOverflowX:getComputedStyle(document.body).overflowX,
                bodyOverflowY:getComputedStyle(document.body).overflowY,
                buttons:rects.map(([id,r])=>({id,left:r.left,right:r.right,width:r.width,height:r.height,display:getComputedStyle(id==='gallery'?gallery:document.getElementById(id)).display})),
                canvas:{left:canvas.left,right:canvas.right,width:canvas.width},
                toolbar:{left:toolbar.left,right:toolbar.right,width:toolbar.width,height:toolbar.height}
              };
            });

            if(state.scrollWidth>state.innerWidth+1) throw new Error(`${size.width}px horizontal overflow: ${state.scrollWidth} > ${state.innerWidth}`);
            if(state.toolbar.left < -1 || state.toolbar.right > state.innerWidth+1) throw new Error(`${size.width}px toolbar outside viewport`);
            if(state.canvas.left < -1 || state.canvas.right > state.innerWidth+1) throw new Error(`${size.width}px canvas outside viewport`);
            for(const b of state.buttons){
              if(b.display==='none'||b.width<40||b.height<24) throw new Error(`${size.width}px ${b.id} not usable`);
              if(b.left < -1 || b.right > state.innerWidth+1) throw new Error(`${size.width}px ${b.id} clipped: ${JSON.stringify(b)}`);
            }

            if(size.width<=700){
              if(state.bodyOverflowY==='hidden') throw new Error(`${size.width}px body vertical scrolling remains locked`);
              await page.click('#inspectorToggle');
              const drawer=await page.evaluate(()=>{
                const panel=document.querySelector('.tab-panel.active');
                const cs=getComputedStyle(panel);
                const before=panel.scrollTop;
                panel.scrollTop=80;
                return{
                  overflowY:cs.overflowY,
                  scrollHeight:panel.scrollHeight,
                  clientHeight:panel.clientHeight,
                  before,
                  after:panel.scrollTop
                };
              });
              if(drawer.overflowY!=='auto'&&drawer.overflowY!=='scroll') throw new Error(`${size.width}px drawer is not scrollable`);
              if(drawer.scrollHeight>drawer.clientHeight+2 && drawer.after===0) throw new Error(`${size.width}px drawer scrolling is blocked`);
            }

            console.log(JSON.stringify({size,state},null,2));
            await page.close();
          }

          await browser.close();
          JS
          node mobile-ui-check.mjs
