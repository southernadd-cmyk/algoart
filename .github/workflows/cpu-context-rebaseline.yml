name: CPU canvas backend benchmark and re-baseline
on:
  pull_request:
    branches: [main]
    paths:
      - 'js/cpu-canvas.js'
      - 'js/cpu-material-versions.js'
      - 'js/oil-brush-v3.js'
      - 'js/app.js'
      - 'js/export.js'
      - 'tests/cpu-canvas-wrapper.test.mjs'
      - 'tests/cpu-context-rebaseline.mjs'
      - 'tests/fixtures/cpu-context-reference.json'
      - '.github/workflows/cpu-context-rebaseline.yml'
  workflow_dispatch:
    inputs:
      write_fixture:
        description: 'Write new-version reference hashes (default profile) and upload the merged fixture'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # default = GitHub's usual headless Chromium (CPU canvases in practice):
        #   full release gate, all samples and all three cold-start levels.
        # swiftshader = forced GPU-accelerated canvases (software GPU): verifies
        #   the same new-version hashes on a GPU backend; fewer timing samples.
        # While writing the fixture there is nothing to verify SwiftShader against.
        profile: ${{ inputs.write_fixture && fromJSON('["default"]') || fromJSON('["default","swiftshader"]') }}
        material: [oil, tissue, watercolour]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/cpu-context-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - name: CPU canvas wrapper unit tests
        env:
          BROWSER_PROFILE: ${{ matrix.profile }}
        run: node tests/cpu-canvas-wrapper.test.mjs
      - name: Benchmark and re-baseline gate
        env:
          BROWSER_PROFILE: ${{ matrix.profile }}
          MATERIALS: ${{ matrix.material }}
          REQUIRE_FULL_MATRIX: '1'
          WRITE_FIXTURE: ${{ inputs.write_fixture && '1' || '0' }}
          WARM_SAMPLES: ${{ matrix.profile == 'swiftshader' && '2' || '5' }}
          COLD_SAMPLES: ${{ matrix.profile == 'swiftshader' && '1' || '3' }}
          COLD_LEVELS: ${{ matrix.profile == 'swiftshader' && 'page' || 'page,context,browser' }}
        run: node tests/cpu-context-rebaseline.mjs
      - name: Job summary
        if: always()
        run: cat cpu-context-results/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-context-${{ matrix.profile }}-${{ matrix.material }}
          path: cpu-context-results/
          if-no-files-found: warn
  merge-fixture:
    if: ${{ inputs.write_fixture }}
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cpu-context-default-*
          path: fragments
      - name: Merge per-material fragments into one fixture
        run: |
          node -e '
            const fs=require("fs"),path=require("path");
            const files=fs.readdirSync("fragments").map(d=>path.join("fragments",d,"cpu-context-reference.fragment.json"));
            const parts=files.map(f=>JSON.parse(fs.readFileSync(f,"utf8")));
            const merged={note:parts[0].note,generated:new Date().toISOString(),
              probe:parts[0].probe,references:Object.assign({},...parts.map(p=>p.references))};
            if(Object.keys(merged.references).length!==48)throw Error("Expected 48 references, got "+Object.keys(merged.references).length);
            fs.writeFileSync("cpu-context-reference.json",JSON.stringify(merged,null,2)+"\n");'
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-context-reference-fixture
          path: cpu-context-reference.json
