name: Render eight 300 DPI PROPORTION PIECE prints (isolated)
on:
  push:
    branches:
      - print/eight-300dpi-20261103
    paths:
      - 'automation/print-eight-300dpi.mjs'
      - '.github/workflows/print-eight-300dpi.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact project renderer (print-only sparse files)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html
            js
            css
            fonts
            automation
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Serve editor locally (no changes to live website)
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pp-print-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - name: Render exactly eight high-resolution PNGs
        run: node automation/print-eight-300dpi.mjs
      - name: One ZIP of eight 300dpi PNGs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PROPORTION_PIECE_8_IMAGES_300DPI
          path: print-eight-output/*.png
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
