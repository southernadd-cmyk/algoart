name: ALGO ART V6 repair publish

on:
  push:
    paths:
      - '.github/v6-repair-trigger'

permissions:
  contents: write

concurrency:
  group: algoart-v6-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_SITE_URL: https://southernadd-cmyk.github.io/algoart/
      ALGOART_LOCAL_URL: http://127.0.0.1:4173/
      RELEASE_TAG: algoart-social-live
      GH_TOKEN: ${{ github.token }}
      SOCIAL_DATE: '2026-10-06'
      SOCIAL_RENDERER_VERSION: '6'
      SOCIAL_FORCE_MODE: spiral
      SOCIAL_COUNT: '2'
      SOCIAL_SEED_SALT: v6-repair-validated
      SOCIAL_OUTPUT_DIR: social-v6-repair

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Generate and validate two V6 Golden Trajectories
        run: node automation/generate-social.mjs
      - name: Append only validated images to gallery
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const day=process.env.SOCIAL_DATE;
          const meta=JSON.parse(await fs.readFile(`gallery/${day}/meta.json`,'utf8'));
          const test=JSON.parse(await fs.readFile(`social-v6-repair/${day}/queue.json`,'utf8'));
          const old=meta.entries.map((e,i)=>({
            id:e.id||`${day}-${String(i+1).padStart(2,'0')}`,seed:e.seed,mode:e.mode,series:e.series,
            imageFile:e.imageFile,shareUrl:e.shareUrl,rendererVersion:e.rendererVersion,settings:e.settings,
            copy:{altText:e.altText||''},platforms:{reserve:{status:'reserve'}}
          }));
          const merged=[...old,...test.entries];
          const out=path.resolve('social-output',day); await fs.mkdir(out,{recursive:true});
          for(const e of old) await fs.copyFile(path.resolve('gallery',day,e.imageFile),path.join(out,e.imageFile));
          for(const e of test.entries) await fs.copyFile(path.resolve('social-v6-repair',day,e.imageFile),path.join(out,e.imageFile));
          await fs.writeFile(path.join(out,'queue.json'),JSON.stringify({version:1,date:day,generatedAt:new Date().toISOString(),entries:merged},null,2));
          NODE
          npm run gallery:build
      - name: Commit gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery sitemap.xml robots.txt
          git commit -m "Add two validated V6 Golden Trajectories to daily gallery"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish both validated images to Instagram and Threads
        shell: bash
        env:
          LIVE_PUBLISHING: 'true'
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then gh release create "$RELEASE_TAG" --title "ALGO/ART social publishing media" --notes "Rolling public media host."; fi
          for IDX in 0 1; do
            eval "$(IDX=$IDX node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const q=JSON.parse(fs.readFileSync(`social-v6-repair/${process.env.SOCIAL_DATE}/queue.json`,'utf8'));
          const e=q.entries[Number(process.env.IDX)];
          const b=s=>Buffer.from(s||'').toString('base64');
          console.log('FILE='+JSON.stringify(`social-v6-repair/${process.env.SOCIAL_DATE}/${e.imageFile}`));
          console.log('ASSET='+JSON.stringify(`v6-repair-${process.env.IDX}-${e.imageFile}`));
          console.log('IG='+JSON.stringify(b(e.copy.instagram)));
          console.log('TH='+JSON.stringify(b(e.copy.threads)));
          console.log('ALT='+JSON.stringify(b(e.copy.altText)));
          NODE
          )"
            cp "$FILE" "/tmp/$ASSET"
            gh release upload "$RELEASE_TAG" "/tmp/$ASSET" --clobber
            export MEDIA_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$ASSET"
            curl -fL --retry 4 -o /tmp/check.jpg "$MEDIA_URL"
            export CAPTION="$(printf '%s' "$IG" | base64 --decode)"
            export ALT_TEXT="$(printf '%s' "$ALT" | base64 --decode)"
            npm run social:instagram
            export CAPTION="$(printf '%s' "$TH" | base64 --decode)"
            npm run social:threads
          done
