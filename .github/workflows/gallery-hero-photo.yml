name: Capture real tower gallery hero

on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-gallery-hero.mjs'
      - '.github/workflows/gallery-hero-photo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-hero-photo
  cancel-in-progress: false

jobs:
  photograph:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Photograph the live tower at the original plaza angle
        run: node scripts/capture-gallery-hero.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: current-tower-gallery-hero
          path: gallery/visit/walk-the-tower-golden.png
          if-no-files-found: error
      - name: Publish the single replacement image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery/visit/walk-the-tower-golden.png
          if git diff --cached --quiet; then
            echo "Image already matches the live tower capture"
            exit 0
          fi
          git commit -m "Refresh gallery homepage hero with real tower screenshot"
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              echo "Concurrent edit conflict: preserving existing main branch unchanged"
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
