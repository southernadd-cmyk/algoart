name: Editorial test preview
on:
  pull_request:
    paths:
      - 'test/**'
      - 'gallery/**'
      - 'automation/build-gallery.mjs'
      - 'automation/build-sculpture-v2-test.mjs'
      - 'automation/build-sculpture-comparison.mjs'
      - 'automation/build-sculpture-splats.mjs'
      - 'automation/lib/sculpture-splat-pack.mjs'
      - 'tests/gaussian-live-preview.test.mjs'
      - 'tests/editorial-preview.test.mjs'
      - '.github/workflows/editorial-preview.yml'
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate changed Gaussian preview with real tower build
        run: |
          if [[ "${{ github.event_name }}" == workflow_dispatch ]] || ! git rev-parse HEAD^1 >/dev/null 2>&1 || git diff --name-only HEAD^1 HEAD | grep -Eq '^(gallery/gaussian-splat-lab/|automation/build-sculpture-v2-test\.mjs|tests/gaussian-live-preview\.test\.mjs|\.github/workflows/editorial-preview\.yml)'; then
            node --test tests/gaussian-live-preview.test.mjs
            node automation/build-sculpture-v2-test.mjs --gaussian-preview
            node --check gallery/visit/gallery-phi-gaussian-preview-bundle.js
            grep -q 'gallery-phi-gaussian-preview-bundle.js' gallery/gaussian-splat-lab/tower.html
            grep -q 'three/addons/' gallery/gaussian-splat-lab/tower.html
          fi
      - name: Verify real sculpture comparison asset bake
        run: |
          if [[ "${{ github.event_name }}" == workflow_dispatch ]] || git diff --name-only HEAD^1 HEAD | grep -Eq '^(gallery/gaussian-splat-lab/sculpture-|automation/build-sculpture-comparison\.mjs|gallery/gaussian-sculpture-lab/)'; then
            timeout 240s node automation/build-sculpture-comparison.mjs
            test -s gallery/gaussian-splat-lab/sculptures-2026-11-26-mobile-v1.json.gz
            test -s gallery/gaussian-splat-lab/sculptures-2026-11-26-desktop-v1.json.gz
          fi
      - name: GS1 production-format smoke bake from verified R2
        run: |
          if [[ "${{ github.event_name }}" == workflow_dispatch ]] || git diff --name-only HEAD^1 HEAD | grep -Eq '^(gallery/sculpture-splats/|automation/build-sculpture-splats\.mjs|automation/lib/sculpture-splat-pack\.mjs)'; then
            timeout 240s node automation/build-sculpture-splats.mjs --date 2026-11-26 --quality both --out /tmp/gs1
            timeout 120s node automation/build-sculpture-splats.mjs --date reception --quality mobile --out /tmp/gs1
            test "$(find /tmp/gs1 -name '*.json.gz' | wc -l)" -eq 3
          fi
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/editorial-http.log 2>&1 &
      - run: node tests/editorial-preview.test.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-preview-screenshots
          path: editorial-preview-results/
          if-no-files-found: warn
