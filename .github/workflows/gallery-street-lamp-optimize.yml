name: Optimize cast-iron gallery lamps
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gallery-street-lamp-optimize.yml'
      - 'automation/optimize-gallery-street-lamp.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: optimize-gallery-street-lamp
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install image tooling
        run: python3 -m pip install --break-system-packages 'Pillow>=10,<13'
      - name: Repack original GLB to smaller same-origin asset
        run: python3 automation/optimize-gallery-street-lamp.py
      - name: Install optimized street lamp in production
        run: |
          mkdir -p gallery/visit/models
          cp test/virtual-gallery/models/polyhaven-street-lamp-01-optimized.glb gallery/visit/models/
      - name: Publish optimized static model
        id: publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery/visit/models/polyhaven-street-lamp-01-optimized.glb
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Publish texture-optimized cast-iron street lamp"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to GitHub Pages
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
