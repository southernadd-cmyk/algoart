name: Dispatch the 11 November R2 canary

on:
  push:
    branches: [ops/r2-canary-2026-11-11]
    paths: [.github/workflows/ops-r2-canary-20261111.yml]

permissions:
  actions: write
  contents: read

concurrency:
  group: pp-r2-canary-2026-11-11
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'southernadd-cmyk/algoart' &&
      github.ref == 'refs/heads/ops/r2-canary-2026-11-11' &&
      (github.event.head_commit.message == 'Preflight R2 canary 2026-11-11' ||
      github.event.head_commit.message == 'Dispatch R2 canary 2026-11-11')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/workflows
          persist-credentials: false

      - name: Check the armed edition and dispatch the daily workflow once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST: ${{ github.event.head_commit.message }}
          ARMED_DATE: ${{ vars.PP_R2_CANARY_DATE }}
          CANARY_DATE: '2026-11-11'
          DAILY_WORKFLOW_BLOB: '419e5685e53caca2751b1f9af72b6d736d5fe850'
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [[ "$ARMED_DATE" == "$CANARY_DATE" ]] || fail "The repository variable has a different date."
          [[ "$(git rev-parse HEAD:.github/workflows/gallery-daily.yml)" == "$DAILY_WORKFLOW_BLOB" ]] ||
            fail "The daily gallery workflow changed after canary verification."
          [[ -z "$(git ls-tree HEAD -- "gallery/$CANARY_DATE")" ]] ||
            fail "The canary date already has gallery files on main."

          endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/gallery-daily.yml"
          [[ "$(gh api "$endpoint" --jq .state)" == active ]] ||
            fail "The daily gallery workflow is unavailable."

          if [[ "$REQUEST" == "Preflight R2 canary $CANARY_DATE" ]]; then
            echo "Preflight confirmed the armed date and unpublished edition $CANARY_DATE."
            exit 0
          fi

          [[ "$REQUEST" == "Dispatch R2 canary $CANARY_DATE" && "$GITHUB_RUN_ATTEMPT" == 1 ]] ||
            fail "The dispatch requires its dedicated first-attempt commit."
          [[ "$(TZ=Europe/London date +%F)" == "$CANARY_DATE" ]] ||
            fail "The London calendar date has not reached the armed edition or has passed it."

          prior="$(gh api --method GET "$endpoint/runs" -f branch=main -f event=workflow_dispatch \
            -f "created=>=${CANARY_DATE}T00:00:00Z" --jq .total_count)"
          [[ "$prior" == 0 ]] || fail "A manual daily gallery run already exists for this time window."

          response="$(jq -nc --arg date "$CANARY_DATE" \
            '{ref:"main",inputs:{date:$date,r2_canary:"true"}}' |
            gh api --method POST "$endpoint/dispatches" -H 'X-GitHub-Api-Version: 2026-03-10' --input -)"
          run_id="$(jq -er '.workflow_run_id | numbers | select(. > 0)' <<< "$response")"
          echo "CANARY_RUN_ID=$run_id"
          printf 'Started the [11 November R2 canary](https://github.com/%s/actions/runs/%s).\n' \
            "$GITHUB_REPOSITORY" "$run_id" >> "$GITHUB_STEP_SUMMARY"

# Non-publishing preflight invocation for 11 November 2026.
# Verified non-publishing 11 November preflight execution.
# Dispatch verified R2 canary for 2026-11-11 only.

  diagnose-r2-access:
    if: github.ref == 'refs/heads/ops/r2-canary-2026-11-11' && github.event.head_commit.message == 'Diagnose R2 access 2026-11-11'
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 3
    steps:
      - name: Compare both read-only Worker media endpoints, without writes
        shell: bash
        run: |
          asset='editions/2026-11-11/2026-11-11-G01/original-7fac9fd2dd660220695af6a4946ca9bf955fa68d63c0f3e169c193064ddb489d.jpg'
          for name in proportion-piece-media proportion-piece-sculpture-v2; do
            url="https://${name}.mr-adam-clement.workers.dev/${asset}"
            for method in GET HEAD; do
              code="$(curl --silent --show-error --max-time 15 --output /dev/null --dump-header "$RUNNER_TEMP/r2-public.headers" --write-out '%{http_code}' --request "$method" --header 'Origin: https://southernadd-cmyk.github.io' "$url" || true)"
              echo "PROBE ${name} ${method} status=${code}"
              grep -iE '^(content-type|content-length|access-control-allow-origin|cache-control):' "$RUNNER_TEMP/r2-public.headers" || true
            done
          done

  diagnose-all-r2:
    if: github.ref == 'refs/heads/ops/r2-canary-2026-11-11' && github.event.head_commit.message == 'Diagnose all R2 assets 2026-11-11'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 6
    steps:
      - name: Download failed canary inventory, read-only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42984459816 --repo "$GITHUB_REPOSITORY" --name r2-canary-2026-11-11 --dir "$RUNNER_TEMP/r2-public-audit"
      - name: Reproduce exact Python HTTP request for every immutable asset
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, hashlib
          import urllib.request as u
          from urllib.error import HTTPError, URLError
          from pathlib import Path
          class NoRedirects(u.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, url):
                  return None
          opener=u.build_opener(NoRedirects())
          assets=json.loads((Path(os.environ['RUNNER_TEMP'])/'r2-public-audit/media-publication.json').read_text())['mediaAssets']
          origin='https://southernadd-cmyk.github.io'
          for i,item in enumerate(assets,1):
              for method in ('GET','HEAD'):
                  try:
                      req=u.Request(item['url'], headers={'Origin':origin}, method=method)
                      with opener.open(req,timeout=18) as r:
                          if r.status!=200:
                              raise ValueError('unexpected HTTP status '+str(r.status))
                          if method=='GET':
                              data=r.read(item['bytes']+1)
                              if len(data)!=item['bytes'] or hashlib.sha256(data).hexdigest()!=item['sha256']:
                                  raise ValueError('wrong length or hash')
                  except Exception as e:
                      print(f'ASSET_FAIL index={i}/{len(assets)} role={item["role"]} key={item["key"]} method={method} error={type(e).__name__} status={getattr(e,"code","n/a")}',flush=True)
                      if isinstance(e,HTTPError):
                          print('ERROR_HEADERS '+str({k:v for k,v in e.headers.items() if k.lower() in ('server','cf-ray','content-type','access-control-allow-origin')}),flush=True)
                          print('ERROR_BODY '+repr(e.read(250)),flush=True)
                      for agent in ('curl/8.7.1','Mozilla/5.0'):
                          try:
                              req=u.Request(item['url'],headers={'Origin':origin,'User-Agent':agent},method=method)
                              with opener.open(req,timeout=18) as r:
                                  print('UA_RETRY '+agent+' status='+str(r.status),flush=True)
                          except Exception as error:
                              print('UA_RETRY '+agent+' error='+type(error).__name__+' status='+str(getattr(error,'code','n/a')),flush=True)
                      alt=item['url'].replace('proportion-piece-media.','proportion-piece-sculpture-v2.')
                      try:
                          req=u.Request(alt,headers={'Origin':origin},method=method)
                          with opener.open(req,timeout=18) as r:
                              print('ALT_WORKER status='+str(r.status),flush=True)
                      except Exception as error:
                          print('ALT_WORKER error='+type(error).__name__+' status='+str(getattr(error,'code','n/a')),flush=True)
                      raise SystemExit(0)
              if i%10==0:
                  print(f'ASSET_PROGRESS {i}/{len(assets)} all GET+HEAD+SHA256 pass',flush=True)
          print('ALL_ASSETS_PASS '+str(len(assets)),flush=True)
          PY

  validate-r2-verifier-fix:
    if: github.ref == 'refs/heads/ops/r2-canary-2026-11-11' && github.event.head_commit.message == 'Validate R2 verifier fix 2026-11-11'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 8
    steps:
      - name: Checkout isolated PR fix (no writes)
        uses: actions/checkout@v4
        with:
          ref: fix/r2-verifier-cloudflare-1010-20261111
          persist-credentials: false
      - name: Install verifier test dependency
        run: python3 -m pip install --break-system-packages 'boto3>=1.37,<2'
      - name: Run R2 verifier regression tests
        run: python3 -m unittest discover -s tests -p test_r2_daily_media.py -v
      - name: Download full original canary inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42984459816 --repo "$GITHUB_REPOSITORY" --name r2-canary-2026-11-11 --dir "$RUNNER_TEMP/r2-verified"
      - name: Read back all original R2 media objects with exact patched verifier
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, importlib.util
          from pathlib import Path
          src=Path('automation/r2-daily-media.py')
          spec=importlib.util.spec_from_file_location('r2_verified',src)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          manifest=json.loads((Path(os.environ['RUNNER_TEMP'])/'r2-verified/media-publication.json').read_text())
          assert manifest['count']==14 and len(manifest['mediaAssets'])==44
          assert module.PUBLIC_VERIFY_USER_AGENT=='Mozilla/5.0'
          module.verify_public(manifest['mediaAssets'])
          print('R2_PATCHED_FULL_PUBLIC_VERIFY_PASS 44 objects GET+HEAD+sha256+content-length+origin')
          PY

  diagnose-node-reader:
    if: github.ref == 'refs/heads/ops/r2-canary-2026-11-11' && github.event.head_commit.message == 'Diagnose Node R2 reader 2026-11-11'
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test social Node fetch without a custom user-agent
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const url='https://proportion-piece-media.mr-adam-clement.workers.dev/editions/2026-11-11/2026-11-11-G01/original-7fac9fd2dd660220695af6a4946ca9bf955fa68d63c0f3e169c193064ddb489d.jpg';
          const res=await fetch(url,{redirect:'error',signal:AbortSignal.timeout(15000)});
          console.log('SOCIAL_NODE_FETCH_STATUS',res.status);
          console.log('SOCIAL_NODE_CONTENT_TYPE',res.headers.get('content-type'));
          if(res.ok) console.log('SOCIAL_NODE_BYTES',(await res.arrayBuffer()).byteLength);
          else console.log('SOCIAL_NODE_ERROR_BODY',(await res.text()).slice(0,140));
          JS
