name: Phi post-processing experiment
on:
  push:
    branches: ['test/postprocessing', 'test/postprocessing-shadows']
  workflow_run:
    workflows: ['Deploy ALGO ART to Pages']
    types: [completed]
  workflow_dispatch:
    inputs:
      deployed_url:
        description: 'Optional deployed test URL to verify instead of local staging'
        required: false
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && contains(github.event.workflow_run.head_commit.message, 'Publish test-only post-processing comparison'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run gallery:bundle:post-test
      - run: node --test tests/phi-postprocessing.test.mjs
      - run: npx playwright install chromium
      - run: node tests/phi-postprocessing-browser.mjs
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/post-test-http.log 2>&1 &
      - run: node tests/phi-postprocessing-tower.mjs
        env:
          PHI_POST_TEST_URL: ${{ github.event_name == 'workflow_run' && 'https://southernadd-cmyk.github.io/algoart/test/virtual-gallery/full-engine.html' || inputs.deployed_url }}
          PHI_SHADOW_TEST: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phi-postprocessing-results
          path: phi-postprocessing-results/
          if-no-files-found: ignore
