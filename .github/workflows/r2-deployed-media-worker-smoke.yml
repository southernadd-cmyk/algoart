name: Release A — test DEPLOYED workers.dev media URL (2 disposable objects)
on:
  push:
    branches: [plan/archive-storage-foundation-20261109]
    paths: [.github/workflows/r2-deployed-media-worker-smoke.yml]
permissions:
  contents: read
concurrency:
  group: pp-deployed-media-worker-smoke
  cancel-in-progress: false
jobs:
  real-worker-endpoint:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/plan/archive-storage-foundation-20261109' && github.event.head_commit.message == 'Run deployed media Worker real JPEG WebP smoke' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: archive-media-test
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      R2_MEDIA_ACCESS_KEY_ID: ${{ secrets.R2_MEDIA_ACCESS_KEY_ID }}
      R2_MEDIA_SECRET_ACCESS_KEY: ${{ secrets.R2_MEDIA_SECRET_ACCESS_KEY }}
      R2_MEDIA_BUCKET: proportion-piece-media-test
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Check out only the isolated test code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out real original media READ-ONLY
        uses: actions/checkout@v4
        with:
          ref: main
          path: live-snapshot
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated S3 and browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check 'boto3>=1.34,<2' 'requests>=2.31,<3' 'playwright==1.64.0'
          python -m playwright install --with-deps chromium
      - name: Verify deployed Worker serves real immutable JPEG/WebP and cleans up
        run: |
          python -m py_compile automation/test-deployed-media-worker.py
          python automation/test-deployed-media-worker.py
      - name: Upload no-credential read-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-workers-dev-smoke-${{ github.run_id }}
          path: worker-endpoint-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize scope
        if: always()
        run: |
          {
            echo '### Real deployed workers.dev media endpoint test'
            echo 'Checks expected homepage 404, real immutable JPEG/WebP GET and HEAD, hashes, CORS and Chromium WebGL.'
            echo 'Only two run-unique temporary R2 objects can be uploaded and are removed in finally block.'
            echo 'No pages, production publishing, social Worker, historical original images or private archive touched.'
          } >> "$GITHUB_STEP_SUMMARY"