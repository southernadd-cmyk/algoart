name: Gallery fallback deployment credential preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gallery-fallback-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      DISPATCH_TOKEN: ${{ secrets.GALLERY_DISPATCH_TOKEN || secrets.PP_GITHUB_TOKEN || secrets.GITHUB_PAT || secrets.GH_PAT || secrets.GITHUB_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm existing credentials without disclosing them
        shell: bash
        run: |
          echo "Cloudflare deploy token present: $([[ -n "$CLOUDFLARE_API_TOKEN" ]] && echo yes || echo no)"
          echo "Cloudflare account ID present: $([[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] && echo yes || echo no)"
          echo "Long-lived GitHub dispatch token present under a known secret name: $([[ -n "$DISPATCH_TOKEN" ]] && echo yes || echo no)"
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::warning::Cloudflare deployment credentials missing"
            exit 0
          fi
          for worker in proportion-piece-social proportion-piece-media proportion-piece-sculpture-v2 proportion-piece-gallery-fallback; do
            echo "Checking existing secret bindings on $worker"
            if npx --yes wrangler@4.160.0 secret list --name "$worker" > "$RUNNER_TEMP/worker-secrets.json" 2>"$RUNNER_TEMP/wrangler-error.txt"; then
              WORKER_NAME="$worker" node -e '
                const fs=require("node:fs");
                const data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/worker-secrets.json","utf8"));
                const found=data.some(x=>/^(GITHUB_TOKEN|GH_PAT|GALLERY_DISPATCH_TOKEN)$/.test(x.name));
                console.log("Worker "+process.env.WORKER_NAME+" has a GitHub dispatch secret: "+(found?"yes":"no"));
              '
            else
              echo "::warning::Unable to inspect $worker secret names"
            fi
          done
