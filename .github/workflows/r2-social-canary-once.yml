name: Isolated R2 social-image read-only delivery diagnostic
on:
  push:
    branches: [checks/r2-social-canary-20261111]
    paths: ['.github/workflows/r2-social-canary-once.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-social-canary-one-object-20261111
  cancel-in-progress: false

jobs:
  diagnose-existing-object:
    if: github.repository == 'southernadd-cmyk/algoart' && github.ref == 'refs/heads/checks/r2-social-canary-20261111'
    environment: archive-media-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      R2_MEDIA_ACCESS_KEY_ID: ${{ secrets.R2_MEDIA_ACCESS_KEY_ID }}
      R2_MEDIA_SECRET_ACCESS_KEY: ${{ secrets.R2_MEDIA_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scoped S3 HEAD client
        run: python -m pip install --disable-pip-version-check 'boto3>=1.37,<2'
      - name: Compare existing R2 canary with deployed Worker gallery and social routes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          import boto3
          from botocore.config import Config

          worker = 'https://proportion-piece-media.mr-adam-clement.workers.dev'
          bucket = 'proportion-piece-media-test'
          digest = 'd2bfff4b91fa31829a1d3e51419d6219974c502c653d486a9db66cca2de455ac'
          key = f'editions/2026-11-11/social/canary-{digest}.jpg'
          canary = worker + '/' + key
          gallery = 'https://proportion-piece-media.mr-adam-clement.workers.dev/editions/2026-11-11/2026-11-11-G01/original-7fac9fd2dd660220695af6a4946ca9bf955fa68d63c0f3e169c193064ddb489d.jpg'
          gallery_sha = '7fac9fd2dd660220695af6a4946ca9bf955fa68d63c0f3e169c193064ddb489d'
          account = os.environ.get('R2_ACCOUNT_ID', '')
          assert os.environ.get('GITHUB_REF') == 'refs/heads/checks/r2-social-canary-20261111'
          assert re.fullmatch('[a-fA-F0-9]{32}', account), 'Missing test environment account'
          assert os.environ.get('R2_MEDIA_ACCESS_KEY_ID') and os.environ.get('R2_MEDIA_SECRET_ACCESS_KEY'), 'Missing scoped test credentials'
          # Read only: this test calls S3 HEAD, never PUT/POST/DELETE.
          client = boto3.client('s3', endpoint_url=f'https://{account}.r2.cloudflarestorage.com',
              aws_access_key_id=os.environ['R2_MEDIA_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_MEDIA_SECRET_ACCESS_KEY'],
              region_name='auto', config=Config(signature_version='s3v4'))
          item = client.head_object(Bucket=bucket, Key=key)
          assert item['ContentLength'] == 12630, 'R2 canary byte count changed'
          assert item.get('Metadata', {}).get('sha256') == digest, 'R2 canary metadata digest changed'
          print('R2_CANARY_OBJECT_EXISTS', json.dumps({'bucket':bucket,'key':key,'bytes':12630,'sha256':digest}), flush=True)

          def request(method, url):
              req = Request(url, method=method, headers={'User-Agent':'Mozilla/5.0','Origin':'https://southernadd-cmyk.github.io'})
              try:
                  with urlopen(req, timeout=20) as rsp:
                      data = rsp.read() if method == 'GET' else b''
                      return {'status':rsp.status,'content_type':rsp.headers.get('Content-Type'),'content_length':rsp.headers.get('Content-Length'),
                              'cors':rsp.headers.get('Access-Control-Allow-Origin'),'etag':rsp.headers.get('ETag'),
                              'sha256': hashlib.sha256(data).hexdigest() if method=='GET' else None}
              except HTTPError as e:
                  return {'status':e.code,'content_type':e.headers.get('Content-Type'),'content_length':e.headers.get('Content-Length'),
                          'cors':e.headers.get('Access-Control-Allow-Origin'),'body':e.read(256).decode('utf8','replace') if method=='GET' else ''}
              except Exception as e:
                  return {'error':type(e).__name__+': '+str(e)}

          report = {'r2_canary_present':True,'bucket':bucket,'canary_url':canary,'known_gallery_url':gallery,
                    'gallery_get':request('GET',gallery),'gallery_head':request('HEAD',gallery),
                    'social_get':request('GET',canary),'social_head':request('HEAD',canary)}
          Path('canary-read-diagnostic.json').write_text(json.dumps(report, indent=2)+'\n')
          print('R2_CANARY_PUBLIC_DIAGNOSTIC',json.dumps(report),flush=True)
          good = (report['gallery_get'].get('status')==200 and report['gallery_get'].get('sha256')==gallery_sha
                  and report['gallery_head'].get('status')==200 and report['social_get'].get('status')==200
                  and report['social_get'].get('sha256')==digest and report['social_head'].get('status')==200
                  and report['social_get'].get('content_length')=='12630'
                  and report['social_head'].get('content_length')=='12630')
          if not good:
              raise SystemExit('Read-only diagnostic did not pass; review response statuses and Worker routing. NO R2 WRITES.')
          print('R2_SOCIAL_CANARY_PUBLIC_VERIFIED', json.dumps({'url':canary,'bytes':12630,'sha256':digest,'GET':200,'HEAD':200}))
          PY
      - name: Archive safe diagnostic record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-social-read-only-route-diagnostic
          path: canary-read-diagnostic.json
          if-no-files-found: warn
