name: Editorial test preview
on:
  pull_request:
    paths:
      - 'test/**'
      - 'tests/editorial-preview.test.mjs'
      - '.github/workflows/editorial-preview.yml'
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/editorial-http.log 2>&1 &
      - run: node tests/editorial-preview.test.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-preview-screenshots
          path: editorial-preview-results/
          if-no-files-found: warn
