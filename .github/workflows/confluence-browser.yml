name: Confluence browser viewport smoke
# Read-only baseline run on unchanged main code; do not merge this audit.
on:
  push:
    branches: [main]
    paths:
      - 'confluence/**'
      - 'tests/confluence-browser.test.mjs'
      - 'tests/confluence-capacity-audit.mjs'
      - 'tests/confluence-completion-browser.mjs'
      - 'tests/confluence-material.test.mjs'
      - 'tests/confluence-adaptive.test.mjs'
      - 'tests/confluence-ui.test.mjs'
      - 'tests/confluence-handoff-browser.mjs'
      - 'tests/confluence-v8-parity-browser.mjs'
      - 'tests/confluence-tissue-accumulation-browser.mjs'
      - 'index.html'
      - 'js/app.js'
      - 'css/nav-lettering.css'
      - 'gallery/index.html'
      - 'about/index.html'
      - 'about/step-by-step/index.html'
      - '.github/workflows/confluence-browser.yml'
  pull_request:
    paths:
      - 'confluence/**'
      - 'tests/confluence-browser.test.mjs'
      - 'tests/confluence-capacity-audit.mjs'
      - 'tests/confluence-completion-browser.mjs'
      - 'tests/confluence-ui.test.mjs'
      - 'tests/confluence-handoff-browser.mjs'
      - 'tests/confluence-v8-parity-browser.mjs'
      - 'tests/confluence-tissue-accumulation-browser.mjs'
      - 'index.html'
      - 'js/app.js'
      - 'css/nav-lettering.css'
      - 'gallery/index.html'
      - 'about/index.html'
      - 'about/step-by-step/index.html'
      - '.github/workflows/confluence-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  viewport:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install chromium
      - name: Verify native material bridge contracts
        run: node --test tests/confluence-material.test.mjs tests/confluence-adaptive.test.mjs tests/confluence-ui.test.mjs
      - name: Audit real drawing-turn capacities across all eight systems
        run: node tests/confluence-capacity-audit.mjs
      - name: Verify every artist completes source marks in φ and equal studies
        run: node tests/confluence-completion-browser.mjs
      - name: Verify browser orientation and all five materials
        run: node tests/confluence-browser.test.mjs
      - name: Verify public Confluence navigation and full-state editor handoff
        run: node tests/confluence-handoff-browser.mjs
      - name: Verify Tissue V8 pixel parity against the solo material engine
        run: node tests/confluence-v8-parity-browser.mjs
      - name: Measure saved monochrome Tissue atmosphere over 27 turns
        run: node tests/confluence-tissue-accumulation-browser.mjs
