name: Rebuild gallery bundle
# Refresh generated gallery bundles after first-installation layout update.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-gallery-bundle.yml'
      - 'gallery/visit/gallery-v2.js'
      - 'gallery/visit/gallery-phi.js'
      - 'package.json'
      - 'gallery/visit/*.mjs'
jobs:
  rebuild:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run gallery:bundle
      - run: npm run gallery:bundle:phi
      - name: Publish reproducible bundles without conflicting with other sessions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A generated minified bundle cannot be merged usefully. If main
          # moved, discard ONLY the runner's local output, fetch the current
          # head and regenerate both bundles from that exact source revision.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            npm run gallery:bundle
            npm run gallery:bundle:phi
            node --check gallery/visit/gallery-phi-bundle.js
            node --test tests/phi-tower-no-graffiti.test.mjs
            git add gallery/visit/gallery-bundle.js gallery/visit/gallery-phi-bundle.js
            if git diff --cached --quiet; then
              echo 'Gallery bundles already match latest sources'
              exit 0
            fi
            git commit -m 'Rebuild gallery bundles from latest source without graffiti'
            if git push origin HEAD:main; then
              echo 'Published source-matched gallery bundles'
              exit 0
            fi
            echo 'Concurrent push; regenerating from fresh source'
          done
          echo 'Could not publish bundle after rebuilding on latest main'
          exit 1
