name: Backfill archived graffiti atlases
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gallery-graffiti-backfill.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gallery-graffiti-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Serve gallery locally for texture rendering
        run: |
          python3 -m http.server 4173 >/tmp/graffiti-backfill-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Generate missing archived indoor atlases
        run: |
          node --input-type=module <<'NODE' > /tmp/graffiti-backfill-dates
          import fs from 'node:fs';
          const floors=JSON.parse(fs.readFileSync('gallery/tower-layouts.json')).floors;
          for(const floor of floors){
            const base='gallery/'+floor.date+'/3d/graffiti';
            if(!fs.existsSync(base+'/desktop/manifest.json')||!fs.existsSync(base+'/mobile/manifest.json'))console.log(floor.date);
          }
          NODE
          while read -r DAY; do
            [ -n "$DAY" ] || continue
            echo "Baking archived exhibition $DAY"
            node automation/build-gallery-graffiti.mjs --date="$DAY" --indoor-only
          done < /tmp/graffiti-backfill-dates
      - name: Verify all dates have complete desktop and mobile atlases
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dates=JSON.parse(fs.readFileSync('gallery/tower-layouts.json')).floors.map(x=>x.date);
          let pages=0;
          for(const date of dates)for(const target of ['desktop','mobile']){
            const dir='gallery/'+date+'/3d/graffiti/'+target;
            const manifest=JSON.parse(fs.readFileSync(dir+'/manifest.json'));
            if(manifest.version!==1||manifest.date!==date||manifest.marks.length<3||manifest.marks.length>5||!manifest.pages.length)throw Error('Incomplete '+dir);
            for(const p of manifest.pages){
              const data=fs.readFileSync(dir+'/'+p.file);
              if(data.length<100||data.subarray(0,8).toString('hex')!=='89504e470d0a1a0a')throw Error('Invalid PNG '+dir+'/'+p.file);
              pages++;
            }
          }
          console.log('Verified '+dates.length+' floors and '+pages+' PNG atlases');
          NODE
      - name: Commit archived graffiti only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery/*/3d/graffiti/
          if git diff --cached --quiet; then
            echo "All archived atlases already present."
          else
            git commit -m "Backfill indoor graffiti atlases for archived tower floors"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
