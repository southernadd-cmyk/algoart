name: ALGO ART V5 Golden Trajectories test

on:
  push:
    paths:
      - '.github/v5-test-trigger'

permissions:
  contents: write

concurrency:
  group: algoart-v5-test
  cancel-in-progress: false

jobs:
  publish-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLIC_SITE_URL: https://southernadd-cmyk.github.io/algoart/
      ALGOART_LOCAL_URL: http://127.0.0.1:4173/
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: algoart-social-live
      SOCIAL_RENDERER_VERSION: '5'
      SOCIAL_FORCE_MODE: spiral
      SOCIAL_COUNT: '3'
      SOCIAL_SEED_SALT: v5-golden-trajectories-test
      SOCIAL_OUTPUT_DIR: social-test-output

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/algoart-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Generate three V5 Golden Trajectories
        env:
          SOCIAL_DATE: '2026-10-06'
        run: npm run social:generate
      - name: Append tests to today's gallery
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const day='2026-10-06';
          const test=JSON.parse(await fs.readFile('social-test-output/'+day+'/queue.json','utf8'));
          const meta=JSON.parse(await fs.readFile('gallery/'+day+'/meta.json','utf8'));
          const old=meta.entries||[];
          for (let i=0;i<test.entries.length;i++) {
            const e=test.entries[i];
            e.id=day+'-'+String(old.length+i+1).padStart(2,'0');
            await fs.copyFile('social-test-output/'+day+'/'+e.imageFile,'gallery/'+day+'/'+e.imageFile);
          }
          const merged=old.map(e=>({id:e.id,seed:e.seed,mode:e.mode,series:e.series,imageFile:e.imageFile,shareUrl:e.shareUrl,rendererVersion:e.rendererVersion,settings:e.settings,copy:{altText:e.altText}})).concat(test.entries);
          test.entries=merged;
          await fs.mkdir('social-output/'+day,{recursive:true});
          for(const e of old){try{await fs.copyFile('gallery/'+day+'/'+e.imageFile,'social-output/'+day+'/'+e.imageFile)}catch{}}
          for(const e of test.entries.slice(old.length)) await fs.copyFile('gallery/'+day+'/'+e.imageFile,'social-output/'+day+'/'+e.imageFile);
          await fs.writeFile('social-output/'+day+'/queue.json',JSON.stringify(test,null,2));
          NODE
          SOCIAL_DATE=2026-10-06 npm run gallery:build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery sitemap.xml robots.txt
          git commit -m "Add three V5 Golden Trajectories tests to daily gallery"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish all three tests to Instagram and Threads
        shell: bash
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          LIVE_PUBLISHING: 'true'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const q=JSON.parse(await fs.readFile('social-test-output/2026-10-06/queue.json','utf8'));
          await fs.writeFile('/tmp/test-items.json',JSON.stringify(q.entries));
          NODE
          for I in 0 1 2; do
            node --input-type=module - "$I" <<'NODE' > /tmp/item.env
          import fs from 'node:fs';
          const i=Number(process.argv[2]), a=JSON.parse(fs.readFileSync('/tmp/test-items.json','utf8')), e=a[i];
          const b=s=>Buffer.from(s||'').toString('base64');
          console.log('FILE='+e.imageFile);
          console.log('IG='+b(e.copy.instagram));
          console.log('TH='+b(e.copy.threads));
          console.log('ALT='+b(e.copy.altText));
          NODE
            . /tmp/item.env
            cp "social-test-output/2026-10-06/$FILE" "/tmp/v5-test-$I.jpg"
            gh release upload "$RELEASE_TAG" "/tmp/v5-test-$I.jpg" --clobber
            export MEDIA_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/v5-test-$I.jpg"
            export CAPTION="$(printf '%s' "$IG" | base64 --decode)"
            export ALT_TEXT="$(printf '%s' "$ALT" | base64 --decode)"
            npm run social:instagram
            export CAPTION="$(printf '%s' "$TH" | base64 --decode)"
            npm run social:threads
          done
