name: Prebuild daily gallery mosaic previews
on:
  pull_request:
    paths:
      - 'automation/build-gallery-previews.py'
      - '.github/workflows/gallery-mosaic-previews.yml'
      - 'gallery/**/meta.json'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/build-gallery-previews.py'
      - 'gallery/**/meta.json'
      - 'gallery/**/archive-preview.jpg'
permissions:
  contents: write
concurrency:
  group: gallery-mosaic-previews
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Build compressed mosaics for all existing days
        run: python automation/build-gallery-previews.py
      - name: Validate generated preview size
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files=list(Path('gallery').glob('*/archive-preview.jpg'))
          assert files, 'No archive previews generated'
          for p in files:
              with Image.open(p) as im:
                  assert im.size == (840,600), (p, im.size)
          print(f'Validated {len(files)} preview images')
          PY
      - name: Commit prebuilt previews
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery/*/archive-preview.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh prebuilt daily gallery mosaic previews"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
