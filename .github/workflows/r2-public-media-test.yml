name: Release A — public MEDIA-ONLY R2 CORS and WebGL tests

# Isolated branch only; no production deploy. A disposable, EMPTY bucket
# separate from the retained PRIVATE backup bucket is mandatory.
# This workflow's first launch runs OFFLINE SELF-TESTS ONLY.
# Real R2 tests require a distinct environment 'archive-media-test' plus
# an explicit follow-up commit message (no recurring schedule).
on:
  push:
    branches:
      - plan/archive-storage-foundation-20261109
    paths:
      - .github/workflows/r2-public-media-test.yml

permissions:
  contents: read

concurrency:
  group: pp-release-a-public-media-test
  cancel-in-progress: false

jobs:
  harness-self-test:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/plan/archive-storage-foundation-20261109' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source and exact-bucket guard, no cloud credentials
        run: |
          python -m py_compile automation/r2-public-media-smoke.py automation/test-public-r2-media.py
          python automation/r2-public-media-smoke.py self-test
          python automation/test-public-r2-media.py --self-test
      - name: Confirm private backup bucket is never referenced in R2 API arguments
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('automation/r2-public-media-smoke.py').read_text()
          assert 'BUCKET="proportion-piece-media-test"' in s
          assert 'BACKUP_BUCKET="proportion-piece-archive-test"' in s
          assert 'Bucket=BACKUP_BUCKET' not in s
          assert '"archive-r2-test"' not in Path('.github/workflows/r2-public-media-test.yml').read_text()
          print('PASS: isolated public-media bucket guard')
          PY

  real-media-browser-test:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Run isolated public R2 media browser test 2026-11-09' && github.ref == 'refs/heads/plan/archive-storage-foundation-20261109' }}
    needs: harness-self-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: archive-media-test
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      R2_MEDIA_ACCESS_KEY_ID: ${{ secrets.R2_MEDIA_ACCESS_KEY_ID }}
      R2_MEDIA_SECRET_ACCESS_KEY: ${{ secrets.R2_MEDIA_SECRET_ACCESS_KEY }}
      R2_MEDIA_BUCKET: proportion-piece-media-test
      R2_MEDIA_PUBLIC_URL: ${{ vars.R2_MEDIA_PUBLIC_URL }}
      R2_MEDIA_TEST_MANIFEST: /tmp/r2-media-browser/manifest.json
      R2_MEDIA_BROWSER_REPORT: /tmp/r2-media-browser/browser-report.json
      AWS_EC2_METADATA_DISABLED: 'true'

    steps:
      - name: Checkout isolated test scripts only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout current published artwork READ-ONLY
        uses: actions/checkout@v4
        with:
          ref: main
          path: live-snapshot
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install isolated R2 and browser dependencies
        run: |
          python -m pip install --disable-pip-version-check 'boto3>=1.34,<2' 'requests>=2.31,<3' 'playwright==1.64.0'
          python -m playwright install --with-deps chromium firefox webkit

      - name: Stage seven REAL original/texture images ONLY in public media test bucket
        id: stage
        run: python automation/r2-public-media-smoke.py stage

      - name: Test public HTTPS bytes, strict CORS, three browser decoders and WebGL
        run: python automation/test-public-r2-media.py

      - name: Clean up ALL disposable test objects, also after failure
        if: always()
        run: python automation/r2-public-media-smoke.py cleanup

      - name: Upload safe evidence, never image bytes or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-a-public-media-browser-${{ github.run_id }}
          path: |
            /tmp/r2-media-browser/browser-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Explain limits
        if: always()
        run: |
          echo '### Public media-only R2 test' >> "$GITHUB_STEP_SUMMARY"
          echo 'Seven real gallery media images from a read-only main checkout; disposable public bucket ONLY.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Tests strict CORS/MIME/hash and browser WebGL; cleans up only unique run keys.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Never tests or enables public access to the private backup bucket.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Development r2.dev tests do NOT clear the production custom-domain or Quest 3 gates.' >> "$GITHUB_STEP_SUMMARY"
