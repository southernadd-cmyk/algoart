name: Capture fresh exhibition screenshots for README
on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-readme-exhibition.mjs'
      - '.github/workflows/readme-exhibition-screenshots.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build current live tower for faithful screenshots
        run: npm run gallery:bundle:phi
      - name: Serve gallery locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/readme-exhibition-http.log 2>&1 &
          sleep 2
      - name: Photograph the real exterior, reception and exhibition floor
        run: node scripts/capture-readme-exhibition.mjs
      - name: Preserve screenshots in repository
        run: |
          # Keep the freshly built tower only for photography; don't publish
          # unrelated bundle changes when committing image files.
          git restore -- gallery/visit/gallery-phi-bundle.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/exhibition-*.jpg docs/images/exhibition-capture-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add fresh documentary screenshots of PROPORTION PIECE gallery'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-exhibition-screenshots
          path: docs/images/exhibition-*
          if-no-files-found: ignore
