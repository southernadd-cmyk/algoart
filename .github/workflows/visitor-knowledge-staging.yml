name: Rebuild test gallery visitor chat
on:
  push:
    branches: [main]
    paths:
      - 'test/virtual-gallery/phi-visitor-chat.mjs'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run updated chatbot tests
        run: node --test test/virtual-gallery/phi-visitor-chat.test.mjs
      - name: Install bundle dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild TEST tower
        run: npx esbuild test/virtual-gallery/gallery-phi.js --bundle --minify --format=esm --platform=browser --target=es2022 --outfile=test/virtual-gallery/gallery-phi-bundle.js
      - name: Commit TEST bundle only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/virtual-gallery/gallery-phi-bundle.js
          if ! git diff --staged --quiet; then
            git commit -m 'Publish tested visitor chat discovery bundle'
            git push
          fi
