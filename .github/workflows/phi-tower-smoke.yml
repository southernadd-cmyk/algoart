name: Phi tower walkthrough smoke
on:
  push:
    paths:
      - 'test/virtual-gallery/phi-tower.html'
      - 'test/virtual-gallery/full-engine.html'
      - 'gallery/visit/gallery-v2.js'
      - 'gallery/visit/gallery-phi-test.js'
      - 'gallery/visit/gallery-phi.js'
      - 'gallery/visit/gallery-phi-bundle.js'
      - 'gallery/visit/index.html'
      - 'tests/phi-public-entry.test.mjs'
      - 'tests/full-engine-walkthrough.test.mjs'
      - 'tests/phi-full-engine-adapter.test.mjs'
      - 'tests/phi-presentation.test.mjs'
      - 'test/virtual-gallery/phi-full-engine-adapter.mjs'
      - 'gallery/visit/phi-*.mjs'
      - 'tests/phi-tower-smoke.mjs'
      - 'tests/phi-desk-hologram-browser.mjs'
      - '.github/workflows/phi-tower-smoke.yml'
  workflow_dispatch:
jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/phi-full-engine-adapter.test.mjs tests/phi-presentation.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/phi-tower-http.log 2>&1 &
      - name: Build current live and test tower bundles
        run: |
          npm run gallery:bundle:phi
          node automation/build-phi-test-room-signs.mjs
      - name: Verify and photograph reception hologram in both towers
        run: node tests/phi-desk-hologram-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phi-desk-hologram
          path: phi-tower-results/hologram/
          if-no-files-found: ignore
      - run: node tests/phi-tower-smoke.mjs
      # Fail quickly on dated mobile entry/touch regressions before the longer floor walkthrough.
      - run: node tests/phi-public-entry.test.mjs
      - run: node tests/full-engine-walkthrough.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phi-tower-walkthrough
          path: phi-tower-results/
          if-no-files-found: ignore
