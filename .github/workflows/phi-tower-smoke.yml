name: Phi tower walkthrough smoke
on:
  push:
    paths:
      - 'test/virtual-gallery/phi-tower.html'
      - 'gallery/visit/phi-*.mjs'
      - 'tests/phi-tower-smoke.mjs'
      - '.github/workflows/phi-tower-smoke.yml'
  workflow_dispatch:
jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/phi-tower-http.log 2>&1 &
      - run: node tests/phi-tower-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phi-tower-walkthrough
          path: phi-tower-results/
          if-no-files-found: ignore
