name: Benchmark test tower room visibility culling A/B
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phi-room-culling-benchmark.yml'
      - 'tests/phi-room-culling-browser-benchmark.mjs'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify conservative room-culling correctness tests
        run: node --test tests/phi-room-visibility-culler.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Build test source locally, without modifying live
        run: |
          ./node_modules/.bin/esbuild test/virtual-gallery/gallery-phi.js --bundle --minify --format=esm --platform=browser --target=es2022 --outfile=test/virtual-gallery/gallery-phi-bundle.js
          node --check test/virtual-gallery/gallery-phi-bundle.js
      - name: Start local site
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/phi-room-culling-http.log 2>&1 &
      - name: Compare identical rooms in Chromium software WebGL
        run: node tests/phi-room-culling-browser-benchmark.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phi-room-culling-benchmark
          path: phi-room-culling-benchmark/results.json
          if-no-files-found: ignore
