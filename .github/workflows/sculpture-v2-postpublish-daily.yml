name: Sculpture V2 post-publication daily archive

# Independently follows a SUCCESSFUL scheduled gallery build.
# It must not modify archived gallery files or run for the
# R2 canary. Date-pinned recovery requires a published R2-only edition.
on:
  pull_request:
    paths:
      - 'automation/publish-sculpture-v2-daily-r2.py'
      - 'tests/test_sculpture_v2_daily_r2.py'
      - '.github/workflows/sculpture-v2-postpublish-daily.yml'
  workflow_dispatch:
    inputs:
      recovery_date:
        description: 'Archived R2-only gallery date (YYYY-MM-DD)'
        required: true
        type: string
  workflow_run:
    workflows: ['Build ALGO ART daily gallery']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  # PR checks for the same change should replace earlier runs. Production V2
  # uploads remain isolated by their upstream workflow-run identity.
  group: sculpture-v2-postpublish-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Offline immutable-publication and gallery-isolation regression
        run: |
          python3 -m pip install 'boto3>=1.37,<2'
          python3 -m py_compile automation/publish-sculpture-v2-daily-r2.py
          python3 -m unittest discover -s tests -p test_sculpture_v2_daily_r2.py -v

  bake-after-gallery-success:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_branch == 'main')
    needs: safety
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: archive-media-test
    env:
      UPSTREAM_STARTED: ${{ github.event.workflow_run.run_started_at || format('{0}T12:00:00Z', inputs.recovery_date) }}
      UPSTREAM_RUN: ${{ github.event.workflow_run.id || github.run_id }}
      V2_RECOVERY_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_date || '' }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore R2-only painting sources to ephemeral runner for V2 sculpture bake
        shell: bash
        run: |
          set -euo pipefail
          DAY=$(TZ=Europe/London date -d "$UPSTREAM_STARTED" +%F)
          MANIFEST="gallery/$DAY/media-publication.json"
          if [[ ! -f "$MANIFEST" ]]; then
            echo "V2_SOURCE_LEGACY_CHECKOUT date=$DAY"
            exit 0
          fi
          if ! python3 - "$MANIFEST" <<'PY'
          import json,sys
          manifest=json.load(open(sys.argv[1]))
          assert manifest['published'] is True
          sys.exit(0 if manifest.get('pagesFallback') is False else 1)
          PY
          then
            echo "V2_SOURCE_DUAL_WRITE_CHECKOUT date=$DAY"
            exit 0
          fi
          python3 automation/r2-daily-media.py restore "$MANIFEST" \
            --restore-to "$RUNNER_TEMP" > "$RUNNER_TEMP/v2-r2-restore.json"
          SRC=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["restoredTo"])' "$RUNNER_TEMP/v2-r2-restore.json")
          test -d "$SRC/gallery/$DAY"
          cp -a "$SRC/gallery/$DAY/." "gallery/$DAY/"
          echo "V2_SOURCE_R2_ONLY_RESTORED date=$DAY"
      - name: Verify published gallery date and solo portrait roster
        id: roster
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPSTREAM_STARTED"
          DAY=$(TZ=Europe/London date -d "$UPSTREAM_STARTED" +%F)
          test "$DAY" \> "2026-11-10"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$DAY" == "$V2_RECOVERY_DATE"
            test "$DAY" \< "$(TZ=Europe/London date +%F)"
            echo "V2_DATE_PINNED_RECOVERY date=$DAY"
          fi
          # An armed R2 canary deliberately holds the scheduled gallery build.
          # A successful no-op upstream run MUST NOT trigger any V2 baking
          # or produce a misleading error before the manual canary.
          if [[ ! -e "gallery/$DAY/meta.json" ]]; then
            printf 'date=%s\neligible=0\n' "$DAY" >> "$GITHUB_OUTPUT"
            echo "V2_DAILY_SKIPPED_UPSTREAM_HOLD date=$DAY"
            exit 0
          fi
          test -s "gallery/$DAY/meta.json"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            DAY="$DAY" python3 - <<'RECOVERY_MANIFEST'
          import json,os
          from pathlib import Path
          day=os.environ['DAY']
          m=json.loads((Path('gallery')/day/'media-publication.json').read_text())
          assert m['date']==day and m['published'] is True and m['pagesFallback'] is False
          print('V2_RECOVERY_R2_ONLY_CONFIRMED',day)
          RECOVERY_MANIFEST
          fi
          DAY="$DAY" python3 - <<'PY'
          import json,os
          from pathlib import Path
          date=os.environ['DAY']
          base=Path('gallery')/date
          meta=json.loads((base/'meta.json').read_text())
          assert meta['date']==date
          solo=[x for x in meta['entries'] if x.get('orientation')=='portrait'
                and x.get('material')!='confluence']
          assert solo, 'No source portraits for V2'
          assert len({e['imageFile'] for e in solo})==len(solo)
          assert all((base/e['imageFile']).is_file() for e in solo)
          print('V2_DAILY_GALLERY_PUBLISHED_OK',date,'eligible',len(solo))
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write(f'eligible={len(solo)}\n')
          PY
          echo "date=$DAY" >> "$GITHUB_OUTPUT"
          echo "V2 postpublication follows successful upstream run $UPSTREAM_RUN"
      - name: Install independent V2 baker without changing gallery
        if: steps.roster.outputs.eligible != '0'
        run: |
          npm ci
          npx playwright install --only-shell chromium
          node --input-type=module <<'PLAYWRIGHT_SMOKE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage();
            await page.setContent('<canvas width="4" height="4"></canvas>');
            const ok=await page.evaluate(()=>document.querySelector('canvas').toDataURL('image/png').startsWith('data:image/png;base64,'));
            if(!ok) throw Error('Chromium canvas smoke failed');
            console.log('R2_CHROMIUM_SMOKE_OK');
          } finally {
            await browser.close();
          }
          PLAYWRIGHT_SMOKE
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v2-daily-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 1
          done
          node automation/build-sculpture-v2-baker.mjs
      - name: Bake V2 desktop and mobile ONLY into ephemeral scratch
        if: steps.roster.outputs.eligible != '0'
        shell: bash
        run: |
          node automation/build-sculpture-v2-packs.mjs --date "${{ steps.roster.outputs.date }}" \
            --quality both --out "$RUNNER_TEMP/v2-daily"
          V2_BAKE_OUT="$RUNNER_TEMP/v2-daily" \
            node --test tests/sculpture-v2-packs.test.mjs
          python3 automation/publish-sculpture-v2-daily-r2.py \
            --date "${{ steps.roster.outputs.date }}" --out "$RUNNER_TEMP/v2-daily" --dry-run
      - name: Upload verified daily mesh packs create-only to existing R2
        if: steps.roster.outputs.eligible != '0'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_MEDIA_ACCESS_KEY_ID: ${{ secrets.R2_MEDIA_ACCESS_KEY_ID }}
          R2_MEDIA_SECRET_ACCESS_KEY: ${{ secrets.R2_MEDIA_SECRET_ACCESS_KEY }}
          V2_PUBLISH_DATE: ${{ steps.roster.outputs.date }}
        run: |
          python3 -m pip install 'boto3>=1.37,<2'
          python3 automation/publish-sculpture-v2-daily-r2.py \
            --date "${{ steps.roster.outputs.date }}" --out "$RUNNER_TEMP/v2-daily"
      - name: Retain small source-scoped daily V2 audit (never V1)
        if: ${{ always() && steps.roster.outputs.eligible != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-daily-audit-${{ steps.roster.outputs.date }}
          path: ${{ runner.temp }}/v2-daily/bake-report.json
          retention-days: 14
          if-no-files-found: warn
